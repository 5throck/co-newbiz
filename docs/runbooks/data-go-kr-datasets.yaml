lang: ko
lang_reason: proper-noun
# data.go.kr dataset registry - the single authoritative list of every data.go.kr
# (공공데이터포털) Open API dataset this project uses or plans to use.
#
# Why this exists: one DATA_GO_KR_API_KEY (the portal's service key) is issued per
# account, but each dataset still needs its own 활용신청 (usage application) and
# approval before that key works against it. An unapproved dataset answers
# HTTP 403 SERVICE_KEY_IS_NOT_REGISTERED_ERROR (resultCode 30). See
# skills/k-opendata/SKILL.md (Portal Activation Flow, Failure Modes).
#
# Procedure for a NEW dataset (apply -> register -> build):
#   1. Apply: open the dataset's openapi.do page on data.go.kr and press 활용신청.
#   2. Register: add an entry below in the same pull request that adds the code.
#      Start with status planned and application_status pending.
#   3. Build: write the code only after the application is approved; then set
#      status in_use, application_status approved, and approved_on.
#   tests/unit/data-go-kr-registry.test.ts fails when code or a skill references an
#   apis.data.go.kr endpoint that is not listed here.
#
# Account type and expiry: every approval below is a development account
# (개발계정). An approval expires (expires_on); renew it with 활용연장 on data.go.kr
# before that date or the dataset answers 403 again. Earliest expiry: 2028-09-03
# (the seven 관세청 datasets), then 2028-11-26 (금융위원회_채권기본정보).
#
# application_status is a record, not a live check. Source of the 2026-11-26 values:
# data.go.kr 마이페이지 > 활용신청 현황 (10 applications, all 승인, none pending,
# rejected, or expired), read by the PM with the project owner logged in. The repo
# cannot read that page; re-confirm there whenever this file is edited.
#
# Fields:
#   id                  unique slug
#   name_ko             official Korean dataset name as shown on data.go.kr
#   provider            providing organization
#   dataset_id          data.go.kr dataset number (the 15xxxxxx in /data/<id>/openapi.do), null if not verified
#   url                 openapi.do page, null if dataset_id is unknown
#   endpoints           service URLs without scheme found in code or skills; empty when the dataset has no
#                       confirmed code endpoint (see endpoint_mapping)
#   endpoint_mapping    verified | unverified | none - whether the endpoint(s) are a certain match for name_ko
#   env_var             credential variable (root .env)
#   status              in_use | planned
#   application_status  approved | pending | not_applied | unknown
#   account_type        development | operation | null
#   applied_on          ISO date of the 활용신청, null if unknown
#   approved_on         ISO date of approval, null when the portal does not show it
#   expires_on          ISO date the approval lapses, null when the portal shows none
#   evidence            what supports application_status (date and source)
#   used_by             app feature / script / skill that calls the dataset
#   owner               accountable agent
#   notes               caveats
#
# Considered, not used (deliberately NOT registered as datasets; add a normal entry
# only if a feature ever needs it):
#   - 관세청_수출이행내역 (dataset 15126269, https://www.data.go.kr/data/15126269/openapi.do):
#     per-export-declaration fulfilment data (acceptance date, departure date, shipped
#     and remaining weight). Its Open API also requires a separate UNI-PASS membership
#     on top of the 활용신청. No code or skill uses it and no feature needs
#     per-declaration granularity, so it is not applied for and not tracked above.
#     (skills/k-opendata/SKILL.md mentions it for discovery only.)

