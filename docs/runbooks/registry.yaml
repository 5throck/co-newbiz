# Runbook & documentation registry — the managed list of operational docs.
#
# SSOT for which playbooks / guidelines / manuals exist, who they are for,
# and where their language pairs live. The library projection
# (app/web-next/lib/library.generated.ts) must carry an entry for every file
# listed here, and scripts/co-newbiz/runbook-validate.ts (bun run
# runbooks:validate, also enforced by tests/unit/runbook-registry.test.ts)
# checks this file against the filesystem and the projection.
#
# Fields:
#   id        unique registry id (rb- = runbook, gdl- = guideline, man- = manual)
#   layer     runbook | guideline | manual
#   title     display title
#   audience  who executes/reads it
#   owner     accountable agent/role
#   screens   app routes the doc governs (optional)
#   files     en/ko language pair (paths relative to repo root)
#   status    active | draft
#   followups planned work that extends this doc (optional)

entries:
  # ── Runbooks ─────────────────────────────────────────────────────────────
  - id: rb-deal-deletion
    layer: runbook
    title: "Deal Deletion Playbook — Marking, Archive, and Audit"
    audience: deal leads, analysts
    owner: compliance-officer
    screens: ["/projects", "/projects/archives", "/our-company", "/synergy", "/route-decision", "/opportunities"]
    files:
      en: docs/runbooks/deal-deletion-playbook.md
      ko: docs/runbooks/deal-deletion-playbook_ko.md
    status: active
    followups: docs/designs/2026-09-10-deletion-followups-plan.md

  - id: rb-deployment
    layer: runbook
    title: "Runbook — Deployment and Release"
    audience: release-engineer, platform-lead, operators
    owner: release-engineer
    files:
      en: docs/runbooks/deployment.md
      ko: docs/runbooks/deployment_ko.md
    status: active

  - id: rb-backup-restore
    layer: runbook
    title: "Runbook — Backup & Restore"
    audience: operators, dba
    owner: dba
    files:
      en: docs/runbooks/backup-restore.md
      ko: docs/runbooks/backup-restore_ko.md
    status: active

