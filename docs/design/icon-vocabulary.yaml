# icon-vocabulary.yaml — co-newbiz registered icon vocabulary (design-lint §5.3)
#
# DECIDED iconography stance (2026-10-22 registry-authoring run):
# co-newbiz uses a dependency-free UNICODE GLYPH policy — no icon font and no
# SVG sprite library. There is no docs/design.md `iconography` block, so the
# lint's built-in conventions (<Icon name="..."> and icon="...") apply; the only
# icon-attribute surface in the app is the SectionToolbar `icon` prop
# (components/layout.tsx), whose non-empty values are registered below.
#
# Two sanctioned tiers:
#   1. functional text glyphs — the P5 multi-encoded signal set and navigation/
#      state indicators (design-guide.md P5 "signal lights: ● done / ◐ current /
#      ○ pending / ✕ terminated"; §3.2 status pairing ✓ ⚠ ✕ ○). System-font
#      text, theme-colored via tokens.
#   2. semantic emoji markers — the de-facto section-badge standard rendered in
#      .sizing-step-badge / status-chip / heading contexts. These carry meaning
#      (AI-proposal marking, waiver, SWOT sections) and are therefore registered,
#      not banned. Doctrine basis: design-guide.md P4 (agentic-first UI needs a
#      visible AI marker) and design-philosophy.md boundary #2.
#
# Rules (review-enforced):
#   - A glyph NEVER stands alone: status/decision semantics are always color +
#     glyph + text (design-guide.md P5); decorative badges sit next to a text
#     heading or inside a labelled control.
#   - Purely decorative glyphs SHOULD carry aria-hidden="true" (existing practice,
#     e.g. AI-draft chips); the declarative aria_label_required flag is false for
#     every entry because no registered glyph is used icon-only today. Any future
#     icon-ONLY interactive control requires aria-label (design-guide.md §7) and
#     must flip its entry's aria_label_required to true at registration time.
#   - New glyphs/emoji enter only via the design-phase gate: register here before
#     first use. Glyphs observed in the app but NOT registered are deviations —
#     see the review-board triage list of the 2026-10-22 run.
version: 1
icons:
  # ── Tier 1 — functional text glyphs (system font, token-colored) ───────────
  # P5 signal-light set
  - id: glyph-signal-done
    source: unicode-text-glyph
    contexts: [process-light, stage-stepper, status-chip]
    aria_label_required: false
  - id: glyph-signal-current
    source: unicode-text-glyph
    contexts: [process-light, stage-stepper, status-chip]
    aria_label_required: false
  - id: glyph-signal-pending
    source: unicode-text-glyph
    contexts: [process-light, status-chip]
    aria_label_required: false
  - id: glyph-terminated
    source: unicode-text-glyph
    contexts: [process-light, stage-stepper, status-chip]
    aria_label_required: false
  # status pairing set (design-guide.md §3.2)
  - id: glyph-check
    source: unicode-text-glyph
    contexts: [status-chip, checklist, dd-checklist]
    aria_label_required: false
  - id: glyph-selected
    source: unicode-text-glyph
    contexts: [selection indicator, dd-checklist]
    aria_label_required: false
  - id: glyph-warning
    source: unicode-text-glyph
    contexts: [status-chip, warning notes]
    aria_label_required: false
  # state / rating / terminal markers
  - id: glyph-escalation
    source: unicode-text-glyph
    contexts: [status-chip tone marker, finding lists, reconfirm cues]
    aria_label_required: false
  - id: glyph-square-terminal
    source: unicode-text-glyph
    contexts: [killed/withdrawn chip icon, staleness marker]
    aria_label_required: false
  - id: glyph-pin
    source: unicode-text-glyph
    contexts: [industry pinning, ratings]
    aria_label_required: false
  - id: glyph-spark
    source: unicode-text-glyph
    contexts: [status-chip AI-draft marker]
    aria_label_required: false
  - id: glyph-refresh
    source: unicode-text-glyph
    contexts: [rerun actions, revised state icon]
    aria_label_required: false
  # expand/collapse carets
  - id: glyph-caret-down
    source: unicode-text-glyph
    contexts: [expand toggles, more-menus]
    aria_label_required: false
  - id: glyph-caret-up
    source: unicode-text-glyph
    contexts: [collapse toggles]
    aria_label_required: false
  - id: glyph-caret-right-small
    source: unicode-text-glyph
    contexts: [collapsed toggles, nesting indicators]
    aria_label_required: false
  - id: glyph-caret-down-small
    source: unicode-text-glyph
    contexts: [expanded toggles]
    aria_label_required: false
  - id: glyph-caret-play
    source: unicode-text-glyph
    contexts: [nav arrows]
    aria_label_required: false
  # flow / direction arrows
  - id: glyph-arrow-right
    source: unicode-text-glyph
    contexts: [flow derivation, handoff, table arrows]
    aria_label_required: false
  - id: glyph-arrow-left
    source: unicode-text-glyph
    contexts: [back links, flow derivation]
    aria_label_required: false
  - id: glyph-arrow-up
    source: unicode-text-glyph
    contexts: [trend indicators]
    aria_label_required: false
  - id: glyph-arrow-down
    source: unicode-text-glyph
    contexts: [trend indicators]
    aria_label_required: false
  - id: glyph-arrow-both
    source: unicode-text-glyph
    contexts: [bidirectional linkage]
    aria_label_required: false
  - id: glyph-branch-nested
    source: unicode-text-glyph
    contexts: [nested list indentation]
    aria_label_required: false

  # ── Tier 2 — semantic emoji markers (section badges / AI-proposal marker) ──
  # Boundary #2 marker: content proposed by the AI (design-philosophy.md #2,
  # design-guide.md P4). Pairs with "AI" text; wrap in aria-hidden when purely
  # decorative (existing practice).
  - id: emoji-ai-marker
    source: unicode-emoji
    contexts: [ai action buttons, ai brief/judgement headings, synergy ai proposals]
    aria_label_required: false
    # Action-button standard (2026-10-22 사용자 리포트 — AI 기능 버튼 표준화):
    #   AI를 제공하는 버튼은 [아이콘 + 기능 + (AI)] 형태로 통일한다 — 예)
    #   "🤖 추천 생성 (AI)", "🤖 재생성 (AI)", "초안 버리기 (AI)".
    #   생성·재생성 계열은 🤖 접두, AI 초안에 대한 보조 동작은 (AI) 접미만.
    #   판정 근거: 위 경계 #2 마커 규칙과 동일 — 사람이 AI 개입 여부를
    #   버튼에서 즉시 식별하게 한다.
  # Governance semantics
  - id: emoji-waiver
    source: unicode-emoji
