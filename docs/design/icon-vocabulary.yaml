  - id: emoji-compass
    source: unicode-emoji
    contexts: [post-management guidance headings]
    aria_label_required: false
  - id: emoji-rocket
    source: unicode-emoji
    contexts: [promotion-to-project actions]
    aria_label_required: false
  - id: emoji-clipboard
    source: unicode-emoji
    contexts: [checklist/artifact headings]
    aria_label_required: false
  - id: emoji-lock
    source: unicode-emoji
    contexts: [locked states, permission cues]
    aria_label_required: false
  - id: emoji-search
    source: unicode-emoji
    contexts: [inspection/verification cues]
    aria_label_required: false
  - id: emoji-construction
    source: unicode-emoji
    contexts: [establishment/execution headings]
    aria_label_required: false
  # SWOT badge family (AI company profile tabs)
  - id: emoji-company
    source: unicode-emoji
    contexts: [company profile headings]
    aria_label_required: false
  - id: emoji-swot-strength
    source: unicode-emoji
    contexts: [SWOT strength section]
    aria_label_required: false
  - id: emoji-swot-weakness
    source: unicode-emoji
    contexts: [SWOT weakness section]
    aria_label_required: false
  - id: emoji-swot-opportunity
    source: unicode-emoji
    contexts: [SWOT opportunity section]
    aria_label_required: false
  - id: emoji-swot-threat
    source: unicode-emoji
    contexts: [SWOT threat section]
    aria_label_required: false
  # SectionToolbar icon= prop values (the app's only icon-attribute surface)
