# OpenAPI 3.1 description of the co-newbiz REST API — the as-built surface.
#
# SSOT relationships (docs/mcp-integration.md §6): every route declared in
# app/server/*.ts must appear here, and every entry here must have a
# declared route — tests/unit/openapi.test.ts enforces set equality in BOTH
# directions, so spec drift fails the suite instead of accumulating.
# Human-readable index: docs/api-spec.md. This file documents only what is
# implemented; forward-design endpoints stay in api-spec.md until built.

openapi: 3.1.0
info:
  title: co-newbiz REST API
  version: 1.4.0
  description: >-
    REST surface of co-newbiz (Stage 5 Waves 5.6-5.7 + engine-1 run versioning + engine-2 simulations). Every response uses the standard envelope {data, meta, error} (api-spec.md §9). Project-scoped reads return 404 — identical to "does not
    exist" — for projects the caller cannot see (FR-SEC-01): membership is resolved first, so project existence itself is never an oracle. Write endpoints are audit-logged (FR-SEC-07).
servers:
  - url: http://localhost:8787
    description: Default bind (app/server/index.ts; CO_NEWBIZ_PORT overrides)
security:
  - sessionCookie: []
  - bearerToken: []
tags:
  - name: Health
  - name: Auth
    description: Account lifecycle and sessions (api-spec.md §2).
  - name: Tokens
    description: Bearer API tokens for MCP/CLI clients (api-spec.md §2).
  - name: Projects
    description: Projects and membership (api-spec.md §3).
  - name: Governance
    description: RAG, approvals, compliance, waivers, interpretations, procedures (api-spec.md §5).
  - name: Analysis
    description: Market observations, change log, assumptions, run-based versioning, and Monte Carlo simulations (api-spec.md §4/§7; Waves 5.7B/engine-1/engine-2).
  - name: Deal Review
    description: DD findings, antitrust, incentives, liabilities, sites, partners, permits, value chain (api-spec.md §6; Wave 5.7B).
  - name: Monitoring
    description: Watches, notifications, and the venture/JV scorecard views over migration 0024 (api-spec.md §7; ADR-0059 E.4).
  - name: Glossary
    description: Term lookup backing the UI tooltip and MCP lookup_term (api-spec.md §7).
  - name: Admin
    description: Admin console — never MCP-exposed (api-spec.md §8). Admin role required; project data stays off these routes.
paths:
  /api/health:
    get:
      operationId: health
      summary: Liveness probe (no auth).
      tags:
        - Health
      security: []
      responses:
        '200':
          $ref: '#/components/responses/Ok'
  /api/auth/register:
    post:
      operationId: register
      summary: Self-signup — always role=viewer, status=pending (no auth).
      tags:
        - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - userId
                - password
              properties:
                userId:
                  type: string
                password:
                  type: string
                displayName:
                  type: string
      responses:
        '201':
          $ref: '#/components/responses/Created'
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/auth/login:
    post:
      operationId: login
      summary: Credential login — issues the session cookie.
      tags:
        - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - userId
                - password
              properties:
                userId:
                  type: string
                password:
                  type: string
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '423':
          $ref: '#/components/responses/Locked'
  /api/auth/me:
    get:
      operationId: me
      summary: Current identity — also the must-change-password gate's status probe.
      tags:
        - Auth
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/auth/logout:
    post:
      operationId: logout
      summary: Revoke exactly the current session or token.
      tags:
        - Auth
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/auth/password-change:
    post:
      operationId: changePassword
      summary: Change password — history reuse refused; all other sessions revoked.
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - currentPassword
                - newPassword
              properties:
                currentPassword:
                  type: string
                newPassword:
                  type: string
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/auth/password-reset:
    post:
      operationId: resetPassword
      summary: Admin-initiated reset — forces must_change_password.
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - userId
                - tempPassword
              properties:
                userId:
                  type: string
                tempPassword:
                  type: string
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/tokens:
    post:
      operationId: issueToken
      summary: Issue a Bearer API token — plaintext returned exactly once.
      tags:
        - Tokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - label
              properties:
                label:
                  type: string
                scopes:
                  type: array
                  items:
                    type: string
                    enum:
                      - read
                      - write
      responses:
        '201':
          $ref: '#/components/responses/Created'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    get:
      operationId: listTokens
      summary: List the caller's tokens — identity columns only, hash never leaves the engine.
      tags:
        - Tokens
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/tokens/{id}:
    delete:
      operationId: revokeToken
      summary: Revoke a token — owner-scoped (someone else's id is indistinguishable from nonexistent).
      tags:
        - Tokens
      parameters:
        - $ref: '#/components/parameters/TokenId'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/projects:
    get:
      operationId: listProjects
      summary: Membership-filtered project list; MNPI excluded by default (include_mnpi=1 opts in).
      tags:
        - Projects
      parameters:
        - name: include_mnpi
          in: query
          schema:
            type: string
            enum:
              - '1'
              - 'true'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createProject
      summary: Create a project — analyst+ role; creator becomes lead automatically.
      tags:
        - Projects
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - project_no
              properties:
                project_no:
                  type: string
      responses:
        '201':
          $ref: '#/components/responses/Created'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/projects/{id}:
    get:
      operationId: getProject
      summary: Project detail — 404 (never 403) for a non-member; MNPI banner flag in meta.
      tags:
        - Projects
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/projects/{id}/members:
    get:
      operationId: listMembers
      summary: Active members of a visible project.
      tags:
        - Projects
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: grantMembership
      summary: Grant membership — project lead only; need-to-know basis mandatory (engine-enforced).
      tags:
        - Projects
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - userId
                - project_role
              properties:
                userId:
                  type: string
                project_role:
                  type: string
                  enum:
                    - lead
                    - contributor
                    - reviewer
                    - observer
                need_to_know_basis:
                  type: string
      responses:
        '201':
          $ref: '#/components/responses/Created'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: revokeMember
      summary: Revoke a member's membership (?user_id=). Lead only; audited.
      tags:
        - Projects
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      operationId: changeMemberRole
      summary: Change a member's project role. Lead only; audited.
      tags:
        - Projects
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/projects/{id}/members/{userId}:
    delete:
      operationId: revokeMembership
      summary: Revoke membership — project lead only.
      tags:
        - Projects
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/MemberUserId'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/projects/{id}/classification:
    get:
      operationId: getClassification
      summary: Sensitivity / mnpi_flag / wall_group for a visible project.
      tags:
        - Projects
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: setClassification
      summary: Set classification — admin AND project member (account model has no counsel role; see projects.ts module doc).
      tags:
        - Projects
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - sensitivity
              properties:
                sensitivity:
                  type: string
                  enum:
                    - public
                    - internal
                    - confidential
                    - restricted
                mnpi_flag:
                  type:
                    - boolean
                    - integer
                wall_group:
                  type:
                    - string
                    - 'null'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/projects/{id}/rag:
    get:
      operationId: getRag
      summary: Latest RAG assessment per dimension — rationale always included (no color-only signal).
      tags:
        - Governance
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/projects/{id}/rag/history:
    get:
      operationId: getRagHistory
      summary: RAG grade transitions, newest first.
      tags:
        - Governance
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/projects/{id}/approval-chain:
    get:
      operationId: getApprovalChain
      summary: Entity/Group IC gates in order, with blocked_reason when applicable.
      tags:
        - Governance
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/projects/{id}/compliance-checks:
    get:
      operationId: getComplianceChecks
      summary: Gate-blocking compliance check status.
      tags:
        - Governance
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/projects/{id}/waivers:
    get:
      operationId: listWaivers
      summary: Active and expired waivers for a visible project.
      tags:
        - Governance
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: fileWaiver
      summary: File a waiver request — project lead; expires_at mandatory (indefinite waivers refused, ADR-0036); approve=true also needs admin.
      tags:
        - Governance
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - governance_doc_id
                - clause_ref
                - reason
                - approver_role
                - expires_at
              properties:
                governance_doc_id:
                  type: string
                clause_ref:
                  type: string
                reason:
                  type: string
                approver_role:
                  type: string
                expires_at:
                  type: string
                approve:
                  type: boolean
      responses:
        '201':
          $ref: '#/components/responses/Created'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/projects/{id}/pmi/key-talent:
    get:
      operationId: listKeyTalent
      summary: Close-locked key-talent roster (feeds the 90d attrition tripwire).
      tags:
        - PMI
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: addKeyTalent
      summary: Add a roster row — analyst+; role_ref is a role key, never a person's name (ADR-0039); audited.
      tags:
        - PMI
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - role_ref
                - locked_at
              properties:
                role_ref:
                  type: string
                  description: Role key like C-EO-001
                status:
                  type: string
                  enum:
                    - active
                    - departed_regretted
                    - departed_planned
                exit_date:
                  type:
                    - string
                    - 'null'
                locked_at:
                  type: string
      responses:
        '201':
          $ref: '#/components/responses/Created'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/projects/{id}/pmi/synergy-certifications:
    get:
      operationId: listSynergyCertifications
      summary: Finance synergy run-rate certifications (the BAU-exit completeness fact).
      tags:
        - PMI
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: addSynergyCertification
      summary: Record a certification row — analyst+; certified means >=9000 bp AND >=2 quarters; audited.
      tags:
        - PMI
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - run_rate_bp
                - sustained_quarters
                - certified_by
                - baseline_locked_at
                - signed_at
              properties:
                run_rate_bp:
                  type: integer
                  minimum: 0
                  maximum: 10000
                  description: Basis points of committed cost-synergy run-rate achieved (9000 = 90%)
                sustained_quarters:
                  type: integer
                  minimum: 1
                certified_by:
                  type: string
                baseline_locked_at:
                  type: string
                signed_at:
                  type: string
      responses:
        '201':
          $ref: '#/components/responses/Created'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/projects/{id}/deal-shape-evaluations:
    get:
      operationId: listDealShapeEvaluations
      summary: P3 deal-shape candidate evaluations (feeds the zero-viable recycle criterion).
      tags:
        - DealShape
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: addDealShapeEvaluation
      summary: Record one candidate shape's two-stage verdict — analyst+; audited.
      tags:
        - DealShape
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - shape
                - intent
                - viable
              properties:
                shape:
                  type: string
                  enum:
                    - full_acquisition
                    - majority_stake
                    - spv
                    - holdco_route
                    - joint_venture
                    - minority_stake
                    - license_in
                    - co_development
                intent:
                  type: string
                  enum:
                    - integration
                    - capability_access
                viable:
                  type: boolean
                evaluated_at:
                  type: string
      responses:
        '201':
          $ref: '#/components/responses/Created'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/projects/{id}/incentive-deadlines:
    get:
      operationId: listIncentiveDeadlines
      summary: Recorded incentive-package deadlines (earliest binds; feeds the permit-path tripwire).
      tags:
        - GreenField
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: addIncentiveDeadline
      summary: Record an incentive deadline — analyst+; audited.
      tags:
        - GreenField
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - incentive_ref
                - deadline
              properties:
                incentive_ref:
                  type: string
                deadline:
                  type: string
                  format: date-time
                source:
                  type: string
      responses:
        '201':
          $ref: '#/components/responses/Created'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/projects/{id}/dimension-inputs:
    get:
      operationId: listDimensionInputs
      summary: Live judged-variable assertions (?var_key= narrows) — meta.count / meta.reviewed.
      tags:
        - Evidence
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: var_key
          in: query
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: assertDimensionInput
      summary: Assert a judged fact — analyst+; lands UNREVIEWED by design (a cross-domain review is a separate act); audited.
      tags:
        - Evidence
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - run_id
                - var_key
                - value
                - evidence_ref
                - rationale
              properties:
                run_id:
                  type: string
                var_key:
                  type: string
                value:
                  type: object
                  required:
                    - kind
                    - value
                  properties:
                    kind:
                      type: string
                      enum:
                        - num
                        - text
                        - bool
                    value: {}
                evidence_ref:
                  type: string
                  description: Citation vocabulary required on requires_evidence_ref vars
                rationale:
                  type: string
                observed_at:
                  type: string
      responses:
        '201':
          $ref: '#/components/responses/Created'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/projects/{id}/dimension-inputs/{rowId}/review:
    post:
      operationId: reviewDimensionInput
      summary: Cross-domain second review — reviewer must differ from the asserter; reviewed assertions are what snapshots read; audited.
      tags:
        - Evidence
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: rowId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
