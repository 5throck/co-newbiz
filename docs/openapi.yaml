    get:
      operationId: listReviewStages
      summary: 'The 3-stage review pipeline (design §10.1-2): AI 1st -> AI 2nd (different domain) -> human final. Optionally filtered by run_id.'
      tags:
        - Review
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: run_id
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: createReviewStage
      summary: >-
        Record one review stage. unverified_items is a required array (possibly empty) — never omitted; the design's no-PASS-stamp rule means a reviewer always explicitly declares what it could not check. An ai_2nd stage sharing its
        reviewer_domain with the run's ai_1st stage is refused (design §5.7 — same-domain review never counts as a real 2nd stage).
      tags:
        - Review
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - run_id
                - stage
                - reviewer_agent_or_user
                - unverified_items
              properties:
                run_id:
                  type: string
                stage:
                  type: string
                  enum:
                    - ai_1st
                    - ai_2nd
                    - human_final
                reviewer_agent_or_user:
                  type: string
                reviewer_domain:
                  type: string
                unverified_items:
                  type: array
                  items:
                    type: string
                result:
                  type: string
      responses:
        '201':
          $ref: '#/components/responses/Created'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
