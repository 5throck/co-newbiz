# OpenAPI 3.1 description of the co-newbiz REST API — the as-built surface.
#
# SSOT relationships (docs/mcp-integration.md §6): every route declared in
# app/server/*.ts must appear here, and every entry here must have a
# declared route — tests/unit/openapi.test.ts enforces set equality in BOTH
# directions, so spec drift fails the suite instead of accumulating.
# Human-readable index: docs/api-spec.md. This file documents only what is
# implemented; forward-design endpoints stay in api-spec.md until built.

openapi: 3.1.0
info:
  title: co-newbiz REST API
  version: 1.4.0
  description: >-
    REST surface of co-newbiz (Stage 5 Waves 5.6-5.7 + engine-1 run versioning + engine-2 simulations). Every response uses the standard envelope {data, meta, error} (api-spec.md §9). Project-scoped reads return 404 — identical to "does not
    exist" — for projects the caller cannot see (FR-SEC-01): membership is resolved first, so project existence itself is never an oracle. Write endpoints are audit-logged (FR-SEC-07).
servers:
  - url: http://localhost:8787
    description: Default bind (app/server/index.ts; CO_NEWBIZ_PORT overrides)
security:
  - sessionCookie: []
  - bearerToken: []
tags:
  - name: Health
  - name: Auth
    description: Account lifecycle and sessions (api-spec.md §2).
  - name: Tokens
    description: Bearer API tokens for MCP/CLI clients (api-spec.md §2).
  - name: Projects
    description: Projects and membership (api-spec.md §3).
  - name: Governance
    description: RAG, approvals, compliance, waivers, interpretations, procedures (api-spec.md §5).
  - name: Analysis
    description: Market observations, change log, assumptions, run-based versioning, and Monte Carlo simulations (api-spec.md §4/§7; Waves 5.7B/engine-1/engine-2).
  - name: Deal Review
    description: DD findings, antitrust, incentives, liabilities, sites, partners, permits, value chain (api-spec.md §6; Wave 5.7B).
  - name: Monitoring
    description: Watches, notifications, and the venture/JV scorecard views over migration 0024 (api-spec.md §7; ADR-0059 E.4).
  - name: Glossary
    description: Term lookup backing the UI tooltip and MCP lookup_term (api-spec.md §7).
  - name: Admin
    description: Admin console — never MCP-exposed (api-spec.md §8). Admin role required; project data stays off these routes.
paths:
  /api/health:
    get:
      operationId: health
      summary: Liveness probe (no auth).
      tags:
        - Health
      security: []
      responses:
        '200':
          $ref: '#/components/responses/Ok'
  /api/auth/register:
    post:
      operationId: register
      summary: Self-signup — always role=viewer, status=pending (no auth).
      tags:
        - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - userId
                - password
              properties:
                userId:
                  type: string
                password:
                  type: string
                displayName:
                  type: string
      responses:
        '201':
          $ref: '#/components/responses/Created'
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/auth/login:
    post:
      operationId: login
      summary: Credential login — issues the session cookie.
      tags:
        - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - userId
                - password
              properties:
                userId:
                  type: string
                password:
                  type: string
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '423':
          $ref: '#/components/responses/Locked'
  /api/auth/me:
    get:
      operationId: me
      summary: Current identity — also the must-change-password gate's status probe.
      tags:
        - Auth
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/auth/logout:
    post:
      operationId: logout
      summary: Revoke exactly the current session or token.
      tags:
        - Auth
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/auth/password-change:
    post:
      operationId: changePassword
      summary: Change password — history reuse refused; all other sessions revoked.
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - currentPassword
                - newPassword
              properties:
                currentPassword:
                  type: string
                newPassword:
                  type: string
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/auth/password-reset:
    post:
      operationId: resetPassword
      summary: Admin-initiated reset — forces must_change_password.
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - userId
                - tempPassword
              properties:
                userId:
                  type: string
                tempPassword:
                  type: string
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/tokens:
    post:
      operationId: issueToken
      summary: Issue a Bearer API token — plaintext returned exactly once.
      tags:
        - Tokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - label
              properties:
                label:
                  type: string
                scopes:
                  type: array
                  items:
                    type: string
                    enum:
                      - read
                      - write
      responses:
        '201':
          $ref: '#/components/responses/Created'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    get:
      operationId: listTokens
      summary: List the caller's tokens — identity columns only, hash never leaves the engine.
      tags:
        - Tokens
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/tokens/{id}:
    delete:
      operationId: revokeToken
      summary: Revoke a token — owner-scoped (someone else's id is indistinguishable from nonexistent).
      tags:
        - Tokens
      parameters:
        - $ref: '#/components/parameters/TokenId'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/interpretations:
    get:
      operationId: searchInterpretations
      summary: Interpretation registry search (workspace-wide, not project-scoped).
      tags:
        - Governance
      parameters:
        - name: doc
          in: query
          schema:
            type: string
        - name: clause
          in: query
          schema:
            type: string
        - name: q
          in: query
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: recordInterpretation
      summary: Record a Q&A pair — admin only; supersession guard rejects contradictions (409).
      tags:
        - Governance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - governance_doc_id
                - clause_ref
                - question
                - answer
              properties:
                governance_doc_id:
                  type: string
                clause_ref:
                  type: string
                question:
                  type: string
                answer:
                  type: string
                supersedes:
                  type: string
                published:
                  type: boolean
      responses:
        '201':
          $ref: '#/components/responses/Created'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/procedures/resolve:
    get:
      operationId: resolveProcedure
      summary: Merged shared/region/entity procedure with per-step source badges (proc:resolve equivalent).
      tags:
        - Governance
      parameters:
        - name: procedure
          in: query
          required: true
          schema:
            type: string
        - name: entity
          in: query
          schema:
            type: string
        - name: region
          in: query
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/series:
    get:
      operationId: listSeries
      summary: Distinct series catalog from fact_market_observation — unit, source, observation count, period coverage.
      tags:
        - Analysis
      parameters:
        - name: q
          in: query
          schema:
            type: string
          description: Substring filter on series_id.
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/series/{id}/observations:
    get:
      operationId: getObservations
      summary: Observations for one series — latest revision per period by default (FR-DATA-05 revision-preserving reads).
      tags:
        - Analysis
      parameters:
        - $ref: '#/components/parameters/SeriesId'
        - name: all_revisions
          in: query
          schema:
            type: string
            enum:
              - '1'
              - 'true'
          description: Return every revision row, not just the latest per period.
        - name: period_id
          in: query
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/data-changes:
    get:
      operationId: listDataChanges
      summary: data_change_log scan — new/revised/deleted detections, newest first.
      tags:
        - Analysis
      parameters:
        - name: series_id
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/runs/{id}:
    get:
      operationId: getRun
      summary: Run row plus its immutable run_input snapshot and input_hash (ADR-0005 run-based versioning).
      tags:
        - Analysis
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/runs/{id}/diff/{otherId}:
    get:
      operationId: diffRuns
      summary: Variable-level bridge between two runs of one project — changed/added/removed per assumption_key plus both input hashes. NPV-level decomposition deferred until the valuation engine exists.
      tags:
        - Analysis
      parameters:
        - $ref: '#/components/parameters/RunId'
        - $ref: '#/components/parameters/OtherRunId'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/assumptions:
    get:
      operationId: getAssumptions
      summary: Assumption registry read — ?run_id= gates on the run's project visibility (404 for a non-member).
      tags:
        - Analysis
      parameters:
        - name: run_id
          in: query
          schema:
            type: string
        - name: key
          in: query
          schema:
            type: string
          description: assumption_key filter.
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: setAssumption
      summary: Write an assumption — analyst+; kind='assumed' requires non-empty rationale (FR-DATA-07, app code AND DB CHECK).
      tags:
        - Analysis
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - run_id
                - assumption_key
                - kind
                - value
                - as_of
              properties:
                run_id:
                  type: string
                assumption_key:
                  type: string
                kind:
                  type: string
                  enum:
                    - live
                    - user
                    - derived
                    - assumed
                value:
                  type: number
                as_of:
                  type: string
                  description: ISO-8601 date.
                rationale:
                  type: string
                anchor_ref:
                  type: string
                ttl_days:
                  type: integer
      responses:
        '201':
          $ref: '#/components/responses/Created'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/simulations:
    post:
      operationId: createSimulation
      summary: >-
        Run the seeded Monte Carlo engine over a run's inputs — the scenario is composed from the run's sim.* keys plus the project's contingent liabilities; python/monte_carlo.py is spawned args-array-only (never shell) and the quantile
        summary is persisted. Analyst+; audited.
      tags:
        - Analysis
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - run_id
              properties:
                run_id:
                  type: string
                  description: Run whose inputs feed the engine; its project gates visibility (404 for a non-member).
                seed:
                  type: integer
                  minimum: 0
                  maximum: 2147483647
                  description: Omitted = deterministic default derived from the run's input_hash, so identical inputs stay reproducible either way.
                iterations:
                  type: integer
                  minimum: 1
                  maximum: 100000
                  default: 10000
                  description: The engine's own default when omitted.
      responses:
        '201':
          $ref: '#/components/responses/Created'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          description: Engine failure (spawn error, timeout kill, or unparseable output) — error.code simulation_failed.
  /api/simulations/{id}/results:
    get:
      operationId: getSimulationResults
      summary: Quantile summary from simulation_result ONLY — raw draws are never exposed here (retention_policy archives simulation_draw; the permanent record is the summary). meta carries seed + iterations.
      tags:
        - Analysis
      parameters:
        - $ref: '#/components/parameters/SimulationId'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/portfolio-scorecard:
    get:
      operationId: getPortfolioScorecard
      summary: >-
        Membership-filtered portfolio rollup over venture_scorecard for one review cycle (ADR-0059 E.4) — ?review_cycle=YYYY-Qn or the latest within the caller's visible scope. meta.scope="membership-filtered" with
        scope_incomplete/projects_excluded discloses when the rollup is a subset of the cycle; MNPI ventures are included for members.
      tags:
        - Monitoring
      parameters:
        - name: review_cycle
          in: query
          required: false
          schema:
            type: string
            pattern: ^\d{4}-Q[1-4]$
          description: Explicit review cycle; absent/blank resolves the latest in scope. Malformed values are 400 (invalid_review_cycle).
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/watch:
    get:
      operationId: listWatches
      summary: The caller's watches with rules, newest first.
      tags:
        - Monitoring
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createWatch
      summary: Create a watch — project must be visible (404 otherwise; a watch is never an existence oracle).
      tags:
        - Monitoring
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - project_id
              properties:
                project_id:
                  type: string
                rules:
                  type: array
                  items:
                    type: object
                    required:
                      - trigger_type
                      - channel
                    properties:
                      trigger_type:
                        type: string
                      threshold:
                        type: number
                      cooldown_hours:
                        type: number
                      channel:
                        type: string
                      adr_ref:
                        type: string
                        description: Linked ADR reference — a notification-threshold rule without one is a client-side hard block (ui-spec §5).
      responses:
        '201':
          $ref: '#/components/responses/Created'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/watch/{id}:
    delete:
      operationId: deleteWatch
      summary: Delete one of the caller's own watches (rules first — no schema cascade).
      tags:
        - Monitoring
      parameters:
        - $ref: '#/components/parameters/WatchId'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/notifications:
    get:
      operationId: listNotifications
      summary: The caller's notifications, newest first (limit 200).
      tags:
        - Monitoring
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/reports:
    get:
      operationId: listReports
      summary: Generated report documents with their superseded chain (document table).
      tags:
        - Reports
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/reports/{id}/export:
    get:
      operationId: exportReport
      summary: Render a report document to docx/hwpx/pdf via python/report/render_*.py (?format=docx|hwpx|pdf).
      tags:
        - Reports
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: format
          in: query
          required: true
          schema:
            type: string
            enum:
              - docx
              - hwpx
              - pdf
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/glossary:
    get:
      operationId: listGlossaryKeys
      summary: All glossary keys (for the UI's term-highlight pass).
      tags:
        - Glossary
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: registerGlossaryTerm
      summary: Register a glossary term — admin only. Appends the term to the category YAML file (glossary/*.yaml SSOT); why_it_matters_ko is mandatory (glossary/_schema.yaml), duplicates are rejected in favor of merging.
      tags:
        - Glossary
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - key
                - ko
                - en
                - definition_ko
                - why_it_matters_ko
                - category
              properties:
                key:
                  type: string
                ko:
                  type: string
                en:
                  type: string
                definition_ko:
                  type: string
                why_it_matters_ko:
                  type: string
                category:
                  type: string
                  enum:
                    - business
                    - financial
                    - legal
                    - technical
                    - industry
                    - unit
                owner:
                  type: string
                aliases:
                  type: array
                  items:
                    type: string
      responses:
        '201':
          $ref: '#/components/responses/Created'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/glossary/{term}:
    get:
      operationId: lookupTerm
      summary: Term lookup by key / ko / en / alias — backs the UI tooltip and MCP lookup_term.
      tags:
        - Glossary
      parameters:
        - $ref: '#/components/parameters/GlossaryTerm'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/admin/users:
    get:
      operationId: listUsers
      summary: User list — identity columns only, no hash material. Admin role.
      tags:
        - Admin
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createAdminUser
      summary: Create an active user account (initial password returned once). Admin role; audited.
      tags:
        - Admin
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/admin/users/{userId}:
    put:
      operationId: manageUser
      summary: Approve / set_role / disable / enable / reset_password / delete an account. Admin role; audited.
      tags:
        - Admin
      parameters:
        - $ref: '#/components/parameters/MemberUserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - action
              properties:
                action:
                  type: string
                  enum:
                    - approve
                    - set_role
                    - disable
                    - enable
                role:
                  type: string
                  enum:
                    - admin
                    - analyst
                    - viewer
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/admin/audit-log:
    get:
      operationId: getAuditLog
      summary: Append-only audit viewer — no DELETE route exists at any privilege level (FR-SEC-07). Admin role.
      tags:
        - Admin
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
        - name: before
          in: query
          schema:
            type: string
          description: created_at cursor for descending pagination.
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/admin/schedule-jobs:
    get:
      operationId: listScheduleJobs
      summary: Job registry plus latest run per job. Admin role.
      tags:
        - Admin
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/admin/governance:
    get:
