components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: co_newbiz_session
      description: Web SPA session cookie (httpOnly, SameSite=Lax) — full read/write, subject to the must-change-password gate and the CSRF origin check.
    bearerToken:
      type: http
      scheme: bearer
      description: API token issued via POST /api/tokens — stored hashed, scope-limited (read-scoped tokens are rejected on any non-GET before a handler runs).
  parameters:
    ProjectId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: Project id. A non-member gets 404 — identical to nonexistent (FR-SEC-01).
    SeriesId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: Series id (fact_market_observation.series_id).
    RunId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: Run id. A run in a project the caller cannot see returns 404 (FR-SEC-01).
    OtherRunId:
      name: otherId
      in: path
      required: true
      schema:
        type: string
      description: Comparison run id — must belong to the same project as the base run (400 otherwise).
    SimulationId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: Simulation id. Membership resolves simulation -> run -> project; a non-member gets 404 (FR-SEC-01).
    TokenId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: API token id (owner-scoped).
    WatchId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: Watch id (caller's own).
    MemberUserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
      description: User id.
    GlossaryTerm:
      name: term
      in: path
      required: true
      schema:
        type: string
      description: Term key, Korean term, English name, or alias.
    JobKey:
      name: jobKey
      in: path
      required: true
      schema:
        type: string
      description: Scheduled job key.
  responses:
    Ok:
      description: Success — standard envelope; data shape is per-endpoint.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Envelope'
    Created:
      description: Created — standard envelope.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Envelope'
    BadRequest:
      description: Validation failure — envelope error.code names the rule that refused it.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Envelope'
    Unauthorized:
      description: Missing or invalid session cookie / Bearer token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Envelope'
    Forbidden:
      description: Authenticated but not permitted — role, token scope, CSRF origin, or the must-change-password gate.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Envelope'
    NotFound:
      description: 'The 404 contract — returned both for missing resources AND for projects the caller cannot see (FR-SEC-01: existence itself is protected; project reads never return 403).'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Envelope'
    Conflict:
      description: Supersession/conflict rejection.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Envelope'
    Locked:
      description: Account locked (423) — retry after locked_until.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Envelope'
  schemas:
    Envelope:
      type: object
      description: Every response, success and error alike (api-spec.md §9).
      required:
        - data
        - meta
        - error
      properties:
        data: {}
        meta:
          type: object
          required:
            - as_of
          properties:
            as_of:
              type: string
              format: date-time
        error:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/ErrorBody'
    ErrorBody:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
