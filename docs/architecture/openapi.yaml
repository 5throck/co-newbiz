          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: not_greenfield, tranche_exists (live tranche_no taken), invalid_transition (e.g. released to planned, edit or retire of a released tranche), second_person_required (release approval by the tranche creator or by someone who edited the tranche since the request), release_pending (update while a release request is open).

