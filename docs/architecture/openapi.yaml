  /api/projects/{id}/waivers:
    get:
      operationId: listProjectWaivers
      summary: Waiver list for the project with date-authoritative effective status (ADR-0036) plus the governance-doc reference list. Scoped to one DD scope by the optional target_id (ADR-0157).
      tags:
        - Reference
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: target_id
          in: query
          required: false
          description: "ADR-0157: an OPENED comparison target. Omitted = the selected target (or legacy single subject) the dd gate judges. A target whose DD was never opened is 409 (DD가 열리지 않은 대상입니다)."
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    post:
      operationId: requestProjectWaiver
      summary: File a waiver request (S9 dd-waiver-review); expires_at is mandatory and must be future — indefinite/past dates are refused (ADR-0036). Analyst+.
      description: "R2-E (2026-10-09): `dd_item` may replace a hand-built clause string for per-row requests — the route derives `clause_ref` (`{checklist_id} {item_id}`) and a default `reason` from the item, so the client sends the item identity without reshaping."
      tags:
        - Reference
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [governance_doc_id, approver_role, expires_at]
              properties:
                governance_doc_id: { type: string }
                clause_ref: { type: string, description: "Required unless dd_item is present (the route derives it)." }
                reason: { type: string, description: "Optional in dd_item mode — a default reason naming the item is derived server-side." }
                dd_item:
                  type: object
                  properties:
                    checklist_id: { type: string }
                    item_id: { type: string }
                  description: "The DD checklist item being waived; clause_ref and default reason derive from it."
                approver_role: { type: string }
                expires_at: { type: string, format: date-time }
                approved_by: { type: string }
                target_id: { type: string, description: "ADR-0157: an opened comparison target; a waiver applies to exactly one DD scope. Omitted = the selected-target scope." }
      responses:
        '201':
          $ref: '#/components/responses/Created'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

