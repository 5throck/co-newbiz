components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: co_newbiz_session
      description: Web SPA session cookie (httpOnly, SameSite=Lax) — full read/write, subject to the must-change-password gate and the CSRF origin check.
    bearerToken:
      type: http
      scheme: bearer
      description: API token issued via POST /api/tokens — stored hashed, scope-limited (read-scoped tokens are rejected on any non-GET before a handler runs).
  parameters:
    ProjectId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: Project id. A non-member gets 404 — identical to nonexistent (FR-SEC-01).
    SeriesId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: Series id (fact_market_observation.series_id).
    RunId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: Run id. A run in a project the caller cannot see returns 404 (FR-SEC-01).
    OtherRunId:
      name: otherId
      in: path
      required: true
      schema:
        type: string
      description: Comparison run id — must belong to the same project as the base run (400 otherwise).
    SimulationId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: Simulation id. Membership resolves simulation -> run -> project; a non-member gets 404 (FR-SEC-01).
    TokenId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: API token id (owner-scoped).
    WatchId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: Watch id (caller's own).
    MemberUserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
      description: User id.
    GlossaryTerm:
      name: term
      in: path
      required: true
      schema:
        type: string
      description: Term key, Korean term, English name, or alias.
    JobKey:
      name: jobKey
      in: path
      required: true
      schema:
        type: string
      description: Scheduled job key.
  responses:
    Ok:
      description: Success — standard envelope; data shape is per-endpoint.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Envelope'
    Created:
      description: Created — standard envelope.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Envelope'
    BadRequest:
      description: Validation failure — envelope error.code names the rule that refused it.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Envelope'
    Unauthorized:
      description: Missing or invalid session cookie / Bearer token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Envelope'
    Forbidden:
      description: Authenticated but not permitted — role, token scope, CSRF origin, or the must-change-password gate.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Envelope'
    NotFound:
      description: 'The 404 contract — returned both for missing resources AND for projects the caller cannot see (FR-SEC-01: existence itself is protected; project reads never return 403).'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Envelope'
    Unprocessable:
      description: Semantically invalid for the current state — envelope error.code names the violated precondition (e.g. not_executed, expired, dynamic_prompt).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Envelope'
    Conflict:
      description: Supersession/conflict rejection.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Envelope'
    Gone:
      description: The edit surface moved (410 moved) — error.editAt names the stage that owns it now.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Envelope'
    TooManyRequests:
      description: Rate limit exceeded (429 rate_limited) — retry later.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Envelope'
    Locked:
      description: Account locked (423) — retry after locked_until.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Envelope'
  schemas:
    GreenfieldAssessmentSave:
      type: object
      description: S5 save body (ADR-0173 slice 1). Omitted keys keep the stored value.
      properties:
        entry_strategy:
          type: string
        alternatives_considered:
          type: string
        rationale:
          type: string
        business_case_lines:
          type: array
          items:
            type: object
            properties:
              line:
                type: string
              category:
                type: string
                enum: [labor, opex, capex, revenue, gov_rnd]
              amount:
                type: number
                description: Raw amount in the line's own unit (amountUnit). For source capability the server recomputes it from the live judgement (exact millions of KRW) and rejects a different value (400 amount_mismatch, compared in millions). Manual lines are never converted on write — an unknown-unit (legacy) line keeps its raw amount and stays unconfirmed.
              amountUnit:
                type: string
                enum: [krw, krw_k, krw_m, krw_eok, fx_m, fx_eok]
                description: The unit the person picked for this line. Legacy/old-shape lines lose any previously stamped unit (it came from the earlier silent conversion) and are stored unconfirmed. Unknown values are rejected with 400 invalid_amount_unit.
              amountUnitConfirmed:
                type: boolean
                description: Trust flag — true only after a person picked the unit in the UI. Unconfirmed (or non-KRW) lines are excluded from totals and from the S8 promotion copy (audited as greenfield_cost.promotion_skipped with reason unit_unconfirmed / currency_non_krw).
              amountKrwM:
                type: number
                description: Canonical 백만원 value; computed server-side from amount + amountUnit when the line is complete and confirmed (null otherwise). Consumed by totals and promotion; never taken from the client.
              currency:
                type: string
                enum: [KRW, USD, EUR, JPY, CNY]
              period:
                type: string
                enum: [monthly, quarterly, yearly, lumpsum]
              note:
                type: string
              dupDismissed:
                type: array
                items:
                  type: string
              subCategory:
                type: string
                enum: [land_building, machinery, it_software, rnd_development, tech_license, patent_filing, fto_search, trademark_design, cert_equipment, rent_utility, materials, outsourcing, marketing_sales, insurance_tax_legal, product_cert, business_permit, cert_maintenance, patent_maintenance, opening_working_capital, direct_labor, recruiting_training, management_labor]
                description: "ADR-0177 slice 1 optional account sub-category (manual and capability lines). Its parent must equal category (capex 9 keys, opex 10, labor 3; none for revenue/gov_rnd) else 400 subcategory_parent_mismatch; an unknown key is 400 invalid_sub_category; a line without category takes the parent. Never changes an S8 calculation path. On read an unknown or mismatched stored key is returned as read-only legacySubCategory and dropped on the next save."
              source:
                type: string
                enum: [capability]
              capabilityKey:
                type: string
                description: S3 register row id (source capability only).
              reflected:
                type: boolean
                description: Human per-line choice (source capability only).
    Envelope:
      type: object
      description: Every response, success and error alike (api-spec.md §9).
      required:
        - data
        - meta
        - error
      properties:
        data: {}
        meta:
          type: object
          required:
            - as_of
          properties:
            as_of:
              type: string
              format: date-time
        error:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/ErrorBody'
    ErrorBody:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
    PortfolioOverlapResponse:
      type: object
      description: Same-industry exposure overlap (design 2026-10-11-portfolio-view-overlap §4). Groups are keyed by md_industry.id; the name_prefix tier is a clearly-labeled fallback, never merged into exact.
      required: [groups, na, counts]
      properties:
        groups:
          type: array
          items:
            $ref: '#/components/schemas/PortfolioOverlapGroup'
        na:
          $ref: '#/components/schemas/PortfolioOverlapNa'
        counts:
          $ref: '#/components/schemas/PortfolioOverlapCounts'
    PortfolioOverlapGroup:
      type: object
      required: [tier, industry, members]
      properties:
        tier:
          type: string
          enum: [exact, name_prefix]
          description: exact = shared industry_id (FK-verified); name_prefix = identical trimmed market_scope with NULL industry (string coincidence, verify before acting).
        industry:
          type: [object, 'null']
          description: null for the name_prefix tier.
          required: [id, name_ko, name_en, ksic_code]
          properties:
            id: { type: string }
            name_ko: { type: string }
            name_en: { type: string }
            ksic_code:
              type: [string, 'null']
              description: null = unpinned KSIC (ADR-0111) — shown as such, never a grouping key.
        key_label:
          type: string
          description: Identical normalized scope text — name_prefix tier only.
        members:
          type: array
          minItems: 2
          items:
            $ref: '#/components/schemas/PortfolioOverlapMember'
    PortfolioOverlapMember:
      type: object
      required: [kind, id, name, href, industry_pinned]
      properties:
        kind:
          type: string
          enum: [opportunity, project]
        id: { type: string }
        name: { type: string }
        href:
          type: string
          description: /opportunities?opportunity=<id> or /projects/<id>/process
        status:
          type: string
          description: Opportunity funnel status — opportunities only.
        industry_pinned:
          type: boolean
          description: false only inside name_prefix groups.
        project_no:
          type: string
          description: Projects only.
        track:
          type: [string, 'null']
          description: Projects only.
    PortfolioOverlapNa:
      type: object
      description: Members that could not be keyed — never force-grouped (no backfill, no auto-pinning).
      required: [opportunities_without_industry, projects_without_industry, hidden_promoted]
      properties:
        hidden_promoted:
          type: object
          description: Count-only. Promoted live opportunities whose project the caller cannot see; no ids, names or industries are disclosed.
          required: [count]
          properties:
            count: { type: integer }
        opportunities_without_industry:
          type: array
          items:
            type: object
            required: [id, name, reason]
            properties:
              id: { type: string }
              name: { type: string }
              reason:
                type: string
                enum: [no_pinned_industry, industry_unresolved]
        projects_without_industry:
          type: array
          items:
            type: object
            required: [id, project_no, reason]
            properties:
              id: { type: string }
              project_no: { type: string }
              reason:
                type: string
                enum: [no_live_binding, industry_unresolved]
    PortfolioOverlapCounts:
      type: object
      required: [active_opportunities, projects, exact_groups, name_prefix_groups, na_opportunities, na_projects, na_total, hidden_promoted_opportunities]
      properties:
        active_opportunities: { type: integer }
        projects: { type: integer }
        exact_groups: { type: integer }
        name_prefix_groups: { type: integer }
        na_opportunities: { type: integer }
        na_projects: { type: integer }
        na_total: { type: integer, description: 'na_opportunities + na_projects.' }
        hidden_promoted_opportunities: { type: integer, description: 'Promoted live opportunities whose project is not visible to the caller (count only).' }
