      summary: "S11 establishment steps (project-keyed projection of the opportunity ledger, 0070) — steps (assignee_user_id, assignee_name, assignee_active, last_recorded_by, reopen_count), members (active project members for the assignee picker), history (latest 20 events; each event carries via = ui|api|mcp|unknown), reopened_after_gate (boolean, server-derived: a reopen is newer than the latest valid GO of the dd, entity_ic or group_ic gate) with reopened_after_gate_detail ({steps, count, since} or null), 5-step progress (ADR-0100, ADR-0165 addendum). ADR-0167 adds mode (new_entity | business_unit | null when a Green Field project has not chosen), mode_label, mode_suggested, allowed_modes, mode_changed_after_gate, step_titles (active mode), all_step_titles (both modes), and history_steps (read-only rows of a previous mode); steps are the ACTIVE mode's rows only."
      tags:
        - Analysis
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: putProjectEstablishmentStep
      summary: "Change the status of one establishment step (ADR-0165). Body: step_no 1-5, status in_progress|done|halted|escalated (pending rejected), origin (must equal the project origin, internal|joint), optional evidence_url (http/https), note, assignee_user_id. done requires evidence_url or note (400 evidence_required) and is human-only: 403 human_only for a bearer token, an OAuth-delegated MCP call or an agent account (cookie session of a person only); a done step is changed only via POST .../reopen (409 reopen_required). Step 5 is sequence-enforced (400 sequence_violation). Errors also: 400 not_applicable, 400 assignee_not_member. Audit target <projectId>#step<n>@<via> (via = ui|api|mcp); the history event stores via too. ADR-0186 D4 (family validators = enforce): completing step 5 is 409 condition_open while an establishment or closing condition precedent is open."
      tags:
        - Analysis
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/projects/{id}/capability-attainability:
    get:
      operationId: getProjectCapabilityAttainability
      summary: "S8 required-capability attainability READ-ONLY summary (ADR-0168, edit surface moved to S5/S7 by ADR-0171; rows also carry milestone_candidate, ADR-0173). Per row of the source opportunity's S3 register, in the ADR-0172 order: capability, necessity (essential | partial_essential | optional | empty), necessity_scope_note, required_level (narrative), held_status (leading | average | partial | none | unevaluated), current_level (narrative), held_holders (legacy, read-only), held_evidence, then resolution, expected_level (narrative, <= 400), closing_cost_krw_m, months_to_attain, grade (high | medium | low | null = unjudged), rationale, evidence, confirmation. Also stale, stale_since, basis_hash, s3_hash, s3_changes, prior, history_count and note; summary with counts and the warning banner state (stale rows count as unjudged); removed_capabilities lists judgements of rows deleted in S3. Top level adds edit_at (S5 for Green Field, S7 for Brown Field) and track."
      tags:
        - Analysis
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: putProjectCapabilityAttainability
      summary: "Deprecated (ADR-0171, OD-4): Green Field projects get 410 moved with error.editAt = S5 for one release; use PUT /api/opportunities/{id}/capability-attainability. Brown Field projects get 410 moved with error.editAt = S7 too (ADR-0171 slice 2); use PUT /api/brownfield/targets/{targetId}/capability-judgements. GET for Brown Field returns the SELECTED target's S7 judgements read-only (plus selected_target and edit_href)."
      tags:
        - Analysis
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/Gone'

