        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/flows/dry-run/sessions/{sessionId}/execute:
    post:
      operationId: executeDryRunSession
      summary: Run the dry-run — base and override calls BOTH go through the production completeOrFallback path with a dryRun context (no parallel implementation, design §6.6). Ledger rows are flagged is_dry_run=1 + dry_run_group_id=session id; results never touch business tables. LLM-unconfigured returns deterministic fallback text for both legs with source flags (not an error). requireBusinessActor write (analyst+).
      tags:
        - Agents
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'

