    post:
      operationId: generateProjectGateBrief
      summary: "Draft an LLM gate brief (go/hold/kill recommendation + rationale draft) for fs/dd/entity_ic/group_ic from the gate's manifest artifacts (ADR-0118). Proposal only — the gate decision is recorded by a human via recordProjectGateDecision. Deterministic fallback summarizes evidence without fabricating a verdict. ADR-0186 - when a snapshot family is on, the response adds kill (the deterministic kill-criteria evaluation, persisted under a gate_integrity_eval run for a project gate) and the manifest gains the entry 'Kill criteria evaluation (deterministic)'; brief_id references the stored gate_brief_record (the AI recommendation kept beside the later human decision) and is null if the record could not be written. ADR-0186 P4 (D8): the data carries wacc_status {status confirmed|provisional, reason wacc_unconfirmed|wacc_subject_not_target|null, missing[] of wacc_subject|wacc|hurdle_irr, subject promoter|target|project_newco|null, scope project|target, warnings[] wacc_not_below_hurdle} - DISPLAY only (the UI labels discount-rate-dependent figures 'provisional discount rate' until confirmed; always present, whatever the wacc flag mode)."
