      summary: Greenfield capability assessment state, plus derived capability_cost_lines and milestone_candidates (ADR-0173) and staffing_plan_view / staffing_plan_masked (ADR-0175 slice 1; a viewer gets salary, increase, on-cost and salary-source values removed from the staffing_plan entry).
      tags:
        - Analysis
      parameters:
        - name: oppId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: saveGreenfieldAssessment
      summary: Save entry strategy / alternatives / business-case lines (ADR-0173 capability entries are rebuilt server-side).
      description: >-
        business_case_lines is the stored array. Entries with source "capability" carry capabilityKey,
        reflected and category; the server recomputes line, amount (millions of KRW divided by 100,
        currency KRW, period lumpsum), basisHash and reflectedBy/At from the live judgement and
        rejects a client amount that differs (400 amount_mismatch). Other 400 codes: unknown_capability,
        no_cost, invalid_category, not_reflectable, invalid_request. ADR-0175 slice 1: one optional entry
        {source: "staffing_plan", rows[{id, roleFamily, grade, headcountByYear[], avgAnnualBaseSalaryKrwM|null,
        salaryIncreaseRatePct, onCostRatePct|null, hireStartQuarter?, recruitingOneOffKrwM, salarySource?}], startYear,
        endYear, attritionBackfillPct} is validated against the plan_meta horizon (invalid rows reject the whole save
        with 400 invalid_request and a precise message); a lines-only POST that omits it keeps the stored plan;
        audit staffing_plan.updated carries a hash without salary values. ADR-0178 slice 1: a manual line may carry
        startYear 0 (pre-launch, year-0) ONLY when category is capex, period is lumpsum and endYear is absent; any other
        line with startYear 0 (other category, non-lumpsum period, an endYear, or a capability entry) is rejected with
        400 invalid_request and a Korean message, never dropped or coerced to 1. No other response field changes.
      tags:
        - Analysis
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GreenfieldAssessmentSave'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

