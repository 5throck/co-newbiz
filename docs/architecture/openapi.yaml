# OpenAPI 3.1 description of the co-newbiz REST API — the as-built surface.
#
# SSOT relationships (docs/architecture/mcp-integration.md §6): every route declared in
# app/server/*.ts must appear here, and every entry here must have a
# declared route — tests/unit/openapi.test.ts enforces set equality in BOTH
# directions, so spec drift fails the suite instead of accumulating.
# Human-readable index: docs/architecture/api-spec.md. This file documents only what is
# implemented; forward-design endpoints stay in api-spec.md until built.

openapi: 3.1.0
info:
  title: co-newbiz REST API
  version: 1.4.0
  description: >-
    REST surface of co-newbiz (Stage 5 Waves 5.6-5.7 + engine-1 run versioning + engine-2 simulations). Every response uses the standard envelope {data, meta, error} (api-spec.md §9). Project-scoped reads return 404 — identical to "does not
    exist" — for projects the caller cannot see (FR-SEC-01): membership is resolved first, so project existence itself is never an oracle. Write endpoints are audit-logged (FR-SEC-07).
servers:
  - url: http://localhost:8787
    description: Default bind (app/server/index.ts; CO_NEWBIZ_PORT overrides)
security:
  - sessionCookie: []
  - bearerToken: []
tags:
  - name: Health
  - name: Auth
    description: Account lifecycle and sessions (api-spec.md §2).
  - name: Tokens
    description: Bearer API tokens for MCP/CLI clients (api-spec.md §2).
  - name: Projects
    description: Projects and membership (api-spec.md §3).
  - name: Governance
    description: RAG, approvals, compliance, waivers, interpretations, procedures (api-spec.md §5).
  - name: Analysis
    description: Market observations, change log, assumptions, run-based versioning, and Monte Carlo simulations (api-spec.md §4/§7; Waves 5.7B/engine-1/engine-2).
  - name: Agents
    description: Runtime PM-routed agent queries and the roster projection (ADR-0128).
  - name: Deal Review
    description: DD findings, antitrust, incentives, liabilities, sites, partners, permits, value chain (api-spec.md §6; Wave 5.7B).
  - name: Monitoring
    description: Watches, notifications, and the venture/JV scorecard views over migration 0024 (api-spec.md §7; ADR-0059 E.4).
  - name: Glossary
    description: Term lookup backing the UI tooltip and MCP lookup_term (api-spec.md §7).
  - name: Admin
    description: Admin console — never MCP-exposed (api-spec.md §8). Admin role required; project data stays off these routes.
paths:
  /api/health:
    get:
      operationId: health
      summary: Liveness probe (no auth).
      tags:
        - Health
      security: []
      responses:
        '200':
          $ref: '#/components/responses/Ok'
  /api/auth/register:
    post:
      operationId: register
      summary: Self-signup — always role=viewer, status=pending (no auth).
      tags:
        - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - userId
                - password
              properties:
                userId:
                  type: string
                password:
                  type: string
                displayName:
                  type: string
      responses:
        '201':
          $ref: '#/components/responses/Created'
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/auth/login:
    post:
      operationId: login
      summary: Credential login — issues the session cookie.
      tags:
        - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - userId
                - password
              properties:
                userId:
                  type: string
                password:
                  type: string
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '423':
          $ref: '#/components/responses/Locked'
  /api/auth/me:
    get:
      operationId: me
      summary: Current identity — also the must-change-password gate's status probe.
      tags:
        - Auth
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/auth/logout:
    post:
      operationId: logout
      summary: Revoke exactly the current session or token.
      tags:
        - Auth
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/auth/password-change:
    post:
      operationId: changePassword
      summary: Change password — history reuse refused; all other sessions revoked.
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - currentPassword
                - newPassword
              properties:
                currentPassword:
                  type: string
                newPassword:
                  type: string
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/auth/password-reset:
    post:
      operationId: resetPassword
      summary: Admin-initiated reset — forces must_change_password.
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - userId
                - tempPassword
              properties:
                userId:
                  type: string
                tempPassword:
                  type: string
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/companies:
    get:
      operationId: listCompanies
      summary: Company list + search for the company financials screen (ADR-0116).
      tags:
        - Analysis
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/companies/{companyId}/financials:
    get:
      operationId: getCompanyFinancials
      summary: Latest-revision DART financial facts, derived analysis, commentary layer, and the subject-company WACC reference card.
      tags:
        - Analysis
      parameters:
        - name: companyId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/companies/{companyId}/sync:
    post:
      operationId: syncCompanyFinancials
      summary: Pull up to 5 business years of DART financials into fact_financial (append-only revisions). analyst+.
      tags:
        - Analysis
      parameters:
        - name: companyId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          description: DART API key not configured.
  /api/projects/{id}/financial-analysis/company:
    post:
      operationId: linkProjectSubjectCompany
      summary: Bind the project's subject company (brownfield target / greenfield baseline) with a mandatory rationale. analyst+.
      tags:
        - Analysis
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/tokens:
    post:
      operationId: issueToken
      summary: Issue a Bearer API token — plaintext returned exactly once.
      tags:
        - Tokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - label
              properties:
                label:
                  type: string
                scopes:
                  type: array
                  items:
                    type: string
                    enum:
                      - read
                      - write
      responses:
        '201':
          $ref: '#/components/responses/Created'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    get:
      operationId: listTokens
      summary: List the caller's tokens — identity columns only, hash never leaves the engine.
      tags:
        - Tokens
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/tokens/{id}:
    delete:
      operationId: revokeToken
      summary: Revoke a token — owner-scoped (someone else's id is indistinguishable from nonexistent).
      tags:
        - Tokens
      parameters:
        - $ref: '#/components/parameters/TokenId'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/interpretations:
    get:
      operationId: searchInterpretations
      summary: Interpretation registry search (workspace-wide, not project-scoped).
      tags:
        - Governance
      parameters:
        - name: doc
          in: query
          schema:
            type: string
        - name: clause
          in: query
          schema:
            type: string
        - name: q
          in: query
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: recordInterpretation
      summary: Record a Q&A pair — admin only; supersession guard rejects contradictions (409).
      tags:
        - Governance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - governance_doc_id
                - clause_ref
                - question
                - answer
              properties:
                governance_doc_id:
                  type: string
                clause_ref:
                  type: string
                question:
                  type: string
                answer:
                  type: string
                supersedes:
                  type: string
                published:
                  type: boolean
      responses:
        '201':
          $ref: '#/components/responses/Created'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/procedures/resolve:
    get:
      operationId: resolveProcedure
      summary: Merged shared/region/entity procedure with per-step source badges (proc:resolve equivalent).
      tags:
        - Governance
      parameters:
        - name: procedure
          in: query
          required: true
          schema:
            type: string
        - name: entity
          in: query
          schema:
            type: string
        - name: region
          in: query
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/series:
    get:
      operationId: listSeries
      summary: Distinct series catalog from fact_market_observation — unit, source, observation count, period coverage.
      tags:
        - Analysis
      parameters:
        - name: q
          in: query
          schema:
            type: string
          description: Substring filter on series_id.
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/series/{id}/observations:
    get:
      operationId: getObservations
      summary: Observations for one series — latest revision per period by default (FR-DATA-05 revision-preserving reads).
      tags:
        - Analysis
      parameters:
        - $ref: '#/components/parameters/SeriesId'
        - name: all_revisions
          in: query
          schema:
            type: string
            enum:
              - '1'
              - 'true'
          description: Return every revision row, not just the latest per period.
        - name: period_id
          in: query
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/data-changes:
    get:
      operationId: listDataChanges
      summary: data_change_log scan — new/revised/deleted detections, newest first.
      tags:
        - Analysis
      parameters:
        - name: series_id
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/notifications:
    get:
      operationId: listNotifications
      summary: The caller's notifications, newest first (limit 200).
      tags:
        - Monitoring
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/notifications/{id}/read:
    post:
      operationId: markNotificationRead
      summary: Mark one caller-owned notification as read.
      tags:
        - Monitoring
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/notifications/read-all:
    post:
      operationId: markAllNotificationsRead
      summary: Mark all unread notifications for the caller as read.
      tags:
        - Monitoring
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/glossary:
    get:
      operationId: listGlossaryKeys
      summary: All glossary keys (for the UI's term-highlight pass).
      tags:
        - Glossary
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: registerGlossaryTerm
      summary: Register a glossary term — admin only. Appends the term to the category YAML file (glossary/*.yaml SSOT); why_it_matters_ko is mandatory (glossary/_schema.yaml), duplicates are rejected in favor of merging.
      tags:
        - Glossary
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - key
                - ko
                - en
                - definition_ko
                - why_it_matters_ko
                - category
              properties:
                key:
                  type: string
                ko:
                  type: string
                en:
                  type: string
                definition_ko:
                  type: string
                why_it_matters_ko:
                  type: string
                category:
                  type: string
                  enum:
                    - business
                    - financial
                    - legal
                    - technical
                    - industry
                    - unit
                owner:
                  type: string
                aliases:
                  type: array
                  items:
                    type: string
      responses:
        '201':
          $ref: '#/components/responses/Created'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/glossary/{term}:
    get:
      operationId: lookupTerm
      summary: Term lookup by key / ko / en / alias — backs the UI tooltip and MCP lookup_term.
      tags:
        - Glossary
      parameters:
        - $ref: '#/components/parameters/GlossaryTerm'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/admin/users:
    get:
      operationId: listUsers
      summary: User list — identity columns only, no hash material. Admin role.
      tags:
        - Admin
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createAdminUser
      summary: Create an active user account (initial password returned once). Admin role; audited.
      tags:
        - Admin
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/admin/users/{userId}:
    put:
      operationId: manageUser
      summary: Approve / set_role / disable / enable / reset_password / delete an account. Admin role; audited.
      tags:
        - Admin
      parameters:
        - $ref: '#/components/parameters/MemberUserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - action
              properties:
                action:
                  type: string
                  enum:
                    - approve
                    - set_role
                    - disable
                    - enable
                role:
                  type: string
                  enum:
                    - admin
                    - analyst
                    - viewer
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/admin/users/{userId}/tokens:
    get:
      operationId: listUserTokens
      summary: Token inventory for one account — metadata only, never token material. Admin role.
      tags:
        - Tokens
      parameters:
        - $ref: '#/components/parameters/MemberUserId'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: adminIssueUserToken
      summary: Issue an API token on a user's behalf (label + scopes). Admin role; audited; token value returned once.
      tags:
        - Tokens
      parameters:
        - $ref: '#/components/parameters/MemberUserId'
      responses:
        '201':
          $ref: '#/components/responses/Created'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: adminRevokeUserToken
      summary: Revoke one of a user's API tokens. Admin role; audited.
      tags:
        - Tokens
      parameters:
        - $ref: '#/components/parameters/MemberUserId'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/admin/audit-log:
    get:
      operationId: getAuditLog
      summary: Append-only audit viewer — no DELETE route exists at any privilege level (FR-SEC-07). Admin role.
      tags:
        - Admin
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
        - name: before
          in: query
          schema:
            type: string
          description: created_at cursor for descending pagination.
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/admin/audit-log/stats:
    get:
      operationId: getAuditLogStats
      summary: Audit-log aggregate counts (action/actor rollups). Admin role.
      tags:
        - Admin
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/admin/notifications:
    get:
      operationId: adminListNotifications
      summary: All users' notification rows for the admin console. Admin role.
      tags:
        - Admin
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/admin/system-stats:
    get:
      operationId: getSystemStats
      summary: System-level counters (tables, jobs, data freshness) for the admin console. Admin role.
      tags:
        - Admin
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/admin/schedule-jobs/{jobKey}/runs:
    get:
      operationId: listScheduleJobRuns
      summary: Run history for one scheduled job. Admin role.
      tags:
        - Admin
      parameters:
        - name: jobKey
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/admin/schedule-jobs:
    get:
      operationId: listScheduleJobs
      summary: Job registry plus latest run per job. Admin role.
      tags:
        - Admin
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/admin/governance:
    get:
      operationId: listGovernanceDocs
      summary: Governance document registry read view (from governance_doc). Admin role.
      tags:
        - Admin
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/admin/master-data:
    get:
      operationId: listMasterData
      summary: Without ?table= lists the manageable md_* code tables; with ?table= lists its codes (allow-listed tables/columns only). Admin role.
      tags:
        - Admin
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: addMasterDataCode
      summary: Add a master-data code row (table/id/fields; allow-listed). Admin role; audited.
      tags:
        - Admin
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      operationId: updateMasterDataCode
      summary: Update a master-data code row (table/id/fields; allow-listed). Admin role; audited.
      tags:
        - Admin
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    delete:
      operationId: deleteMasterDataCode
      summary: Delete (deactivate) a master-data code row (table/id; allow-listed). Admin role; audited.
      tags:
        - Admin
      responses:
