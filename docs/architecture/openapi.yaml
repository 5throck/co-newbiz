# OpenAPI 3.1 description of the co-newbiz REST API — the as-built surface.
#
# SSOT relationships (docs/architecture/mcp-integration.md §6): every route declared in
# app/server/*.ts must appear here, and every entry here must have a
# declared route — tests/unit/openapi.test.ts enforces set equality in BOTH
# directions, so spec drift fails the suite instead of accumulating.
# Human-readable index: docs/architecture/api-spec.md. This file documents only what is
# implemented; forward-design endpoints stay in api-spec.md until built.

openapi: 3.1.0
info:
  title: co-newbiz REST API
  version: 1.4.0
  description: >-
    REST surface of co-newbiz (Stage 5 Waves 5.6-5.7 + engine-1 run versioning + engine-2 simulations). Every response uses the standard envelope {data, meta, error} (api-spec.md §9). Project-scoped reads return 404 — identical to "does not
    exist" — for projects the caller cannot see (FR-SEC-01): membership is resolved first, so project existence itself is never an oracle. Write endpoints are audit-logged (FR-SEC-07).
servers:
  - url: http://localhost:8787
    description: Default bind (app/server/index.ts; CO_NEWBIZ_PORT overrides)
security:
  - sessionCookie: []
  - bearerToken: []
tags:
  - name: Health
  - name: Auth
    description: Account lifecycle and sessions (api-spec.md §2).
  - name: Tokens
    description: Bearer API tokens for MCP/CLI clients (api-spec.md §2).
  - name: Projects
    description: Projects and membership (api-spec.md §3).
  - name: Governance
    description: RAG, approvals, compliance, waivers, interpretations, procedures (api-spec.md §5).
  - name: Analysis
    description: Market observations, change log, assumptions, run-based versioning, and Monte Carlo simulations (api-spec.md §4/§7; Waves 5.7B/engine-1/engine-2).
  - name: Agents
    description: Runtime PM-routed agent queries and the roster projection (ADR-0128).
  - name: Deal Review
    description: DD findings, antitrust, incentives, liabilities, sites, partners, permits, value chain (api-spec.md §6; Wave 5.7B).
  - name: Monitoring
    description: Watches, notifications, and the venture/JV scorecard views over migration 0024 (api-spec.md §7; ADR-0059 E.4).
  - name: Glossary
    description: Term lookup backing the UI tooltip and MCP lookup_term (api-spec.md §7).
  - name: Admin
    description: Admin console — never MCP-exposed (api-spec.md §8). Admin role required; project data stays off these routes.
paths:
  /api/health:
    get:
      operationId: health
      summary: Liveness probe (no auth).
      tags:
        - Health
      security: []
      responses:
        '200':
          $ref: '#/components/responses/Ok'
  /api/auth/register:
    post:
      operationId: register
      summary: Self-signup — always role=viewer, status=pending (no auth).
      tags:
        - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - userId
                - password
              properties:
                userId:
                  type: string
                password:
                  type: string
                displayName:
                  type: string
      responses:
        '201':
          $ref: '#/components/responses/Created'
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/auth/login:
    post:
      operationId: login
      summary: Credential login — issues the session cookie.
      tags:
        - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - userId
                - password
              properties:
                userId:
                  type: string
                password:
                  type: string
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '423':
          $ref: '#/components/responses/Locked'
  /api/auth/me:
    get:
      operationId: me
      summary: Current identity — also the must-change-password gate's status probe.
      tags:
        - Auth
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/auth/logout:
    post:
      operationId: logout
      summary: Revoke exactly the current session or token.
      tags:
        - Auth
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/auth/password-change:
    post:
      operationId: changePassword
      summary: Change password — history reuse refused; all other sessions revoked.
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - currentPassword
                - newPassword
              properties:
                currentPassword:
                  type: string
                newPassword:
                  type: string
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/auth/password-reset:
    post:
      operationId: resetPassword
      summary: Admin-initiated reset — forces must_change_password.
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - userId
                - tempPassword
              properties:
                userId:
                  type: string
                tempPassword:
                  type: string
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/companies:
    get:
      operationId: listCompanies
      summary: Company list + search for the company financials screen (ADR-0116).
      tags:
        - Analysis
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
        - name: scope
          in: query
          required: false
          description: >-
            "targets" hides companies present in the group/affiliate profile (non-deleted company_group_member,
            matched by DART code or exact name when no code) and the internal synergy-registry sentinel.
            Omitted = every company.
          schema:
            type: string
            enum:
              - targets
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/companies/{companyId}/financials:
    get:
      operationId: getCompanyFinancials
      summary: Latest-revision DART financial facts, derived analysis, commentary layer, and the subject-company WACC reference card.
      description: >-
        wacc_reference.entries[] items carry key, label, value (ratio for risk_free/credit_spread, multiple for
        observed_de/beta_levered), unit ("ratio"|"multiple"), as_of ("YYYY-MM" for rates, "YYYY-12-31" for D/E),
        anchor_ref, source_label, reason (only when value is null), note (caveat when value is present).
        wacc_reference also carries latest_year, missing[] (keys with null value) and disclaimer. beta_levered is a
        null placeholder ("KRX data-use approval pending"). Proposal only; no writes.
      tags:
        - Analysis
      parameters:
        - name: companyId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/companies/{companyId}/sync:
    post:
      operationId: syncCompanyFinancials
      summary: Pull up to 5 business years of DART financials into fact_financial (append-only revisions). analyst+.
      tags:
        - Analysis
      parameters:
        - name: companyId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          description: DART API key not configured.
  /api/companies/{companyId}/disclosures:
    get:
      operationId: getCompanyDisclosures
      summary: DART disclosure list (preset-filtered) for a company, with viewer links (ADR-0116 follow-up, 2026-09-15).
      tags:
        - Analysis
      parameters:
        - name: companyId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/companies/{companyId}/profile:
    get:
      operationId: getCompanyProfile
      summary: Latest LLM company-research profile (generalized company-profile-pipeline, 2026-09-15) — strengths/weaknesses/SWOT/competitive/RAG cap + version history.
      tags:
        - Analysis
      parameters:
        - name: companyId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/companies/{companyId}/analyze:
    post:
      operationId: analyzeCompanyProfile
      summary: Run the LLM company-research pipeline for a company (fire-and-forget; poll /profile for status). analyst+.
      tags:
        - Analysis
      parameters:
        - name: companyId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/projects/{id}/financial-analysis/company:
    post:
      operationId: linkProjectSubjectCompany
      summary: Bind the project's subject company (brownfield target / greenfield baseline) with a mandatory rationale. analyst+.
      tags:
        - Analysis
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/tokens:
    post:
      operationId: issueToken
      summary: Issue a personal Bearer API token — human web session only; plaintext returned exactly once.
      description: >-
        Session-only issuance (403 session_required for any Bearer credential).
        Scopes are ["read"] or ["read","write"]; viewer and admin accounts are
        read-only (ADR-0146). Expiry defaults to 30 days; allowed values are
        7, 30, or 90. At most 5 active personal tokens per user
        (409 token_limit_reached) and 10 issues per user per hour
        (429 rate_limited). New tokens carry the cnb_pat_ prefix. The 201
        response is Cache-Control: no-store; the token is never logged.
      tags:
        - Tokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - label
              properties:
                label:
                  type: string
                  maxLength: 80
                scopes:
                  type: array
                  items:
                    type: string
                    enum:
                      - read
                      - write
                expiresInDays:
                  type: integer
                  enum: [7, 30, 90]
                  default: 30
      responses:
        '201':
          $ref: '#/components/responses/Created'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    get:
      operationId: listTokens
      summary: List the caller's tokens — identity columns only, hash never leaves the engine.
      description: >-
        Available to any authenticated caller (owner-scoped). Each row carries
        id, display_id (last 6 chars of the id), label, scopes, created_at,
        last_used_at, expires_at, revoked_at, and computed status
        (active | expired | revoked).
      tags:
        - Tokens
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/tokens/{id}:
    delete:
      operationId: revokeToken
      summary: Revoke a token — human web session only; owner-scoped (someone else's id is indistinguishable from nonexistent).
      tags:
        - Tokens
      parameters:
        - $ref: '#/components/parameters/TokenId'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/mcp:
    get:
      operationId: mcpStream
      summary: MCP Streamable HTTP server-to-client SSE stream (ADR-0154). OAuth access token audience-bound to this resource; 401 carries WWW-Authenticate resource_metadata (RFC 9728).
      tags:
        - Tokens
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: mcpMessage
      summary: MCP Streamable HTTP JSON-RPC (ADR-0154). Origin allowlist; session bound to user and client.
      tags:
        - Tokens
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: mcpSessionEnd
      summary: End an MCP session (ADR-0154).
      tags:
        - Tokens
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/proposals:
    get:
      operationId: listDecisionProposals
      summary: The caller's own decision proposals (Wave M M-2, ADR-0154).
      tags:
        - Tokens
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createDecisionProposal
      summary: Record a decision PROPOSAL only; returns the confirm URL. Writes no decision (boundary #2). Needs the propose scope over OAuth. ADR-0186 - a gate_decision payload may carry brief_id but never snapshot_hash, acknowledgements, kill_override_id, divergence_reason or conditions (400 human_fields_not_proposable).
      tags:
        - Tokens
      responses:
        '201':
          $ref: '#/components/responses/Ok'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/proposals/{id}:
    get:
      operationId: getDecisionProposal
      summary: Status of a decision proposal visible to the caller.
      tags:
        - Tokens
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/proposals/{id}/confirm:
    get:
      operationId: viewDecisionProposalConfirmation
      summary: Human web session only — the proposal, AI-proposed RAG grade, and a single-use confirm nonce. Bearer tokens are refused. For a gate_decision proposal the data also carries gate_snapshot {gate, snapshot_hash, snapshot, cached} (ADR-0186 3.10) - a FRESH snapshot (snapshot.required_acks lists the acknowledgement keys the GO needs); null for other kinds. After any non-2xx confirm POST, call this GET again for a new nonce and snapshot.
      tags:
        - Tokens
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: confirmDecisionProposal
      summary: Human web session only — runs the existing decision route in the caller's session and records the proposal as confirmed. Bearer tokens and agent identities are refused. For a gate_decision the body is {nonce, payload?, snapshot_hash, acknowledgements[], divergence_reason?, kill_override_id?} - the proposal itself never carries the hash or acknowledgements (400 human_fields_not_proposable if a payload edit does); they are the confirming person's and the gate route re-checks them against a recomputed snapshot (409 snapshot_stale, 422 ack_required, 409 kill_binding_unoverridden are relayed and the proposal stays pending). Other kinds refuse these fields (400).
      tags:
        - Tokens
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/proposals/{id}/reject:
    post:
      operationId: rejectDecisionProposal
      summary: Human web session only — decline a decision proposal; nothing is decided.
      tags:
        - Tokens
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/oauth/register:
    post:
      operationId: oauthRegisterClient
      summary: RFC 7591 dynamic client registration — public clients only (ADR-0154).
      tags:
        - Tokens
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/oauth/authorize:
    get:
      operationId: oauthAuthorizeInfo
      summary: Validate an authorization request for the consent screen — human web session only (ADR-0154).
      tags:
        - Tokens
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: oauthAuthorizeDecision
      summary: Record the human consent decision; returns the redirect target with code, state and iss (ADR-0154).
      tags:
        - Tokens
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/oauth/token:
    post:
      operationId: oauthToken
      summary: Token endpoint — authorization_code (PKCE S256) and refresh_token only; no client_credentials (ADR-0154).
      tags:
        - Tokens
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/oauth/revoke:
    post:
      operationId: oauthRevoke
      summary: RFC 7009 token revocation; a refresh token revokes its family (ADR-0154).
      tags:
        - Tokens
      responses:
        '200':
          $ref: '#/components/responses/Ok'
  /api/oauth/apps:
    get:
      operationId: listConnectedApps
      summary: Connected MCP apps holding live tokens for the session user (ADR-0154).
      tags:
        - Tokens
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/oauth/apps/{clientId}:
    delete:
      operationId: revokeConnectedApp
      summary: Revoke every token the session user granted to one client (ADR-0154).
      tags:
        - Tokens
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/interpretations:
    get:
      operationId: searchInterpretations
      summary: Interpretation registry search (workspace-wide, not project-scoped).
      tags:
        - Governance
      parameters:
        - name: doc
          in: query
          schema:
            type: string
        - name: clause
          in: query
          schema:
            type: string
        - name: q
          in: query
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: recordInterpretation
      summary: Record a Q&A pair — admin only; supersession guard rejects contradictions (409).
      tags:
        - Governance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - governance_doc_id
                - clause_ref
                - question
                - answer
              properties:
                governance_doc_id:
                  type: string
                clause_ref:
                  type: string
                question:
                  type: string
                answer:
                  type: string
                supersedes:
                  type: string
                published:
                  type: boolean
      responses:
        '201':
          $ref: '#/components/responses/Created'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/procedures/resolve:
    get:
      operationId: resolveProcedure
      summary: Merged shared/region/entity procedure with per-step source badges (proc:resolve equivalent).
      tags:
        - Governance
      parameters:
        - name: procedure
          in: query
          required: true
          schema:
            type: string
        - name: entity
          in: query
          schema:
            type: string
        - name: region
          in: query
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/series:
    get:
      operationId: listSeries
      summary: Distinct series catalog from fact_market_observation — unit, source, observation count, period coverage.
      tags:
        - Analysis
      parameters:
        - name: q
          in: query
          schema:
            type: string
          description: Substring filter on series_id.
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/series/{id}/observations:
    get:
      operationId: getObservations
      summary: Observations for one series — latest revision per period by default (FR-DATA-05 revision-preserving reads).
      tags:
        - Analysis
      parameters:
        - $ref: '#/components/parameters/SeriesId'
        - name: all_revisions
          in: query
          schema:
            type: string
            enum:
              - '1'
              - 'true'
          description: Return every revision row, not just the latest per period.
        - name: period_id
          in: query
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/data-changes:
    get:
      operationId: listDataChanges
      summary: data_change_log scan — new/revised/deleted detections, newest first.
      tags:
        - Analysis
      parameters:
        - name: series_id
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
