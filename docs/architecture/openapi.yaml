  /api/projects/{id}/dd:
    get:
      operationId: getProjectDdWorkspace
      summary: "S9 DD workspace aggregate — standard items with live state, custom items with provenance, findings, and completion (ADR-0099). Adds targets[] (one comparison summary per shortlisted target) and scope_target_id / selected_target_id (ADR-0157). Each of the seven domains carries counted (false + counted_reason for financial/hr/market/financing of a project created before 2026-10-01: judgeable, recorded for reference, not in completion). ADR-0160 addendum (b), greenfield projects in the workspace scope only: items[].scope (code A/R/X/N, reading, reason, replaced_by pointers with read-only status, fallback, steps), greenfield_scope.workspace_scope (items, tab_labels, step_tabs, plan_readiness rows for steps 4/5/6, previous_scope, counts) and completion.judged / judgeable / workspace_judgeable / excluded. Brownfield m_and_a, null sub-track and grandfathered payloads carry none of these keys. ADR-0162, brownfield non-baseline sub-tracks in the workspace scope only (created on/after BF_WORKSPACE_SCOPE_DATE or opted in): items[].scope on the seven domains AND the attached extra tabs (excluded deal-shape sections carry code N), brownfield_scope.workspace_scope (items, extra_checklists, previous_scope, opted_in, counts incl. extras_excluded) and the same completion keys. Each custom item also carries proposed_by_user (display name, else account id, of the human proposer from the dd_custom_item.create audit entry; null for agent proposals or when unknown, never an agent id) and is_proposer (true when the calling user proposed it and therefore cannot review it)."
      tags:
        - Analysis
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: target_id
          in: query
          required: false
          description: "ADR-0157: an OPENED comparison target. Omitted = the selected target (or legacy single subject) the dd gate judges. A target whose DD was never opened is 409 (DD가 열리지 않은 대상입니다)."
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/projects/{id}/dd/targets:
    post:
      operationId: openProjectDdTarget
      summary: Open DD on a shortlisted, non-selected brownfield target as comparison evidence (ADR-0157). Human web session only — bearer/agent/MCP identities are 403; rationale required; idempotent on (project, target); audited. The selected target stays the only gate subject.
