      operationId: openProjectDdTarget
      summary: Open DD on a shortlisted, non-selected brownfield target as comparison evidence (ADR-0157). Human web session only — bearer/agent/MCP identities are 403; rationale required; idempotent on (project, target); audited. The selected target stays the only gate subject.
