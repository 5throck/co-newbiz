      summary: "Set or clear (null) the person responsible for one establishment step (ADR-0165). Human-only (403 human_only for bearer / MCP / agent callers), analyst+. The assignee must be an active project member (400 assignee_not_member); allowed on a done step; creates a pending row when the step has none. Notifies the new assignee (never the actor). Audit entity_establishment.assign."
