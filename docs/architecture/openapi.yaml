      summary: Build the proposal-only export package (prompt key, base/override system text, diff summary, preference, dry-run evidence with outputs/cost, catalogVersion) as a markdown artifact. The ONLY permanent-landing vehicle — the package goes to a repository PR via the Design Gate; this API never writes the SSOT. requireBusinessActor write (analyst+).
      tags:
