      operationId: getProjectGateSnapshot
      summary: "ADR-0186 D1 - the server-recomputed gate snapshot a recorder reviews before a project gate decision (analyst+, same visibleProject / information-wall check as the decision route; 404 for a non-member, 403 viewer). Query gate=fs|dd|entity_ic|group_ic, optional brief_id. Data {gate, snapshot_hash, snapshot, cached, legacy:false}; snapshot = {schema_version, gate, entity, track, computed_at, engine_versions, kill {procedures, evaluated, inert, inert_list, false_count, triggered[{key, procedure, criterion_id, title, action, binding, override_id}], unassessed[], eval_run_id}, rag {overall, dimensions, data_confidence_cap, assessment_id}|null, validators|null, nonwaivable_open[], wacc {subject, status sourced|assumed|absent, bf13, confirmed, missing[] of wacc_subject|wacc|hurdle_irr}|null, waivers {active, expiring_14d}, conditions_open[{id, text, clear_by}] (open condition precedents), ladder {prior_gate, prior_carrier, prior_decision_id, prior_decision, effective, blocker, prior_awaiting_countersign}, ai|null, required_acks[{key, kind, procedure?, criterion_id?, action?}], hard_blocks[{code, keys, enforced}] (codes kill_binding_unoverridden | validators_incomplete | condition_open | certification_unconfirmed | wacc_unconfirmed; enforced=false means the family is in shadow, the GO is not refused)}. snapshot_hash is the SHA-256 of the canonical JSON (sorted keys, fixed number format; computed_at, eval_run_id, assessment_id and brief_id are excluded). Read-only for the caller (the evaluation runs in a rolled-back transaction; the brief and the decision persist their own ledgers) and cached per (project, gate, user, brief, input version)."
