    post:
      operationId: countersignProjectGateDecision
      summary: "The checker's act on an entity_ic or group_ic GO (ADR-0186 D6, family maker_checker). Human cookie session only (bearer / OAuth-delegated / MCP principal -> 403 human_only), analyst+ non-admin, project visible (404 otherwise), insider when MNPI. The checker must differ from the person who recorded the decision (403 checker_must_differ, no state change) and hold the matching grant - entity-ic-reviewer for entity_ic, group-ic-reviewer for group_ic - read inside the write transaction (403 human_role_required; 409 grant_revoked when the grant existed and was revoked). Only the latest non-stale IC GO recorded under the contract is countersigned: HOLD / KILL / other gates / legacy rows (no snapshot) are 409 countersign_not_applicable, a superseded one is 409 decision_superseded, a second countersign is 409 already_countersigned. decision approved | conditional makes the GO effective; rejected | withdrawn_pending_resubmission leaves it non-effective and on the record (the maker may record a new decision). A conditional countersign carries conditions[] (422 conditions_required when empty), stored in condition_precedent. 201 data {id, gate, decision, countersign_state, effective, conditions[ids]}. Audited gate_decision.countersign (and condition.create). Rate limited."
