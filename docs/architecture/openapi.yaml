        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: putProjectEstablishmentMode
      summary: "Choose or change the Green Field establishment mode (ADR-0167). Body {mode: new_entity | business_unit, reason?}. Human-only (403 human_only for bearer / MCP / agent callers; agents use the propose_establishment_mode proposal), analyst+. 400 not_applicable (origin not internal/joint), 400 invalid_request (bad mode or reason), 400 mode_not_allowed (business_unit needs origin internal on a Green Field project), 400 reason_required (changing a stored mode needs a reason of 10-2000 chars). Changing keeps the old mode's step rows as read-only history; the new mode starts at pending. Audit establishment_mode.set / .change, target <projectId>#mode@<via>; an establishment_mode_event row is written."
      tags:
