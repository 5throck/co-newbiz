        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: writeExecutionBaseline
      summary: "Human-only (boundary #2; analyst+, cookie session + CSRF, MNPI insider check; bearer/OAuth/agent callers get 403 human_only). Body action = record_entries (entries - permit_milestones, certification_milestones, hiring_plan aggregate rows, kpi_targets, incentive_obligations; max 100 rows per list) | confirm (project lead only, else 403 lead_required; rationale required max 2000 chars; acknowledged_findings [{code, rationale 1..500 chars}] must cover EVERY open finding code). Reads and write run in one immediate transaction; the confirmation stores recorder, confirmer, entries hash, tranche ids + hash and the acknowledgements. Never writes capex_tranche. Audit targets hold hashes and a 120-char summary only. ADR-0186 D4 (family validators = enforce): confirm is 409 condition_open while an establishment or closing condition precedent from the investment committee is open."
