  /api/projects/{id}/gate-decisions:
    get:
      operationId: listProjectGateDecisions
      summary: "Gate decision records (GO/HOLD/KILL) for the project (S8+ lifecycle). ADR-0186 P3: latest[] = {gate, decision (the EFFECTIVE verdict - an IC GO awaiting its countersign reads pending when family maker_checker = enforce, the recorded verdict otherwise), recorded_decision, decision_id, decided_by, countersign_state (not_applicable | legacy | countersigned | pending_countersign | countersign_rejected), awaiting_countersign, rationale, gap_override, missing_artifacts}; history[] adds countersign_state and countersign {status, by, at, conditions}|null (the checker's decision)."
      tags:
        - Reference
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: recordProjectGateDecision
      summary: "Record a human gate decision for the project; HOLD requires missing_artifacts (analyst+). ADR-0186 (families ladder / rationale, off|shadow|enforce; GO only, HOLD and KILL are never blocked) - under enforce a GO whose preceding ladder gate has no effective GO is 409 ladder_prerequisite_missing (error.details.blocker), and a GO rationale that fails the script-aware substance profile is 422 rationale_insufficient (error.details.field and reason, one of too_short | too_few_words | placeholder | repetitive | jamo_only | duplicate_of_other_gate). ADR-0186 P2 contract (families snapshot_ack / kill_binding / divergence, off|shadow|enforce; GO only, HOLD and KILL are never blocked and always store a snapshot) - the server recomputes the gate snapshot inside the write transaction (never trusts the client). The GO body carries snapshot_hash (from GET gate-snapshot), acknowledgements [{key, reason, kind?, covers?}] (keys = snapshot.required_acks; one reason may cover several kill_unassessed items of the same procedure via covers), optional brief_id and divergence_reason (a GO against a different AI recommendation needs one), optional kill_override_id. Under enforce - a triggered halt kill criterion without an active Group IC override is 409 kill_binding_unoverridden (error.details.keys, self_issued); a changed or missing hash is 409 snapshot_stale (error.details.reason, snapshot_hash and the fresh snapshot); missing or unknown acknowledgement keys are 422 ack_required (error.details.missing, unknown, invalid); a weak reason is 422 rationale_insufficient; a missing divergence_reason is 422 divergence_reason_required. Decision, snapshot, evaluation run and ledger commit in one transaction. 201 data adds snapshot_hash and acknowledgements (count); the GET history marks decisions without a snapshot as legacy:true. ADR-0186 P3: an entity_ic / group_ic GO may carry conditions[] {text, clear_by group_ic|establishment|closing, owner_role?} (human act, never a proposal field; stored as condition_precedent in the same transaction; group_ic GO accepts establishment|closing only; an acknowledged mark_conditional kill result also creates one). Family validators - a brownfield dd / entity_ic / group_ic GO with an applicable core validator missing is 409 validators_incomplete (error.details.missing; bf-01 is derived from the validator completeness engine, no waiver path), and a group_ic GO with an open group_ic condition is 409 condition_open. ADR-0186 P4 family wacc - the fs GO is 409 wacc_unconfirmed (error.details {subject, missing[] of wacc_subject|wacc|hurdle_irr}; neb-policy 2.2, bf-02, no waiver path) until the WACC application subject is set and the WACC and hurdle IRR are kind=user (one scope picked once: the selected target's own session when it has a row of either key, else the project session; the latest row of any kind governs, no fallback; a per-target session needs subject = target, bf-13). The WACC route rejects rates outside 0 < r < 1 with 400 rate_out_of_range; at dd / entity_ic / group_ic only a regression (a non-user rate exists) blocks. Under enforce S8 also reads incomplete until the rate is confirmed. Family maker_checker - a recorded IC GO is effective only after a different reviewer countersigns it (POST .../gate-decisions/{decisionId}/countersign); a GO whose predecessor IC GO is un-countersigned is 409 gate_prerequisites_incomplete with error.details.awaiting_countersign. 201 data adds conditions[ids] and awaiting_countersign."
      tags:
        - Reference
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '201':
          $ref: '#/components/responses/Created'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/projects/{id}/waivers:
    get:
      operationId: listProjectWaivers
      summary: Waiver list for the project with date-authoritative effective status (ADR-0036) plus the governance-doc reference list. Scoped to one DD scope by the optional target_id (ADR-0157).
      tags:
        - Reference
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: target_id
          in: query
          required: false
          description: "ADR-0157: an OPENED comparison target. Omitted = the selected target (or legacy single subject) the dd gate judges. A target whose DD was never opened is 409 (DD가 열리지 않은 대상입니다)."
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    post:
      operationId: requestProjectWaiver
      summary: File a waiver request (S9 dd-waiver-review); expires_at is mandatory and must be future — indefinite/past dates are refused (ADR-0036). Analyst+. ADR-0186 D5/D2 (family waiver / rationale, off|shadow|enforce) - under enforce clause_ref must resolve to a checklist item (422 clause_unresolved), a mandatory non-waiver-eligible item is 422 not_waivable, approver_role must be entity-ic-reviewer or group-ic-reviewer (422 approver_role_invalid), and the reason must meet the ack substance profile (422 rationale_insufficient).
      description: "R2-E (2026-10-09): `dd_item` may replace a hand-built clause string for per-row requests — the route derives `clause_ref` (`{checklist_id} {item_id}`) and a default `reason` from the item, so the client sends the item identity without reshaping."
      tags:
        - Reference
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [governance_doc_id, approver_role, expires_at]
              properties:
                governance_doc_id: { type: string }
                clause_ref: { type: string, description: "Required unless dd_item is present (the route derives it)." }
                reason: { type: string, description: "Optional in dd_item mode — a default reason naming the item is derived server-side." }
                dd_item:
                  type: object
                  properties:
                    checklist_id: { type: string }
                    item_id: { type: string }
                  description: "The DD checklist item being waived; clause_ref and default reason derive from it."
                approver_role: { type: string }
                expires_at: { type: string, format: date-time }
