  /api/opportunities/{id}/capability-gap/llm-draft:
    post:
      operationId: draftCapabilityGap
      summary: Requirement-side draft (amendment 2026-10-14) - proposes extra capability rows from synergy areas and fills EMPTY necessity (essential|partial_essential|optional, scope note only with partial_essential) and required-level narrative (max 400 chars) with a short basis each; response adds drafts {rowId -> filled fields + basis}. Does not touch holding fields (see holding-check). Optional body {rows} uses the unsaved on-screen rows as the base. Missing 필요도 / 필요 수준 (unset necessity, empty required level, on every row) are always detected and proposed (rows with missing cells go to the LLM in batches of 6 (bounded parallelism, one stricter retry per failed batch, each item validated on its own, truncated or fenced or prose-wrapped JSON salvaged) and new rows come from a separate small call with necessity and requiredLevel together); the response adds a missing object with before, after, necessity and requiredLevel counts and a note that reports how many missing cells were filled, how many remain missing and why, and the failure category (truncated, invalid JSON, empty, call failed, timeout) without the raw response. Never overwrites a human value; nothing is written to the database; proposal only, saving stays a human action (boundary #2). Amendment 2026-10-14 (3) - the evidence base is no longer limited to a completed synergy analysis: synergy areas, the S2 sketch (requiredCapabilities, or the v2 canvas key activities/resources) and the S1 factors / opportunity fields (rationale, value chain node, opportunity and risk factors) are each given to the LLM as a labelled block, and a proposed row's `source` is the block it came from (synergy_area|s2_sketch|s1_factors) with `requiredNote` starting with the shared origin label (for example S2 스케치에서 도출 — …); the note states which sources were used, and the no-LLM fallback seeds rows (names only, no necessity or level) from the same sources. 400 `no_rows` only when there is no row and none of the sources has content, and its message names the fix (run a synergy analysis, write the S2 sketch or enter S1 factors).
      tags:
        - Analysis
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/opportunities/{id}/capability-gap/holding-check:
    post:
      operationId: checkCapabilityHolding
      summary: Holding-side draft (amendment 2026-10-14) - proposes holding status (leading|average|partial|none|unevaluated; leading needs comparative evidence), holding-level narrative and holding evidence (no holders) from group/affiliate profiles plus bounded external web search (max 12 rows, 2 queries per row, overall timeout; web text is untrusted data). Citations are required (profile or valid source numbers); unsupported rows stay unevaluated with a reason. Optional body {rows, webSearch:false}; default scope is unjudged rows or rows with empty holding level/evidence and fills EMPTY fields only (no single-row mode). Search gate is the same as the S6 web-search proposal (analyst role; lib/web-research.ts config, DDG fallback switch WEB_SEARCH_DDG_ENABLED). Amendment 2026-10-14 (2) addendum - the response `search` object gains `providers` (array of objects with name tavily|brave|serper|ddg|playwright, status ok|empty|quota_exceeded|blocked|http_error|no_key|disabled|unavailable, optional http and circuitOpen) and `rowsNotSearched`; one probe query runs first and when every provider is unavailable the per-row searches are skipped and `note` / `search.failureNote` / the 400 `no_evidence` text name the causes and the action; evidence also includes the profile text fields and stored disclosure/financial facts (`basis.heldSource` profile|dart|web|both) and `counts.disclosure`. Amendment 2026-10-14 (3) - (a) provider name `playwright` (statuses ok|empty|unavailable|blocked) is appended to the chain after Tavily, Brave, Serper and DuckDuckGo for this route only, and it runs one headless Chrome query per row, only when the other providers found nothing, never past the route's search deadline, honours the circuit breaker, needs Chrome (CHROME_PATH or the platform default) and can be turned off with WEB_SEARCH_PLAYWRIGHT_ENABLED=false; (b) the response gains `unevaluatedReasons` (rowId to a short Korean reason, at most 120 characters, from the LLM `basis.reason` or the structural drop reason) - transient display data, never stored in the register - and the note lists the top reasons (for example a profile without information on the capability, or a profile claim that is unverified) and, when every row stayed unevaluated although a profile was used, a deterministic hint to include other affiliates or strengthen the profile; (c) optional body flag `includeGroupMembers` (boolean, default false) adds the other members of the scoped member's group (max 8) to the profile and disclosure context, the note names those companies, evidence must name the company it came from, and the holding judgement stays the scoped company's or group's; (d) profile text carries its verification state ([검증됨], [검색 근거 기반], [미검증 — LLM 추정]); an unverified-only profile claim cannot justify a judged status (dropped with reason `프로필 근거가 미검증(LLM 추정)`), and the note says when a profile was generated without search research. Nothing is written to the database; proposal only (boundary #2).
      tags:
        - Analysis
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
