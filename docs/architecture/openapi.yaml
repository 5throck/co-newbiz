      operationId: recommendGreenfieldStrategy
      summary: Draft an LLM capability-gap / Build-Partner-Hire-Invest strategy recommendation (S5 decision support, ADR-0118). Proposal only — the assessment is saved by a human. Deterministic fallback never fabricates capability rows. Each investment_items entry is {line, category, note, sub_category?}; sub_category (ADR-0177 slice 1) is kept only when it is a valid key under the item's category and is never a price or amount.
      tags:
        - Analysis
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/greenfield/{oppId}/entry-strategy-draft:
    post:
      operationId: draftGreenfieldEntryStrategy
      summary: "S5 entry-strategy proposal (ADR-0171 amendment 2026-10-15 (2)). Response {proposal: {modes: [{mode: build|partner|hire|invest, main, reason}] (exactly one main), rationale (max 600), alternatives (max 600), basis, cautions, confidence?} | null, source: llm|synthesis, note}. Evidence: stored S3 register, S4 final decision record, opportunity context, company profile/disclosure; no web search. Nothing is written to the database and nothing is decided; the page fills only empty parts and a person saves (POST /api/greenfield/{oppId}). Permission: analyst+; not human-only. Without a configured LLM: 200 with proposal null and a note. 403 viewer, 404."
      tags:
        - Analysis
      parameters:
        - name: oppId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/greenfield/{oppId}/investment-simulation:
    get:
      operationId: getGreenfieldInvestmentSimulation
      summary: "Latest stored S5 investment simulation run (ADR-0176 slice 2). Response {run: {id, input_hash, seed, draw_count, horizon_years, envelope_krw_m, assumptions, results, status, created_by, created_at} | null, stale}. results holds per-year and per-category p05/p50/p95, the horizon-total distribution, the tornado sensitivity ranking and the exceed probability when an envelope was set; per-draw vectors are never stored. stale = the saved plan or ranges no longer hash to the run. A viewer receives the staffing category band withheld. The run also carries confirmed_by/confirmed_at/confirm_audit_id (ADR-0176 slice 3; null = not confirmed, so S8 does not consume it). Decision support only: no gate or grade effect. 404 unknown opportunity."
      tags:
        - Analysis
      parameters:
        - name: oppId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
