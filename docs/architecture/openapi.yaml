        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'

  /api/projects/{id}/s8-lens-summary:
    get:
      operationId: getProjectS8LensSummary
      summary: "S8 two-lens summary (ADR-0169): read-only decision support with 충족/주의/미판정 status for the 기술적 타당성 lens (six items T1..T6 per subject, T1 derived from the ADR-0168 attainability register; mismatchCount counts Brown Field S9 verification rows with result different) and the 재무적 타당성 lens (base IRR vs hurdle, missed goals, downside NPV p50), plus a goals count line, the strip view-model and (ADR-0176 slice 4) an additive invest_uncertainty block read from the latest confirmed S5 investment simulation run (total p50/p95, optional exceed probability, top sensitivities, NPV-includes-investment-uncertainty status; informational simulation output only). Warning only: never a grade cap or a gate block. Financial lookups degrade to 미판정 on failure. Outsiders and admin get 404. ADR-0186 P4 (D8): the data carries wacc_status {status confirmed|provisional, reason wacc_unconfirmed|wacc_subject_not_target|null, missing[] of wacc_subject|wacc|hurdle_irr, subject promoter|target|project_newco|null, scope project|target, warnings[] wacc_not_below_hurdle} - DISPLAY only (the UI labels discount-rate-dependent figures 'provisional discount rate' until confirmed; always present, whatever the wacc flag mode)."
      tags:
        - Analysis
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/projects/{id}/establishment-mode:
    get:
      operationId: getProjectEstablishmentMode
      summary: "Green Field establishment mode state (ADR-0167): mode (stored; null = not chosen), active_mode, mode_label, suggested (non-binding hint), allowed_modes (business_unit needs origin internal on a Green Field project), applicable, steps_started, changed_after_gate, history (latest 20 mode events)."
