  /api/projects/{id}/business-case/params:
    get:
      operationId: getProjectBusinessCaseParams
      summary: "Resolve the live bc.* simulation parameter set with provenance (user > derived > default). Includes the read-only acquisitionEvRevenueBand (nullable, human-confirmed). The business-case list/comparison response carries evRevenueBand and per-target acqEvBandSource; acqEvRevenueInBand is null unless a band is confirmed. Also returns s5_sim (ADR-0176 slice 3): {state: not_applicable|none|in_effect|stale, stale, reason, used, latest, label} - whether the latest s5_plan case consumed the latest confirmed S5 investment simulation run (s5_sim=<input_hash> in its note) or whether it is stale (the label is the re-evaluation-required flag; hash compare only, never auto-recompute, never blocks a gate or grade). ADR-0179 slice 2 additive field anchor_scope: {status: ok|mismatch|unknown, label, reason, has_target_scope, confidence_note} | null (no source opportunity) - live scope-compatibility flag between the opportunity's declared target scope and the market anchor's declared scope, recomputed on every read; display/evidence only, never a gate block or grade cap (boundary #4); today always unknown because no scoped anchor is linked (OPEN-3)."
      tags:
        - Analysis
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/OK'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: recordProjectBusinessCaseParams
      summary: Record a user batch of bc.* parameters on a fresh run (analyst+; rationale required). Includes investment_basis (0=비율 추정 ratio, 1=S5 투자 계획 (legacy, capex-only), 2=S5 투자 계획 (unified - capex + labor/opex), 3=S5 계획 손익 s5_pnl (ADR-0178 slice 2 - Green Field + pinned path ONLY, human-only; agent principal 403, otherwise 400; year-0 = pre-launch total undiscounted, per-year plan P&L with utilization on revenue only, ratio substitution for plan-less years, bep_year NULL when pre-launch is 0); ADR-0174 — since 2026-10-16 the UI offers only 0 and 2; a stored 1 keeps capex-only behavior until re-set) — when not ratio the generator replaces the year-0 ratio investment and capex_ratio with the S5 capex schedule (Y1 spend counted in year 0) and bypasses the python sim engine. ADR-0179 slice 1 also accepts irr_flag_threshold (> 0) and irr_caution_threshold (>= 0, flag must stay strictly above caution; both validated before either is written) - the IRR ceiling review guard lines, stored as ratios and display metadata only.
      tags:
        - Analysis
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '201':
          $ref: '#/components/responses/Created'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/projects/{id}/business-case/ev-band:
    post:
      operationId: confirmProjectEvRevenueBand
      summary: Human-only confirmation of the project entry EV/Revenue band (analyst+; boundary #2, refused for MCP agent callers).
      description: |
        Body {min, max, rationale, source}. Validation: 0 < min < max <= 50, rationale 10-2000 chars, source 3-500 chars (after trim).
        Writes two kind='user' assumption rows in one run (overwrite-only; latest complete pair wins). Responds with
        {run_id, evRevenueBand:{confirmed, reference:{min,max,label,sourced:false}, optimismFlag, spreadFlag, stale, ageDays}}.
        spreadFlag (max/min > 4.5) and stale (confirmed >= 90 days ago) are warnings only; they never block or re-rank.
        Unknown server errors return 500 internal_error with a generic message. The band is display-only
        and never re-ranks targets. The general params route rejects band keys with 400.
      tags:
        - Analysis
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [min, max, rationale, source]
              properties:
                min: { type: number, exclusiveMinimum: 0 }
                max: { type: number, maximum: 50 }
                rationale: { type: string, minLength: 10, maxLength: 2000 }
                source: { type: string, minLength: 3, maxLength: 500 }
      responses:
        '201':
          $ref: '#/components/responses/Created'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          description: Unexpected server error (generic message, details logged server-side).

