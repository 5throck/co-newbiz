    post:
      operationId: writeCapexTranche
      summary: "Human-only (boundary #2; analyst+, cookie session + CSRF; bearer/OAuth/agent callers get 403 human_only). Body action = create (tranche_no, amount, currency, release_condition max 2000 chars, source_stage) | update (refused with 409 release_pending while a release request is open; audit records before/after amount, currency, release_condition) | set_status (status planned/released/withheld + reason max 2000 chars; released is two-person - the first call returns release_pending=true with tranche.pending_release {requested_by, requested_at} and audits the reason, a second call by someone other than the creator, the requester and anyone who edited the tranche since the request releases it) | retire (reason). Released tranches are immutable; every write is audited."
      tags:
        - Analysis
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
