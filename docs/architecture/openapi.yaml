        Unknown server errors return 500 internal_error with a generic message. The band is display-only
        and never re-ranks targets. The general params route rejects band keys with 400.
      tags:
        - Analysis
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [min, max, rationale, source]
              properties:
                min: { type: number, exclusiveMinimum: 0 }
                max: { type: number, maximum: 50 }
                rationale: { type: string, minLength: 10, maxLength: 2000 }
                source: { type: string, minLength: 3, maxLength: 500 }
      responses:
        '201':
          $ref: '#/components/responses/Created'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
