      description: |
        Body {min, max, rationale, source}. Validation: 0 < min < max <= 50, rationale 10-2000 chars, source 3-500 chars (after trim).
        Writes two kind='user' assumption rows in one run (overwrite-only; latest complete pair wins). Responds with
        {run_id, evRevenueBand:{confirmed, reference:{min,max,label,sourced:false}, optimismFlag, spreadFlag, stale, ageDays}}.
