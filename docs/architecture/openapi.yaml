    post:
      operationId: recordOpportunityGateDecision
      summary: "Record a gate decision — HOLD requires missing_artifacts. Analyst+; audited. GO is refused with 409 gate_prerequisites_incomplete until the gate's stage prerequisites are complete (HOLD/KILL always allowed). ADR-0186 (families ladder / rationale, off|shadow|enforce; GO only, HOLD and KILL are never blocked) - under enforce a GO whose preceding ladder gate has no effective GO is 409 ladder_prerequisite_missing (error.details.blocker), and a GO rationale that fails the script-aware substance profile is 422 rationale_insufficient (error.details.field and reason, one of too_short | too_few_words | placeholder | repetitive | jamo_only | duplicate_of_other_gate). ADR-0186 P2 contract (families snapshot_ack / kill_binding / divergence, off|shadow|enforce; GO only, HOLD and KILL are never blocked and always store a snapshot) - the server recomputes the gate snapshot inside the write transaction (never trusts the client). The GO body carries snapshot_hash (from GET gate-snapshot), acknowledgements [{key, reason, kind?, covers?}] (keys = snapshot.required_acks; one reason may cover several kill_unassessed items of the same procedure via covers), optional brief_id and divergence_reason (a GO against a different AI recommendation needs one), optional kill_override_id. Under enforce - a triggered halt kill criterion without an active Group IC override is 409 kill_binding_unoverridden (error.details.keys, self_issued); a changed or missing hash is 409 snapshot_stale (error.details.reason, snapshot_hash and the fresh snapshot); missing or unknown acknowledgement keys are 422 ack_required (error.details.missing, unknown, invalid); a weak reason is 422 rationale_insufficient; a missing divergence_reason is 422 divergence_reason_required. Decision, snapshot, evaluation run and ledger commit in one transaction. 201 data adds snapshot_hash and acknowledgements (count); the GET history marks decisions without a snapshot as legacy:true. ADR-0186 P3 (family validators, owner decision O-3): a brownfield pre_fs GO is 409 certification_unconfirmed (error.details.certifications) while a load-bearing certification of a project promoted from this opportunity has no confirmed change-of-control transferability (basis verified, a yes/no position, an evidence reference and confirmed_at); binding and non-waivable. HOLD and KILL are never blocked."
      tags:
        - Reference
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '201':
          $ref: '#/components/responses/Created'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

