  /api/projects/{id}/dd-checklist/state:
    put:
      operationId: putProjectDdChecklistState
      summary: "Upsert a judgment (pass/fail/pending/waived) on an applied checklist item; proposed-only items are 404 (analyst+). Body target_id (ADR-0157) scopes it to an opened comparison target; a waiver must belong to the same scope. ADR-0160 addendum (b): for a greenfield project in the workspace scope, a NEW judgement on an item classified not applicable or replaced is 409 dd_item_out_of_scope (an item already carrying a row may be re-judged); `na` on any of the seven workspace checklists needs a note (400 na_reason_required). ADR-0162: the same 409 and na-reason rules for a brownfield non-baseline sub-track in the workspace scope, including excluded sections of attached extra checklists."
