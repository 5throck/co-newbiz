    post:
      operationId: postProjectCapabilityAttainabilityConfirm
      summary: "Deprecated (ADR-0171, OD-4): Green Field projects get 410 moved with error.editAt = S5 (checked after the human-only guard: bearer / MCP / agent callers still get 403 human_only); use POST /api/opportunities/{id}/capability-attainability/confirm. Brown Field projects keep the previous confirm behaviour only until the S7 per-target surface ships."
