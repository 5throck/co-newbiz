  /api/flows/runs:
    get:
      operationId: listFlowRuns
      summary: Global run ledger — process_run→activity_run→agent_run expansion, llm_call_log rows and a windowed usage summary (ADR-0183 D4). Cursor pagination (limit+before); project-entity rows are membership-scoped, opportunity rows are open to business actors. requireBusinessActor read gate (ADR-0146).
      tags:
        - Agents
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
        - name: before
          in: query
          schema:
            type: string
        - name: agentKey
          in: query
          schema:
            type: string
        - name: entityType
          in: query
          schema:
            type: string
            enum: [opportunity, project]
        - name: entityId
          in: query
          schema:
            type: string
        - name: ok
          in: query
          schema:
            type: integer
            enum: [0, 1]
        - name: source
          in: query
          schema:
            type: string
            enum: [llm, synthesis]
        - name: includeDryRun
          in: query
          schema:
            type: integer
            enum: [0, 1]
          description: '1 = include dry-run ledger rows (llm_call_log.is_dry_run=1, migration 0171). Default (absent) excludes them from both the llmCalls list and the summary (design §6.6 "운영 대시보드는 기본적으로 제외").'
        - name: window
          in: query
          schema:
            type: string
            enum: [24h, 7d, 30d]
          description: Summary aggregation window only; list pagination is cursor-based. summary.daily returns zero-filled per-day buckets ({day YYYY-MM-DD server-local, ok, failed, costUsd}) across the whole window, independent of limit/before.
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/flows/dry-run/sessions:
    get:
      operationId: listDryRunSessions
      summary: List dry-run sessions with status and cumulative session cost (ledger aggregate on dry_run_group_id). Expired sessions are purged on read (TTL, design §6.8). requireBusinessActor read gate (ADR-0146).
      tags:
        - Agents
      parameters:
        - name: mine
          in: query
          schema:
            type: integer
            enum: [0, 1]
          description: 1 = only sessions created by the caller.
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createDryRunSession
      summary: Create a dry-run session for one catalog prompt (validates the prompt is cataloged with a static agent and the override agent key is on the roster; returns a cost estimate). Does NOT execute — execution is a separate confirmed step. Session-scoped overrides only; the SSOT (prompts.json / flow.spec.yaml / agents) is never written (design §6.6). requireBusinessActor write (analyst+).
      tags:
        - Agents
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '201':
          $ref: '#/components/responses/Ok'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'

  /api/flows/dry-run/sessions/{sessionId}:
    get:
      operationId: getDryRunSession
