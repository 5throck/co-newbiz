schema_version: "1.0"
procedure_id: shared-brownfield-pre-fs
title: "Brown Field Pre-Feasibility"
scope: shared
level: entity
version: "1.6.0"
effective_from: "2026-08-20"
status: active
applicability: mandatory
workflow_type: core
gate: Pre-FS

steps:
  - id: 1
    gate: Pre-FS
    agent_key: valuation-agent
    skill_key: wacc-input-session
    output_type: wacc_hurdle_confirmed
    description: >
      WACC/hurdle IRR moved from assumption.kind='assumed' to 'user' — same
      hard precondition as Green Field (meeting M1). No number is fabricated
      when this step cannot complete — see pilot findings in docs/pilots/.
  - id: 2
    gate: Pre-FS
    agent_key: brownfield-agent
    skill_key: brownfield-feasibility
    output_type: deal_structure_hypothesis
    description: >
      Deal-structure intent note (reduced in 1.6.0). Record the Pre-FS intent
      for the four structure axes only — asset vs. stock, full vs. partial
      stake, primary vs. secondary instrument mix, and acquisition vehicle
      (direct / SPC / holdco, per docs/pilots/pilot-009-emart-ebay-korea.md
      finding F-3) — as a hypothesis the FS can price. The deal SHAPE (M&A / JV
      / strategic investment / minority stake / partnership / R&BD / CVC) is no
      longer judged here: it is evaluated against the ranked Short List in
      `shared-brownfield-target-screening` step 3.5 (owner decision 2026-11-08,
      flow.spec 2.20.0), and the binding structure is decided at S10
      `deal-structuring` step 1. For R&BD deals (technology_track: rbd on the
      3-axis classification, ADR-0047) the note still names
      `checklists/rbd-technology-checklist.yaml` rbd-04's build / license /
      spin-off / minority-invest choice as an open question for the shape
      evaluation. Real worked examples of the structures:
      docs/pilots/pilot-002-hanwha-impact-hsd-engine.md §2 (mixed secondary +
      primary rights issue), docs/pilots/pilot-011-posco-amberoad.md (internal
      venture spin-off) and docs/pilots/pilot-014-c2y-university-techholdings.md
      (minority venture investment).
  - id: 3
    gate: Pre-FS
    agent_key: certification-agent
    skill_key: certification-transferability
    output_type: certification_transferability_check
    description: >
      Confirm certification transferability on change of control where load-bearing
      to the thesis — inference is explicitly disallowed (design's non-negotiable
      boundary #5); must be confirmed against the certifying body's own rules.
  - id: 3.5
    gate: Pre-FS
    agent_key: certification-agent
    skill_key: certification-roadmap
    output_type: certification_roadmap_map
    description: >
      Required-certification gap map with dependency DAG — sell-side access
      requirements tracked separately from permits, mirroring the
      greenfield-pre-fs placement (graph-pilot wiring, backfill-report
      §4.1).
  - id: 4
    gate: Pre-FS
    agent_key: process-governance-manager
    skill_key: stage-gate-governance
    output_type: gate_pass_record
    description: Confirm Pre-FS deliverables complete; open FS.

kill_criteria:
  - condition: wacc_hurdle_still_assumed
    action: halt
  - condition: certification_transferability_unconfirmed_and_load_bearing
    action: escalate_to_risk_officer
  # ADR-0187 phase P2 (finding M4): the flow.spec Pre-FS summary line
  # "entry route undecided" gets a procedure declaration and a registry entry.
  # Declared-but-inert (predicate null): the route decision is a human record
  # (route_decision, boundary #2); the gate reviewers judge it until a
  # predicate over the current route row is decided.
  - condition: entry_route_undecided_at_pre_fs_exit
    action: halt

legal_basis:
  - "Group New Business Review Policy §2.3"
  - "Design v1.0 §4-1, non-negotiable boundary #5 (permit/certification separation, no inference)"
  - "docs/governance/process-map.md — Pre-FS row"
  - "Meeting M1 (process-2026-08-20-m1-process-skeleton.md)"
  - "docs/pilots/pilot-011-posco-amberoad.md (R&BD as a Brown Field sub-type)"
  - "docs/pilots/pilot-014-c2y-university-techholdings.md finding F-4 (minority venture investment as an R&BD deal shape)"

  - "ADR-0187 (process SSOT and decision evidence) phase P2 — Pre-FS kill-criteria declaration (M4)"
  - "Owner decision 2026-11-08 (deal-shape evaluation moves from S4 to S7): step 2 reduced to a deal-structure intent note — docs/designs/2026-11-08-deal-shape-to-s7-design.md; ADR-0195"

owner_agent: process-governance-manager
last_reviewed: "2026-11-08"
