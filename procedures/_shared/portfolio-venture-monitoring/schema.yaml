schema_version: "1.0"
procedure_id: shared-portfolio-venture-monitoring
title: "Venture Portfolio Monitoring (post-approval, group level)"
scope: shared
level: group
version: "1.1.0"
status: active
# Design §E: cells with venture character — internal venture (cells 9/10),
# minority/hybrid (5/6), JV (7/8, feeding in via jv-lifecycle-governance
# step 3). The origin predicate is a NECESSARY-not-sufficient filter: it
# excludes external acquisitions (the PMI track owns those), but
# origin=internal ALSO includes cell-12 carve-outs, which lack venture
# character — the venture scope is prose keyed to the classification
# matrix (ADR-0047 §G), the same pattern as PMI's case_type-only predicate.
applicability: conditional
applies_when: { op: "in", var: "project.origin", values: ["internal", "hybrid", "joint"] }
workflow_type: core
gate: post_close
owner_agent: process-governance-manager
legal_basis:
  - "ADR-0052 §E (venture portfolio monitoring)"
  - "ADR-0150 (S12 completion criteria mapped to portfolio transitions — accepted 2026-10-02, immediate full application; version 1.0.0 → 1.1.0 adds per-transition records and criterion-6 data ownership)"
  - "docs/designs/2026-08-23-track-coverage-extension-design.md §E"
  - "ADR-0047 (12-cell classification matrix — venture-character cells)"
  - "docs/research/pmi-jv-lifecycle-best-practice.md [pmi-jv C.1-C.3]"

# Group-level cadence, not a per-project one-shot: step 1 runs per review
# cycle, steps 2-3 at each venture's stage transitions.

steps:
  - id: 1
    gate: post_close
    agent_key: group-review-agent
    skill_key: portfolio-fit-assessment
    output_type: portfolio_scorecard_rollup
    description: >
      Bifurcated metrics rollup [pmi-jv C.1]: FINANCIAL — IRR vs hurdle,
      cash-on-cash multiples, capital deployed vs milestone plan, revenue
      growth, valuation marks by stage normalized for time in market;
      STRATEGIC — introductions (BU-startup / partner), learning
      progressing to tangible products/partnerships/JVs (leading ->
      lagging), stage-progression rate, kill/graduate decision counts.
      Benchmark odds: 20-30% success is normal for CVC (ILLUSTRATIVE) —
      continued funding beyond that band requires explicit evidence.
      Inputs: gate_pass_record outputs, jv-lifecycle-governance step 2
      scorecards, the PMI synergy tracker. Per-venture rows persist via
      db/repositories/venture-scorecard.repository.ts
      recordVentureScorecardCycle (ADR-0059, migration 0024), and the
      group rollup reads them via `bun scripts/co-newbiz/newbiz.ts
      scorecard:rollup` — one review cycle as JSON: bifurcated
      financial/strategic sections, venture_class rollup,
      insufficient_evidence exceptions. The portfolio VIEW (server
      routes + web page) is the remaining E.4 link.
  - id: 2
    gate: post_close
    agent_key: process-governance-manager
    skill_key: project-review
    output_type: venture_transition_evidence
    description: >
      Stage-transition evidence pack [pmi-jv C.2, C.3]: tranche
      preconditions — blueprint milestones met, metrics current,
      documented parent + venture contribution responsibilities,
      parent-side capability commitments tracked as obligations;
      "freedom within financial guardrails" honored. Exit-path evaluation
      with a clear rationale for each option: integrate / standalone /
      spinout / reduce ownership / divest / kill. Time-boxed evidence
      windows — ventures that cannot show measurable impact lose
      management support (window length is a thresholds-meeting item);
      the graduation/integration concept is prepared BEFORE absorbing a
      venture into the core.
  - id: 3
    gate: post_close
    agent_key: venture-portfolio-ic   # human role — procedures/_human-roles.yaml registry (ADR-0053)
    decision_authority: human
    skill_key: stage-gate-governance
    output_type: venture_transition_decision
    description: >
      Human transition decision by the small senior IC with integrity
      guardrails (design §E.2): the tranche release for the next stage AND
      the kill/graduate call in one sitting — both fire at stage
      transitions. Decision vocabulary: next_tranche_released |
      held_evidence_incomplete | graduate_to_core | reduce_or_divest |
      kill_with_learning_captured. Kill decisions are recorded with
      rationale and learning capture recycled into the playbook — a kill
      is a governed decision, not a silent starve.

      ADR-0150 completion records (accepted 2026-10-02, IMMEDIATE full
      application to all in-flight projects — no cutoff): each review
      cycle produces the scorecard (step 1, criterion 1) and one human
      transition decision with non-empty rationale (criterion 2), plus
      the per-transition record — criterion 3: a continue decision
      (next_tranche_released / held_evidence_incomplete) records the
      next tranche condition; criterion 4: graduate_to_core records the
      hand-off to core business; criterion 5: reduce_or_divest records
      the divestment or wind-down plan. Criteria 3-5 are recorded in the
      decision row's rationale/learning_capture fields of
      venture_transition_decision (migration 0071) — no new columns.

      Criterion 6 data ownership: group-review-agent records the
      captured learning (the learning_capture field of a
      kill_with_learning_captured row); risk-officer feeds that
      learning back into the S1/S2 screening and base-rate reference
      classes. The transition decision itself stays a human decision by
      venture-portfolio-ic; agents draft, record, and recycle — they
      never decide.

# No kill-criteria registry entries: design §E names no candidates — the
# kill/graduate decision here is portfolio governance OUTPUT (step 3's
# decision vocabulary), not a gate-time condition that halts a procedure.
