schema_version: "1.0"
procedure_id: shared-brownfield-target-identification
title: "Brown Field Target Identification (Universe → Long List)"
scope: shared
level: entity
version: "1.1.0"
effective_from: "2026-09-01"
status: active
applicability: mandatory
workflow_type: core
gate: Pre-FS

# Post-route-decision stage (flow.spec v2.0.0 S6 대상 후보 발굴, brownfield only).
# Distinct from shared-brownfield-screening step 1: that Screening-gate step
# produces an early deal-thesis longlist BEFORE the route is chosen; this
# procedure runs AFTER track = brownfield is fixed and defines the full
# candidate universe with explicit selection criteria and coverage, then
# registers the Target Company Long List that S7 (target_screening gate)
# narrows to a Short List.
#
# 트랙 스코핑 (2026-10-22 프로젝트 리뷰 M7): 이 절차의 트랙 범위는 소유 stage가
# 강제한다 — flow.spec S6 applicableTracks [brownfield] (S6·S7 brownfield 전용)이며,
# 트랙 불일치 stage는 app/web-next/lib/process-flow.ts가 통째로 skipped 처리한다.
# 기회(operation) 단계에는 project 계층 case_type이 존재하지 않아 기계판독 가능한
# 트랙 predicate을 둘 수 없다 — 후속 과제로 기록 (docs/reports/2026-10-22-project-review-full.md M7).

steps:
  - id: 1
    gate: Pre-FS
    agent_key: brownfield-agent
    skill_key: brownfield-feasibility
    output_type: target_universe_definition
    description: >
      Define the Target Universe — the population of existing companies/assets
      that could serve the Opportunity under the selected Brownfield route
      (M&A/JV/strategic investment/minority/partnership/R&BD/CVC). Record the
      selection criteria (industry segment, value-chain node, geography, size
      band, business viability, route-specific constraints) and the minimum
      coverage the longlist must achieve before screening may start. Business
      viability is the profitability/sustainability condition of the value-chain
      stage the candidates sit in (segment profit pools, margin structure,
      pricing power), recorded with its evidence grade — or recorded as an
      honest gap (검증 필요 + the named data needed, e.g. value-chain stage
      financials per ADR-0066) when no profitability evidence exists.
      Technical-capability conditions are NOT universe criteria — they are
      screened per candidate at target screening (t-05 capability fit, t-07
      capability complementarity).
  - id: 2
    gate: Pre-FS
    agent_key: market-intelligence-agent
    skill_key: company-intelligence
    output_type: target_longlist
    description: >
      Populate the Target Company Long List from the defined universe — one
      record per candidate with the required attributes (identity, segment,
      value-chain position, ownership, scale, route-relevant capabilities) and
      source/evidence links per candidate. Coverage is checked against the
      universe definition of step 1; candidates without required attributes or
      sources do not count toward coverage.

completion_criteria:
  - Universe definition with explicit selection criteria is recorded
  - Long List meets the minimum coverage defined in the universe definition
  - Every Long List candidate carries required attributes and sources

kill_criteria:
  - condition: universe_cannot_be_defined
    action: back_to_route_decision
  - condition: minimum_coverage_not_achievable
    action: hold_pending_market_research

legal_basis:
  - "flow.spec.yaml v2.0.0 S6 (대상 후보 발굴) — Brownfield Long List is a distinct process stage, not a screening byproduct"
  - "Design v1.0 §6.3 (procedure/skill authority split)"
  - "DEC-20261111-05 and docs/designs/2026-11-11-s6-universe-viability-criteria-design.md (owner complaint 2026-11-11: S6 draft framed technically instead of by business viability; S7 t-08 compares against the recorded financial criteria)"

owner_agent: brownfield-agent
last_reviewed: "2026-11-11"
