schema_version: "1.0"
procedure_id: shared-greenfield-screening
title: "Green Field Screening"
scope: shared
level: entity
version: "1.3.0"
status: active
applicability: mandatory
workflow_type: core
gate: Screening

steps:
  - id: 1
    gate: Screening
    agent_key: process-governance-manager
    skill_key: strategic-fit-screening
    output_type: strategic_fit_screening_result
    description: >
      Strategic-fit screen BEFORE market sizing — the strategic filter
      precedes attractiveness rating (Cooper Gate 1; Green Book SOC). Knock-out
      criteria (sf-01..sf-05) plus the rated scorecard (sf-06..sf-12) per
      `checklists/strategic-fit-screening-checklist.yaml`, desk research and
      sponsor knowledge only. Decision vocabulary is Go/Kill/Hold/Recycle with
      written feedback recorded on every rejection. Scorecard weights and
      advance thresholds are ILLUSTRATIVE until the thresholds meeting under
      docs/decisions/open/ (ADR-0051 open question (b)).
  - id: 2
    gate: Screening
    agent_key: market-intelligence-agent
    skill_key: value-chain-linkage-analysis
    output_type: market_sizing
    description: TAM/SAM/SOM sizing and initial value-chain linkage read for the target industry.
  - id: 2.5
    gate: Screening
    agent_key: market-intelligence-agent
    skill_key: forward-industry-research
    output_type: forward_industry_research
    description: >
      Forward/upstream industry research narrative (ADR-0066) — which
      upstream and forward industries materially move the target, their
      structure, key players, technology/regulatory trends, and the
      key-driver candidates registered in `industry_driver` with external
      -environment scenario definitions. Prerequisite for the six-axis
      coefficient estimation and the FS industry-structure simulation.
  - id: 3
    gate: Screening
    agent_key: greenfield-agent
    skill_key: site-infrastructure-assessment
    output_type: site_shortlist_prefiltered
    description: >
      Build the site shortlist AFTER applying the hard pre-filter (infrastructure
      minimums, partner-dependency confirmation) per meeting M6 D-M6-1. Sites
      failing the pre-filter are excluded here, not scored lower in step 4.
      Community-consultation/notification boundary MUST be computed from the
      legally applicable affected-area radius (e.g. distance-from-coast for
      power generation facilities), never assumed equal to the site's own
      administrative jurisdiction — a real project (docs/pilots/pilot-007-punggu-offshore-wind.md)
      notified only its own province's municipalities and omitted a
      neighboring province's islands that were legally within the affected
      radius, triggering a public dispute and re-notification risk.
  - id: 4
    gate: Screening
    agent_key: greenfield-agent
    skill_key: regional-incentive-sourcing
    output_type: site_candidate_scored
    description: >
      Weighted score among pre-filtered survivors: infra readiness 30%,
      incentive NPV 25%, logistics cost 15%, labor availability 15%,
      permit critical-path (inverted) 15% (meeting M6 D-M6-1/D-M6-3).
  - id: 5
    gate: Screening
    agent_key: process-governance-manager
    skill_key: stage-gate-governance
    output_type: gate_pass_record
    description: Confirm Screening deliverables complete; open Pre-FS.

kill_criteria:
  - condition: zero_site_clears_infrastructure_minimums
    action: halt
  - condition: partner_dependency_unconfirmed_and_no_alternative
    action: mark_conditional
  - condition: infrastructure_plan_not_finalized_at_site_announcement
    action: escalate_to_risk_officer
    # Added per docs/pilots/pilot-005-sk-hynix-yongin-cluster.md finding F-1:
    # a real large-scale Green Field project (SK hynix Yongin cluster) proceeded
    # to site designation before power/water infrastructure plans were finalized
    # (concretized ~2 years later). The hard-pre-filter-first design intent
    # (meeting M6 D-M6-1) assumes infrastructure is known before scoring; this
    # condition flags the real-world deviation as elevated risk requiring
    # explicit escalation, rather than silently passing.

legal_basis:
  - "Group New Business Review Policy §4.1"
  - "Design v1.0 §8.7/§8.8"
  - "Meeting M1, M6 (process-2026-08-20-m1-process-skeleton.md, m6-site-selection-criteria.md)"
  - "docs/pilots/pilot-005-sk-hynix-yongin-cluster.md finding F-1"
  - "docs/pilots/pilot-007-punggu-offshore-wind.md finding F-1"
  - "checklists/strategic-fit-screening-checklist.yaml (chk-strategic-fit)"
  - "ADR-0051 (workflow gap closure — strategic fit at first screen)"
  - "Cooper Stage-Gate Gate 1 / HM Treasury Green Book Strategic Outline Case — strategic filter precedes attractiveness rating (docs/research/venture-governance-best-practice.md Area A)"

owner_agent: process-governance-manager
last_reviewed: "2026-08-22"
