schema_version: "1.0"
procedure_id: shared-greenfield-screening
title: "Green Field Screening"
scope: shared
level: entity
version: "1.6.0"
status: active
applicability: mandatory
workflow_type: core
gate: Screening

steps:
  - id: 1
    gate: Screening
    agent_key: process-governance-manager
    skill_key: strategic-fit-screening
    output_type: strategic_fit_screening_result
    description: >
      Strategic-fit screen BEFORE market sizing — the strategic filter
      precedes attractiveness rating (Cooper Gate 1; Green Book SOC). Knock-out
      criteria (sf-01..sf-05) plus the rated scorecard (sf-06..sf-12) per
      `checklists/strategic-fit-screening-checklist.yaml`, desk research and
      sponsor knowledge only. Decision vocabulary is Go/Kill/Hold/Recycle with
      written feedback recorded on every rejection. Scorecard weights and
      advance thresholds are ADOPTED POLICY per DEC-20260909-03 (ADR-0051 (b)
      resolved 2026-09-09); a recalibration review follows the first 5
      scorecard-bearing runs with confirmed outcomes.
  - id: 1.5
    gate: Screening
    agent_key: market-intelligence-agent
    skill_key: value-chain-linkage-analysis
    output_type: synergy_identification
    description: >
      S3 synergy identification (flow.spec activity `synergy-analysis`, lead;
      owner decision D6' 2026-10-28, amends ADR-0187 D6): locates WHERE the
      selected opportunity's synergies exist against the group/affiliate
      registry - which affiliates, and where in the value chain (forward and
      backward customers, supply chain, channel, technology) - using the
      six-axis value-chain linkage analysis. Every synergy line names its
      affiliate, linkage axis and evidence; amounts are left to step 1.55.
  - id: 1.55
    gate: Screening
    agent_key: financial-analyst
    skill_key: investment-feasibility-modeling
    output_type: synergy_score_recommendation
    description: >
      S3 synergy quantification (flow.spec activity `synergy-analysis`,
      support; D6'): quantifies each synergy line identified in step 1.5
      (revenue and cost amounts) and ties every amount to an entry of the
      assumption register. Records the opportunity.synergy_score
      recommendation and its rationale (ADR-0090); the score is a proposal to
      the Screening gate, never a decision.
  - id: 1.6
    gate: Screening
    agent_key: risk-officer
    skill_key: assumption-audit
    output_type: synergy_assumption_audit
    description: >
      S3 synergy red-team (flow.spec activity `synergy-red-team`, ADR-0187 D6):
      independent audit of the steps 1.5/1.55 assumption register for optimism bias
      and reference-class (base-rate) deviation. Drafts no assumption and sets
      no score; findings return to the author and travel with the gate
      proposal.
  - id: 2
    gate: Screening
    agent_key: market-intelligence-agent
    skill_key: value-chain-linkage-analysis
    output_type: market_sizing
    description: TAM/SAM/SOM sizing and initial value-chain linkage read for the target industry.
  - id: 2.5
    gate: Screening
    agent_key: market-intelligence-agent
    skill_key: forward-industry-research
    output_type: forward_industry_research
    description: >
      Forward/upstream industry research narrative (ADR-0066) — which
      upstream and forward industries materially move the target, their
      structure, key players, technology/regulatory trends, and the
      key-driver candidates registered in `industry_driver` with external
      -environment scenario definitions. Prerequisite for the six-axis
      coefficient estimation and the FS industry-structure simulation.
  - id: 3
    gate: Screening
    agent_key: site-facility-agent   # ADR-0185 A-02a; S3 activity stays led by greenfield-agent (recorded divergence, flow.spec)
    skill_key: site-infrastructure-assessment
    output_type: site_shortlist_prefiltered
    description: >
      Build the site shortlist AFTER applying the hard pre-filter (infrastructure
      minimums, partner-dependency confirmation) per meeting M6 D-M6-1. Sites
      failing the pre-filter are excluded here, not scored lower in step 4.
      Community-consultation/notification boundary MUST be computed from the
      legally applicable affected-area radius (e.g. distance-from-coast for
      power generation facilities), never assumed equal to the site's own
      administrative jurisdiction — a real project (docs/pilots/pilot-007-punggu-offshore-wind.md)
      notified only its own province's municipalities and omitted a
      neighboring province's islands that were legally within the affected
      radius, triggering a public dispute and re-notification risk.
      Produces items gf-01, gf-02 and gf-05 of
      `checklists/greenfield-feasibility-checklist.yaml`.
  - id: 4
    gate: Screening
    agent_key: greenfield-agent
    skill_key: regional-incentive-sourcing
    output_type: site_candidate_scored
    description: >
      Weighted score among pre-filtered survivors: infra readiness 30%,
      incentive NPV 25%, logistics cost 15%, labor availability 15%,
      permit critical-path (inverted) 15% (meeting M6 D-M6-1/D-M6-3).
      Produces items gf-03, gf-04, gf-06 and gf-07 of
      `checklists/greenfield-feasibility-checklist.yaml`.
  - id: 4.5
    gate: Screening
    agent_key: legal-counsel
    skill_key: regulatory-screening
    output_type: legal_regulatory_screen
    description: >
      S4 legal and regulatory screen (flow.spec activity `regulatory-screening`,
      ADR-0187 finding H9): every mandatory item of
      `checklists/legal-regulatory-checklist.yaml` (lr-01..lr-07) judged with
      evidence — permit pathway, certification requirements kept separate from
      permits (boundary #5), region profile coverage, foreign-investment
      screening, sanctions/anti-corruption on every counterparty. Statute and
      article checks run against source text (k-law), never memory. The
      Screening gate reads the result as a declared required artifact (flow.spec
      S4); an unmet mandatory item blocks unless an active waiver covers it
      (ADR-0037).
  - id: 5
    gate: Screening
    agent_key: process-governance-manager
    skill_key: stage-gate-governance
    output_type: gate_pass_record
    description: Confirm Screening deliverables complete; open Pre-FS.

kill_criteria:
  - condition: zero_site_clears_infrastructure_minimums
    action: halt
  - condition: partner_dependency_unconfirmed_and_no_alternative
    action: mark_conditional
  - condition: infrastructure_plan_not_finalized_at_site_announcement
    action: escalate_to_risk_officer
    # Added per docs/pilots/pilot-005-sk-hynix-yongin-cluster.md finding F-1:
    # a real large-scale Green Field project (SK hynix Yongin cluster) proceeded
    # to site designation before power/water infrastructure plans were finalized
    # (concretized ~2 years later). The hard-pre-filter-first design intent
    # (meeting M6 D-M6-1) assumes infrastructure is known before scoring; this
    # condition flags the real-world deviation as elevated risk requiring
    # explicit escalation, rather than silently passing.
  # v1.5.0 (ADR-0187 phase P2, finding M4): the flow.spec Screening-gate
  # summary lines get a procedure declaration and a registry entry each.
  # Declared-but-inert (predicate null) until risk-officer + quant-methodologist
  # set thresholds; until then the gate reviewers judge them.
  - condition: market_structurally_unattractive
    action: halt
  - condition: data_confidence_not_judgeable
    action: halt
  - condition: strategic_fit_knock_out_failed
    action: halt

legal_basis:
  - "Group New Business Review Policy §4.1"
  - "Design v1.0 §8.7/§8.8"
  - "Meeting M1, M6 (process-2026-08-20-m1-process-skeleton.md, m6-site-selection-criteria.md)"
  - "docs/pilots/pilot-005-sk-hynix-yongin-cluster.md finding F-1"
  - "docs/pilots/pilot-007-punggu-offshore-wind.md finding F-1"
  - "checklists/strategic-fit-screening-checklist.yaml (chk-strategic-fit)"
  - "checklists/legal-regulatory-checklist.yaml (chk-legal-regulatory), checklists/greenfield-feasibility-checklist.yaml (chk-greenfield-feasibility)"
  - "Owner decision D6' (2026-10-28, amends ADR-0187 D6; DEC-20261028-03) — synergy identification (market-intelligence-agent) split from quantification (financial-analyst)"
  - "ADR-0187 (process SSOT and decision evidence) phase P2 — synergy author/red-team steps (D6), legal-regulatory producer step (H9), screening kill-criteria declarations (M4)"
  - "ADR-0051 (workflow gap closure — strategic fit at first screen)"
  - "Cooper Stage-Gate Gate 1 / HM Treasury Green Book Strategic Outline Case — strategic filter precedes attractiveness rating (docs/research/venture-governance-best-practice.md Area A)"

owner_agent: process-governance-manager
last_reviewed: "2026-10-28"
