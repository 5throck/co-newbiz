schema_version: "1.0"
procedure_id: shared-brownfield-fs
title: "Brown Field Full Feasibility"
scope: shared
level: entity
version: "1.4.0"
status: active
applicability: mandatory
workflow_type: core
gate: FS

steps:
  - id: 1
    gate: FS
    agent_key: financial-analyst
    skill_key: quality-of-earnings
    output_type: qoe_normalized_ebitda
    description: >
      Normalized EBITDA via QoE, feeding the valuation bridge. Scope is
      mandatory-light for internal-origin carve-outs (2026-08-22 design of
      record, Decision 5e): full third-party QoE scope drops, but
      cost-allocation integrity and transfer-pricing review remain in full —
      carve-out cost allocations and transfer prices are manipulable and
      survive the carve-out, so this is a scope reduction, never a skip.
      This step states the scope; the conditional per-origin scoping table
      lands with PR-5c's applicability engine (no per-origin QoE step
      variants here).
  - id: 2
    gate: FS
    agent_key: valuation-agent
    skill_key: investment-feasibility-modeling
    output_type: full_valuation
    description: NPV/IRR/Payback/DSCR model assembled from confirmed WACC/hurdle (Pre-FS output) and normalized EBITDA.
  - id: 3
    gate: FS
    agent_key: quant-methodologist
    skill_key: monte-carlo-simulation
    output_type: distributional_valuation
    description: >
      Distributional valuation on the step-2 model (ADR-0052 §D.4): seeded
      Monte Carlo over the value drivers, integrating contingent
      liabilities as probability/triangular-distribution draws on every
      iteration — P50/P95 NPV and value-at-risk, never a point estimate
      with a narrative footnote.
  - id: 4
    gate: FS
    agent_key: legal-counsel
    skill_key: investment-vehicle-structuring
    output_type: deal_structure_review
    description: >
      Four-axis review of the Pre-FS deal_structure_hypothesis — the shape
      axes (asset_or_stock, stake_type, instrument_mix, vehicle +
      commercialization_path) each reviewed against ADR-0045's four
      mandatory axes (tax structure, liability isolation, financing
      leverage, exit structure); legal-counsel owns the tax and liability
      axes. Completing the review sets four_axis_review_completed on the
      deal_structure_hypothesis record (column and table land via migration
      0013; completion is a deliberate act, default 0 — referenced here,
      no DDL in this procedure). The deal_structure_review output records
      per-axis findings and any hypothesis revision for the IC package.
  - id: 5
    gate: FS
    agent_key: antitrust-agent
    skill_key: antitrust-screening
    output_type: six_way_cross_check_started
    description: >
      Six-way M&A cross-check *started* here per meeting M5's fixed
      evaluation order — (1) antitrust + HR integration, (2) customer
      retention + incentive, (3) certification transferability last.
      Completion (all six landed) is a DD-exit requirement, not FS-exit.
  - id: 6
    gate: FS
    agent_key: quant-methodologist
    skill_key: scenario-planning
    output_type: scenario_risk_assessment
    description: >
      FS risk assessment as discrete downside/base/upside scenarios
      (ADR-0052 §D.4) — including the standard +200bp rate-shock covenant
      test and any deal-specific structural scenario. Feeds the
      covenant-breach kill criterion and the DD risk workstreams.
  - id: 7
    gate: FS
    agent_key: market-intelligence-agent
    skill_key: scenario-planning
    output_type: industry_structure_simulation
    description: >
      Industry-structure scenario simulation (ADR-0066 Phase C) — driver
      deltas (rate/fx/commodity/regulation from the run's drv.* assumptions)
      propagated through the value chain's elasticity and pass-through
      coefficients, persisting P05/P50/P95 demand/margin deltas per node.
      Owned by market-intelligence-agent per its six-axis charter;
      coefficient-less links surface as UNASSESSED nodes, never zero impact.
  - id: 7.5
    gate: FS
    agent_key: financial-analyst
    skill_key: financial-statement-analysis
    output_type: fs_canonical_kpi_baseline
    description: >
      Canonical-model KPI baseline (profitability, growth, leverage, cash
      flow) feeding QoE and feasibility inputs (graph-pilot wiring,
      backfill-report §4.1).
  - id: 7.6
    gate: FS
    agent_key: financial-analyst
    skill_key: peer-benchmarking
    output_type: peer_benchmark_set
    description: >
      Comparable-company benchmark of target KPIs — cross-sectional
      counterpart to historical trend analysis (graph-pilot wiring).
  - id: 7.7
    gate: FS
    agent_key: quant-methodologist
    skill_key: proxy-industry-chain
    output_type: proxy_demand_chain
    description: >
      Proxy-chain demand estimation where direct market data is absent;
      chain reliability graded A/B/C on statistical hops only (graph-pilot
      wiring).
  - id: 7.8
    gate: FS
    agent_key: quant-methodologist
    skill_key: unit-conversion-calibration
    output_type: unit_conversion_calibration
    description: >
      OLS calibration of a proxy-chain hop with lead-lag search and 95%
      confidence interval (graph-pilot wiring).
  - id: 7.9
    gate: FS
    agent_key: financial-analyst
    skill_key: value-chain-stage-financials
    output_type: chain_stage_financial_rollup
    description: >
      Per-value-chain-node 5-year KPI rollup (ADR-0066) — revenue growth,
      margin, and ROIC per chain stage assembled from DART company data
      into `fact_industry`, with member-company list and aggregation
      method. The historical baseline the step-7 structure simulation is
      sanity-checked against.
  - id: 7.95
    gate: FS
    agent_key: quant-methodologist
    skill_key: value-chain-driver-identification
    output_type: chain_node_sensitivity_set
    description: >
      Per-stage driver sensitivities derived by correlation/lead-lag
      estimation of each node's financial series against registered driver
      series, written to `chain_node_sensitivity` with fit quality and
      confidence grade — replacing unexamined manual entries as the step-7
      simulation's sensitivity inputs.
  - id: 7.96
    gate: FS
    agent_key: financial-analyst
    skill_key: target-costing-analysis
    output_type: target_cost_gap
    description: >
      Target costing (design 2026-09-18-s8-business-case-evaluation REQ-W2-1):
      market price anchored to peer benchmark or the proxy demand chain is
      reversed into an allowable cost at the target margin, compared against
      the estimated unit cost from the cost structure. The output records
      market_price, target_margin, allowable_cost, estimated_unit_cost, and
      the gap with reduction levers; a gap beyond the +10% threshold feeds the
      downside scenario's opex driver and the business-case snapshot warnings.
  - id: 8
    gate: FS
    agent_key: process-governance-manager
    skill_key: stage-gate-governance
    output_type: gate_pass_record
    description: Confirm FS deliverables complete; open DD.

kill_criteria:
  - condition: qoe_reveals_material_earnings_quality_gap_unexplained
    action: escalate_to_risk_officer

legal_basis:
  - "Group New Business Review Policy §2.3"
  - "Design v1.0 §4-4, §4-6"
  - "docs/governance/process-map.md — FS row"
  - "Meeting M5 (m5-ma-model-linkage.md) — fixed evaluation order"
  - "ADR-0045 (investment-vehicle-structuring as a deal-structure axis — four mandatory review axes)"
  - "ADR-0051 (workflow gap closure — four-axis review step added at FS)"
  - "db/migrations/0013_classification_infra.sql — deal_structure_hypothesis table incl. four_axis_review_completed"
  - "2026-08-22 RAG formalization design Decision 5e (QoE mandatory-light for internal-origin carve-outs — cost-allocation integrity and transfer-pricing review remain)"
  - "ADR-0052 §D.4 (quant-methodologist FS dispatches — steps 3 and 6)"

owner_agent: process-governance-manager
last_reviewed: "2026-08-23"
