schema_version: "1.0"
procedure_id: shared-brownfield-screening
title: "Brown Field Screening"
scope: shared
level: entity
version: "1.2.0"
status: active
applicability: mandatory
workflow_type: core
gate: Screening

# structured, not prose — dispatch code reads this list directly (meeting M7-3 D-M7-3-1)
steps:
  - id: 1
    gate: Screening
    agent_key: brownfield-agent
    skill_key: brownfield-feasibility
    output_type: target_longlist
    # origin-gated (design Decision 5e): internal origin exempts ONLY this step —
    # a carve-out has no external longlist to build. Evaluated by db/lib/applies-when.ts;
    # an unassessed origin APPLIES the step by default (fail-closed), and a skip is
    # recorded with the rendered predicate reason, never silent — for internal origin
    # the skip record carries the Decision 7 needs-judgement note ("not yet judged",
    # not "not applicable") until PR-9 lands the internal-pathway content.
    # NOTE (flow.spec v2.0.0): this Screening-gate longlist is an EARLY deal-thesis
    # candidate scan made BEFORE the route is chosen. The post-route-decision,
    # full Target Universe → Long List stage is S6 via
    # shared-brownfield-target-identification; do not conflate the two.
    applies_when: { op: "in", var: "project.origin", values: ["external", "hybrid", "joint"] }
    description: >
      Identify and longlist acquisition targets against the deal thesis.
      Internal origin exempts only this step; every other Screening step —
      including the HHI pre-screen — runs for internal-origin carve-outs.
  - id: 2
    gate: Screening
    agent_key: process-governance-manager
    skill_key: strategic-fit-screening
    output_type: strategic_fit_screening_result
    description: >
      Strategic-fit screen BEFORE any market-concentration work — knock-out
      criteria (sf-01..sf-05) plus the rated scorecard (sf-06..sf-12) per
      `checklists/strategic-fit-screening-checklist.yaml`, desk research and
      sponsor knowledge only, no commissioned analysis. Decision vocabulary
      is Go/Kill/Hold/Recycle with written feedback recorded on every
      rejection. Scorecard weights and advance thresholds are ADOPTED POLICY
      per DEC-20260909-03 (ADR-0051 (b) resolved 2026-09-09); a
      recalibration review follows the first 5 scorecard-bearing runs with
      confirmed outcomes.
  - id: 3
    gate: Screening
    agent_key: antitrust-agent
    skill_key: antitrust-screening
    output_type: preliminary_hhi_screen
    # fact-gated (design Decision 5e / reversal #6): the gate is whether the target
    # CURRENTLY competes externally (an asserted, cross-domain-reviewed fact var) —
    # never the origin classification label. Unassessed fact var => step APPLIES by
    # default with an applied-by-default note (fail-closed).
    applies_when: { op: "in", var: "target.has_external_market_presence", values: [true] }
    description: >
      Rough market definition and HHI pre-screen — full six-way cross-check
      runs at DD, this is an early filter only. Gated on the fact of external
      market presence, not on origin: a carved-out business unit already
      competing in the external market can carry MORE antitrust exposure after
      combining with a new partner (2026-08-22 design of record, Decision 5e /
      reversal #6 — an internal-origin label must never suppress this screen).
  - id: 3.5
    gate: Screening
    agent_key: market-intelligence-agent
    skill_key: forward-industry-research
    output_type: forward_industry_research
    description: >
      Forward/upstream industry research narrative (ADR-0066) — which
      upstream and forward industries materially move the target, their
      structure, key players, technology/regulatory trends, and the
      key-driver candidates registered in `industry_driver` with external
      -environment scenario definitions. Prerequisite for the six-axis
      coefficient estimation and the FS industry-structure simulation.
  - id: 4
    gate: Screening
    agent_key: process-governance-manager
    skill_key: stage-gate-governance
    output_type: gate_pass_record
    description: Confirm Screening deliverables complete; open Pre-FS.

kill_criteria:
  - condition: no_viable_target_in_longlist
    action: halt
  - condition: preliminary_hhi_flags_certain_block
    action: escalate_to_risk_officer

legal_basis:
  - "Group New Business Review Policy §2.3 (six-validator requirement applies from DD, not Screening)"
  - "Design v1.0 §6.3 (procedure/skill authority split)"
  - "Meeting M1 (process-2026-08-20-m1-process-skeleton.md) gate deliverable definitions"
  - "checklists/strategic-fit-screening-checklist.yaml (chk-strategic-fit)"
  - "ADR-0051 (workflow gap closure — strategic fit at first screen)"
  - "2026-08-22 RAG formalization design Decision 5e / reversal #6 (fact-gated HHI pre-screen; origin exempts the longlist step only — applies_when evaluated by db/lib/applies-when.ts)"
  - "Cooper Stage-Gate Gate 1 (Idea Screen) / HM Treasury Green Book Strategic Outline Case — strategic filter precedes heavy analysis (docs/research/venture-governance-best-practice.md Area A)"

owner_agent: process-governance-manager
last_reviewed: "2026-08-23"
