schema_version: "1.0"
procedure_id: shared-greenfield-fs
title: "Green Field Full Feasibility"
scope: shared
level: entity
version: "1.2.0"
status: active
applicability: mandatory
workflow_type: core
gate: FS

steps:
  - id: 1
    gate: FS
    agent_key: financial-analyst
    skill_key: growth-projection-modeling
    output_type: growth_projection
    description: >
      Anchored growth projection (design §4-4) — every derived figure carries
      an anchor_ref. Base-rate check: outside the top decile of historical/peer
      distribution requires risk-officer sign-off, not a silent pass.
  - id: 2
    gate: FS
    agent_key: greenfield-agent
    skill_key: site-infrastructure-assessment
    output_type: capex_schedule_with_permit_critical_path
    description: >
      Full capex schedule sequenced against the permit DAG's critical path
      (permit-pathway-mapping) — permit lead time is a direct IRR input, not
      a separate footnote.
  - id: 3
    gate: FS
    agent_key: valuation-agent
    skill_key: investment-feasibility-modeling
    output_type: valuation_model
    description: NPV/IRR/Payback/DSCR model assembled from confirmed WACC/hurdle (Pre-FS output) and the anchored growth projection.
  - id: 4
    gate: FS
    agent_key: quant-methodologist
    skill_key: monte-carlo-simulation
    output_type: distributional_valuation
    description: >
      Distributional valuation on the step-3 model (ADR-0052 §D.4): seeded
      Monte Carlo over the value drivers — P50/P95 NPV and value-at-risk,
      never a point estimate with a narrative footnote. The proxy-chain
      confidence problem (a two-hop proxy estimate cannot reach Green,
      boundary #4) is exactly where distributional valuation earns its
      keep: chain reliability enters as the dispersion of the demand
      driver, and step 1's anchored growth projection is the input
      contract.
  - id: 5
    gate: FS
    agent_key: quant-methodologist
    skill_key: scenario-planning
    output_type: scenario_risk_assessment
    description: >
      FS risk assessment as discrete downside/base/upside scenarios
      (ADR-0052 §D.4) — including the rate-shock covenant test where
      project financing covenants bind. Feeds the covenant-breach kill
      criterion and the DD risk workstreams.
  - id: 6
    gate: FS
    agent_key: market-intelligence-agent
    skill_key: scenario-planning
    output_type: industry_structure_simulation
    description: >
      Industry-structure scenario simulation (ADR-0066 Phase C) — driver
      deltas (rate/fx/commodity/regulation from the run's drv.* assumptions)
      propagated through the value chain's elasticity and pass-through
      coefficients, persisting P05/P50/P95 demand/margin deltas per node.
      Owned by market-intelligence-agent per its six-axis charter;
      coefficient-less links surface as UNASSESSED nodes, never zero impact.
  - id: 6.5
    gate: FS
    agent_key: financial-analyst
    skill_key: historical-financial-analysis
    output_type: historical_financial_base_rate
    description: >
      Multi-year trend/volatility/cyclicality base-rate distribution that
      growth-projection-modeling anchors against (graph-pilot wiring,
      backfill-report §4.1).
  - id: 6.6
    gate: FS
    agent_key: financial-analyst
    skill_key: peer-benchmarking
    output_type: peer_benchmark_set
    description: >
      Comparable-company KPI benchmark — cross-sectional counterpart to the
      historical base rate (graph-pilot wiring).
  - id: 6.7
    gate: FS
    agent_key: quant-methodologist
    skill_key: proxy-industry-chain
    output_type: proxy_demand_chain
    description: >
      Proxy-chain demand estimation where no direct market data exists
      (graph-pilot wiring).
  - id: 6.8
    gate: FS
    agent_key: quant-methodologist
    skill_key: unit-conversion-calibration
    output_type: unit_conversion_calibration
    description: >
      Per-hop statistical calibration of the proxy chain (graph-pilot
      wiring).
  - id: 6.9
    gate: FS
    agent_key: financial-analyst
    skill_key: value-chain-stage-financials
    output_type: chain_stage_financial_rollup
    description: >
      Per-value-chain-node 5-year KPI rollup (ADR-0066) — revenue growth,
      margin, and ROIC per chain stage assembled from DART company data
      into `fact_industry`, with member-company list and aggregation
      method. The historical baseline the step-6 structure simulation is
      sanity-checked against.
  - id: 6.95
    gate: FS
    agent_key: quant-methodologist
    skill_key: value-chain-driver-identification
    output_type: chain_node_sensitivity_set
    description: >
      Per-stage driver sensitivities derived by correlation/lead-lag
      estimation of each node's financial series against registered driver
      series, written to `chain_node_sensitivity` with fit quality and
      confidence grade — replacing unexamined manual entries as the step-6
      simulation's sensitivity inputs.
  - id: 6.96
    gate: FS
    agent_key: financial-analyst
    skill_key: target-costing-analysis
    output_type: target_cost_gap
    description: >
      Target costing (design 2026-09-18-s8-business-case-evaluation REQ-W2-1):
      market price anchored to peer benchmark or the proxy demand chain is
      reversed into an allowable cost at the target margin, compared against
      the estimated unit cost from the cost structure. The output records
      market_price, target_margin, allowable_cost, estimated_unit_cost, and
      the gap with reduction levers; a gap beyond the +10% threshold feeds the
      downside scenario's opex driver and the business-case snapshot warnings.
  - id: 7
    gate: FS
    agent_key: process-governance-manager
    skill_key: stage-gate-governance
    output_type: gate_pass_record
    description: Confirm FS deliverables complete; open DD.

kill_criteria:
  - condition: growth_projection_outside_top_decile_without_risk_officer_signoff
    action: halt
  - condition: permit_critical_path_exceeds_incentive_deadline
    action: escalate_to_risk_officer

legal_basis:
  - "Group New Business Review Policy §2.3"
  - "Design v1.0 §4-4"
  - "docs/governance/process-map.md — FS row"
  - "docs/governance/rag-framework.md §6 (base-rate calibration)"
  - "ADR-0052 §D.4 (quant-methodologist FS dispatches — steps 4-5)"

owner_agent: process-governance-manager
last_reviewed: "2026-08-23"
