schema_version: "1.0"
procedure_id: shared-brownfield-dd
title: "Brown Field Due Diligence"
scope: shared
level: entity
version: "1.8.0"
effective_from: "2026-08-20"
status: active
# 트랙 스코핑 (2026-10-22 프로젝트 리뷰 M7): S9 brownfield DD에 procedure 계층
# 기계판독 predicate을 둔다 — greenfield-execution-baseline·pmi-integration-
# execution과 같은 모양 (flow.spec 교리 "범위는 각 procedure의 applies_when이
# 강제한다"). Metadata-only 변경 — version 1.6.1 유지.
applicability: conditional
applies_when: { op: "cmp", var: "project.case_type", cmp: "eq", value: "brownfield" }
workflow_type: core
gate: DD

steps:
  - id: 1
    gate: DD
    agent_key: commercial-dd-agent
    skill_key: commercial-due-diligence
    output_type: dd_finding
    description: >
      Customer/channel/pricing-power checks per `checklists/commercial-dd-checklist.yaml`,
      including the four-axis revenue-quality assessment (cdd-08, recommended:
      concentration, margin, collection period, recurrence). This step is the single place
      customer concentration (cdd-01) and churn (cdd-02) figures are computed;
      step 4 consumes them (ADR-0147).
  - id: 2
    gate: DD
    agent_key: technical-dd-agent
    skill_key: technical-due-diligence
    output_type: dd_finding
    description: Site visit, remaining equipment life, TRL, EHS per `checklists/technical-dd-checklist.yaml`.
  - id: 3
    gate: DD
    agent_key: technical-dd-agent
    skill_key: technical-due-diligence
    output_type: dd_finding
    description: >
      R&BD deals only (technology_track: rbd on the 3-axis classification —
      technology/IP acquisition, license-in, or internal-venture spin-off
      carve-out; the `case_subtype` field this step previously cited was
      retired by ADR-0047): run the TRL / production-process / core-technology
      portions of `checklists/rbd-technology-checklist.yaml` in addition to
      step 2 — core-technology TRL (distinct from production-process TRL),
      government co-funding conditions, the build/license/spin-off
      commercialization-path decision, and continuing parent-entity
      relationship terms where the target originated as an internal venture.
      The IP/freedom-to-operate diligence moved to step 3.5 (ADR-0185).
      See docs/pilots/pilot-011-posco-amberoad.md. Not applicable (skip) for
      non-R&BD deals.
  - id: 3.5
    gate: DD
    agent_key: ip-agent
    skill_key: ip-fto-review
    output_type: dd_finding
    applies_when: { op: "cmp", var: "project.technology_track", cmp: "eq", value: "rbd" }
    description: >
      R&BD deals only (ADR-0185 D-5): patent landscape, freedom-to-operate
      position and target IP valuation per the IP/FTO items of
      `checklists/rbd-technology-checklist.yaml`. Split out of step 3 so the
      IP finding is owned by ip-agent rather than technical-dd-agent. The
      finding carries a `value_impact` or `assumption_key` so it moves the
      valuation (dd-to-valuation-bridge). An FTO conclusion without counsel
      review is a proposal; statute questions route to legal-counsel.
      Not applicable (skip) for non-R&BD deals.
  - id: 4
    gate: DD
    agent_key: market-intelligence-agent
    skill_key: competitive-intelligence
    output_type: dd_finding
    description: >
      Market DD per `checklists/market-dd-checklist.yaml` (mdd-01..) —
      TAM/SAM triangulation, competitive set, moat, market-side tests of
      customer concentration and churn (figures taken from step 1, not
      recomputed; ADR-0147), 80/20 revenue vs. thesis. Thesis-by-thesis validation verdicts
      (validated/partially/invalidated) feed the valuation bridge via
      retention-adjusted revenue impact and bid-adjustment recommendations.
      Runs alongside, not inside, commercial DD (step 1): step 1 tests the
      TARGET's commercial position; this step tests the MARKET the target
      sits in (ADR-0051). Evidence gathering may run in parallel with step 1;
      the reconciliation of concentration/churn waits for step 1's figures.
  - id: 4.5
    gate: DD
    agent_key: brownfield-agent
    skill_key: brownfield-feasibility
    output_type: capability_dd_judgement
    description: >
      Capability DD (flow.spec activity `capability-dd`, design
      2026-10-19-brownfield-capability-dd; added to the procedure by ADR-0187
      P2, finding M2): verify each S3 required capability against the selected
      target — resolved / partially resolved / unresolved with evidence. The
      judgement per capability is a human record (boundary #2); this step
      prepares the evidence and the draft. It is the T1 basis of the S8
      technical lens.
  - id: 5
    gate: DD
    agent_key: legal-counsel
    skill_key: legal-due-diligence
    output_type: dd_finding
    description: >
      Legal DD per `checklists/legal-dd-checklist.yaml` (ldd-01..) — corporate
      standing/cap table, CoC/anti-assignment contract scan, litigation,
      IP title chain, employment/legal exposure, environmental/real-estate/
      data-protection/anti-bribery/tax. Output is a RAG findings register:
      red = deal-structural/remediation, amber = warranty/indemnity, green =
      acceptable. Red/amber findings map to SPA protections (specific
      indemnities, escrow sizing, CPs) and valuation adjustments through the
      dd-to-valuation-bridge. Distinct from the certification-transferability
      step (step 11) and from screening-level chk-legal-regulatory — legal
      basis for transferability lives there, this step supplies the evidence.
  - id: 5.5
    gate: DD
    agent_key: financial-analyst
    skill_key: quality-of-earnings
    output_type: dd_finding
    description: >
      Financial DD per `checklists/financial-dd-checklist.yaml` (fdd-01..)
      — quality of earnings, normalized working capital, debt and debt-like
      items, tax position, cash-flow quality, related-party transactions,
      management-accounts reconciliation and projections tested against
      history (flow.spec activity `financial-dd`; ADR-0187 P2, finding M2).
      Every material finding lands as dd_finding with value_impact.
  - id: 6
    gate: DD
    agent_key: antitrust-agent
    skill_key: antitrust-screening
    output_type: dd_finding
    description: >
      HHI/HHI-delta finalized, multi-jurisdiction filing confirmed, gun-jumping
      check — `checklists/ma-special-topics-checklist.yaml` ma-01/02/03. Covers
      common-ownership/common-control combinations (a sponsor already
      controlling one competitor acquiring another), not only direct mergers
      of the target entities — docs/pilots/pilot-010-affinity-lotte-rental.md
      is a real prohibited deal of exactly this shape, the pilot set's first
      outright-block outcome. Real-case pattern reference: docs/pilots/pilot-001-hd-hyundai-stx-heavy-industries.md
      (horizontal, conditional approval) vs. docs/pilots/pilot-002-hanwha-impact-hsd-engine.md
      (vertical, unconditional approval) — the same step must correctly
      discriminate between these risk shapes, not apply one template.
  - id: 6.5
    gate: DD
    agent_key: region-lead
    skill_key: regulatory-screening
    output_type: dd_finding
    description: >
      Region labor-law review per the labor axis of
      `region-profiles/<ISO>.yaml` for the target jurisdiction — works
      council / employee consultation, collective-agreement successorship,
      employment-transfer regime, mandatory notice periods (ADR-0185 D-4;
      `checklists/ma-special-topics-checklist.yaml` ma-13, counted validator
      under `checklists/brownfield-feasibility-checklist.yaml` bf-01). Its
      finding feeds step 7 (compensation) and step 13 (HR DD). Statute
      interpretation stays with legal-counsel.
  - id: 7
    gate: DD
    agent_key: hr-integration-agent
    skill_key: management-incentive-review
    output_type: dd_finding
    description: Executive CoC-trigger compensation and compensation-harmonization-analysis — `checklists/ma-special-topics-checklist.yaml` ma-04 through ma-06.
  - id: 8
    gate: DD
    agent_key: customer-retention-agent
    skill_key: customer-attrition-risk
    output_type: dd_finding
    description: >
      Change-of-control clause scan across customer AND supplier contracts
      (checklist ma-07/08, widened per docs/pilots/pilot-002-hanwha-impact-hsd-engine.md
      finding F-2 — a retained seller-side supply relationship is the same
      risk category as a customer contract).
  - id: 9
    gate: DD
    agent_key: incentive-agent
    skill_key: incentive-clawback-assessment
    output_type: dd_finding
    description: Clawback exposure on any contemplated relocation/restructuring — checklist ma-09.
  - id: 10
    gate: DD
    agent_key: valuation-agent
    skill_key: debt-and-contingent-liability-simulation
    output_type: dd_finding
    description: >
      Contingent liabilities and covenant-breach scenario — checklist ma-10/11.
      Not one of the six M&A validators (D-1, ADR-0185); the covenant-breach
      kill criterion still applies. Mandatory DD step with the standard waiver path.
  - id: 11
    gate: DD
    agent_key: legal-counsel
    skill_key: certification-transferability
    output_type: dd_finding
    description: >
      Certification transferability confirmed LAST among the validators per
      meeting M5's fixed evaluation order (checklist ma-12) — a
      non-transferable certification can strip the entire acquisition
      premium and must not be computed against a valuation that already
      assumed it. The transferability judgment is legal-counsel's call
      (design of record 2026-08-22 §5 PR-3, meeting legal-review findings
      #1/#6); certification-agent provides the requirement/roadmap input.
  - id: 12
    gate: DD
    agent_key: valuation-agent
    skill_key: financing-plan-review
    output_type: financing_readiness_check
    description: >
      Financing evidence pack per `checklists/financing-plan-checklist.yaml`
      (fin-01..) — cash/debt/equity mix with sources-and-uses, executed
      commitment papers or documented internal-funds approval path,
      covenant headroom, funds-flow memorandum draft, FX plan, escrow
      sizing, reverse-termination-fee sizing where buyer retains funding
      risk (4-7% EV benchmark ILLUSTRATIVE until the thresholds meeting —
      ADR-0051 open question (c)). Certainty of funds is evidenced here so
      the IC package carries a financing_readiness_check, not a financing
      contingency.
  - id: 12.5
    gate: DD
    agent_key: financing-agent
    skill_key: financing-plan-review
    output_type: financing_readiness_check
    description: >
      Financing DD review (flow.spec activity `financing-dd`; ADR-0187 P2,
      finding M2): independent review of the step 12 evidence pack — funding
      certainty per source, covenant headroom under the downside scenario
      (starting threshold: downside DSCR headroom of at least 1.3x, ADR-0187
      D2), change-of-control acceleration exposure. Advises on structure,
      never on the investment decision itself.
  - id: 13
    gate: DD
    agent_key: hr-integration-agent
    skill_key: org-readiness-assessment
    output_type: dd_finding
    description: >
      HR DD per `checklists/hr-dd-checklist.yaml` (hdd-01..) — key-person
      map with retention actions, stay-bonus budget (12-24 month benchmark
      ILLUSTRATIVE — ADR-0051 open question (c)), org/leadership bench,
      CBA successorship and pension exposure, employment-transfer regime
      per jurisdiction, culture distance, day-1 and first-100-days plan.
      Compensation review stays in the validator step (step 7); this step
      is the wider organizational and labor-relations picture.
  - id: 14
    gate: DD
    agent_key: compliance-officer
    skill_key: compliance-monitoring
    output_type: six_validator_completeness_check
    description: >
      Six-validator completeness is recorded as THREE numbers — declared 6 /
      applicable N / completed M (ADR-0048 §4; the durable record is written
      by db/repositories/compliance.repository.ts). All six M&A validators
      (steps 6 antitrust, 6.5 region-lead labor review, 7 hr-integration,
      8 customer-retention, 9 incentive, 11 certification transferability,
      LAST; step 10 contingent liability is a mandatory DD step outside the
      six-validator core with the standard waiver path — ADR-0185 D-1) are
      DECLARED for every project. A validator the applicability
      registry does not apply to the live classification (ADR-0048 — the
      only skip family is greenfield+internal, contingent-liability
      regained when technology_track=rbd) is covered-with-reason: a
      compliance_check row result='not_applicable' carrying the rendered
      applies_when sentence plus the classification and approver trace —
      NEVER 'pass'. The no-waiver halt (kill criterion below) fires when an
      APPLICABLE validator is missing; an applicable validator with no
      coverage row fails this step regardless of anything else. This is a
      completeness check with NO WAIVER PATH (design §8.9-1(f),
      docs/governance/governance-operations.md §2) — not a judgment call. The DD
      cross-validation (Decisions 5f/5g) runs alongside: classification-
      independent DD evidence contradicting the classification blocks DD
      exit only when the classification's provenance is weak. The four
      DD-expansion steps (4 market, 5 legal, 12 financing, 13 HR) are
      OUTSIDE the no-waiver core: mandatory but with the standard waiver
      path (ADR-0051; whether legal DD joins the core is an open question
      for the thresholds meeting, not decided here).
      Derivation note (ADR-0186 D4, neb-policy 2.3): checklist item bf-01 is
      DERIVED from this step's completeness record (the validator engine),
      not set by hand; a manual bf-01 state has no effect, and a DD GO is
      rejected while an applicable validator is missing. Wording only — step
      assignments and the kill criterion are unchanged.
  - id: 15
    gate: DD
    agent_key: process-governance-manager
    skill_key: stage-gate-governance
    output_type: gate_pass_record
    description: Confirm DD deliverables complete; open Entity IC.

kill_criteria:
  - condition: any_of_six_ma_validators_missing_at_dd_exit
    action: halt   # no waiver path — completeness check, not judgment (design §8.9-1(f))
  - condition: certification_transferability_computed_by_inference_not_confirmation
    action: halt   # non-negotiable boundary #5 — inference disallowed
  - condition: covenant_breach_with_coc_acceleration_under_downside
    action: halt   # risk-thresholds AI-1 / D-M-RISK-2 — downside covenant breach is a kill-grade fact; CoC-acceleration subset is indistinguishable in evidence (no type column), so the halt is deliberately over-inclusive in the safe direction (ADR-0055)
  - condition: partner_dependency_unconfirmed_and_no_alternative
    action: mark_conditional   # risk-thresholds AI-1 / D-M-RISK-3 — brownfield counterpart of greenfield-screening's criterion; "no alternative" = fewer than two active candidates AND high dependency, the same evidence as the graded amber rule (ADR-0055)

legal_basis:
  - "Group New Business Review Policy §2.3"
  - "Design v1.0 §4-6, §8.9-1(f) (six-validator no-waiver completeness check)"
  - "docs/governance/process-map.md — DD row"
  - "docs/governance/governance-operations.md §2 (no waiver for completeness checks)"
  - "Meeting M5 (m5-ma-model-linkage.md) — fixed evaluation order"
  - "checklists/ma-special-topics-checklist.yaml"
  - "docs/pilots/pilot-010-affinity-lotte-rental.md finding F-2"
  - "checklists/rbd-technology-checklist.yaml (R&BD sub-type, design v1.0 §10 user decision 2026-08-20)"
  - "checklists/market-dd-checklist.yaml (chk-market-dd, step 4 — ADR-0051)"
  - "checklists/legal-dd-checklist.yaml (chk-legal-dd, step 5 — ADR-0051)"
  - "checklists/financing-plan-checklist.yaml (chk-financing, step 12 — ADR-0051)"
  - "checklists/hr-dd-checklist.yaml (chk-hr-dd, step 13 — ADR-0051)"
  - "ADR-0051 (workflow gap closure — six-validator no-waiver core unchanged at steps 6-11; new steps mandatory with standard waiver path)"
  - "ADR-0147 (revenue-quality four-axis assessment cdd-08; single computation owner for concentration and churn — wording only, steps and keys unchanged)"
  - "ADR-0185 (placement realignment: step 6.5 region-labor joins the six-validator core, contingent-liability step 10 leaves it; step 3.5 ip-fto-review for R&BD)"
  - "ADR-0048 (no-waiver scope = APPLICABLE validators; 3-number completeness record; not_applicable rows + invalidation on reclassification)"
  - "ADR-0187 (process SSOT and decision evidence) phase P2 — steps 4.5 capability DD, 5.5 financial DD (checklists/financial-dd-checklist.yaml), 12.5 financing DD review (M2); six-validator core and step numbers unchanged"

owner_agent: process-governance-manager
last_reviewed: "2026-10-28"
