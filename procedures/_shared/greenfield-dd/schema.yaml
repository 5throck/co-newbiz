schema_version: "1.0"
procedure_id: shared-greenfield-dd
title: "Green Field Due Diligence"
scope: shared
level: entity
version: "1.3.0"
status: active
applicability: mandatory
workflow_type: core
gate: DD

# v1.1.0 (ADR-0160, Proposed; design 2026-10-11-greenfield-dd-and-investment-
# structure-by-subtrack) — sub-track-aware evidence steps. The procedure id,
# gate DD, mandatory applicability, the waiver path and the DD completion
# criterion are unchanged; only WHICH evidence steps apply differs.
#
# Selection rule (greenfield sub-track values: null | existing_business_rbd |
# intra_venture; any other value on a greenfield route is treated as unknown
# -> the null/site-based default applies and a warning is surfaced, never a
# block or a guess):
#   step 1, 2, 3  — null sub-track: always (byte-identical to v1.0.0).
#                   existing_business_rbd / intra_venture: steps 1 and 3 unless
#                   a human confirmed site_required = false; step 2 -> step 6.
#   step 6        — existing_business_rbd, intra_venture.
#   step 7        — existing_business_rbd, intra_venture (optional for null
#                   when the plan is technology-led).
#   step 8        — intra_venture only.
#   step 4, 5     — every sub-track.
#   step 9-17     — steps 10, 11, 17 every sub-track; steps 9, 12-16 unless
#                   the sub-track is existing_business_rbd / intra_venture
#                   (D9, v1.3.0) — see the comment above step 9.
# site_required is a human-confirmed fact recorded as a project.site_required
# dimension_input assertion confirmed by a single person with a written
# rationale (no evidence reference is required) through the human-only
# greenfield-scope route; each confirmation writes the audit entry
# dimension_input_single_person_confirmation. A null (plain) sub-track cannot
# be confirmed as site_required = false (rule being changed in the backend,
# 2026-10-12; the code in greenfield-subtrack.ts is authoritative).
# Null sub-track defaults to true; existing_business_rbd and intra_venture have
# NO default — a human must always confirm it (site steps apply until then).
#
# NOT RUNTIME-EVALUATED: the step applies_when predicates below are
# documentation only. app/web-next/lib/greenfield-subtrack.ts is authoritative
# for which steps apply; tests/unit/greenfield-subtrack.test.ts parses this file
# and fails on drift from the code's excluded_steps.
#
# Machine applies_when (ADR-0160 addendum, migration 0136): project.sub_track
# (column var off the current route_decision; a route with no sub-track reads
# 'none') and project.site_required (asserted, live AND reviewed only) are
# seeded routing vars, so the conditions above are applies_when predicates.
# Predicate semantics (db/lib/applies-when.ts, fail-closed):
#   - no current route (sub_track UNASSESSED) -> every step applies;
#   - 'none' or any unknown / brownfield value -> the null-sub-track result
#     (steps 1-5 apply, 6-8 do not); the selection code surfaces a warning
#     for an unknown value, never a block;
#   - existing_business_rbd / intra_venture without a reviewed site_required ->
#     UNASSESSED -> site steps APPLY until a human confirms (no default).
# Step 7's "optional for the null sub-track when technology-led" stays prose:
# it is a human choice, not a routing fact. Projects whose earliest
# project_policy_pin predates GF_SUBTRACK_PREDICATE_DATE keep v1.0.0
# selection unless a human opts them in through a recorded pin migration
# (migration_note in the audit trail).

steps:
  - id: 1
    gate: DD
    applies_when:
      op: none_of
      of:
        - op: all_of
          of:
            - { op: "in", var: "project.sub_track", values: ["existing_business_rbd", "intra_venture"] }
            - { op: "cmp", var: "project.site_required", cmp: "eq", value: false }
    agent_key: technical-dd-agent
    skill_key: site-visit-protocol
    output_type: dd_finding
    description: >
      Site visit(s) against `checklists/technical-dd-checklist.yaml` and
      `checklists/site-selection-checklist.yaml` — findings land as
      dd_finding records with value_impact, never narrative-only.
      Applies to the null sub-track always; to existing_business_rbd and
      intra_venture only when site_required = true.
  - id: 2
    gate: DD
    applies_when:
      op: none_of
      of:
        - { op: "in", var: "project.sub_track", values: ["existing_business_rbd", "intra_venture"] }
    agent_key: greenfield-agent
    skill_key: talent-pipeline-planning
    output_type: dd_finding
    description: >
      Talent pipeline and ramp-up curve validation against
      `checklists/site-selection-checklist.yaml` ss-07. Null sub-track only;
      existing_business_rbd and intra_venture use step 6 instead.
  - id: 3
    gate: DD
    applies_when:
      op: none_of
      of:
        - op: all_of
          of:
            - { op: "in", var: "project.sub_track", values: ["existing_business_rbd", "intra_venture"] }
            - { op: "cmp", var: "project.site_required", cmp: "eq", value: false }
    agent_key: greenfield-agent
    skill_key: community-partnership-planning
    output_type: dd_finding
    description: >
      Community acceptance and prior dispute history check
      (`checklists/site-selection-checklist.yaml` ss-08). Applies to the null
      sub-track always; to existing_business_rbd and intra_venture only when
      site_required = true.
  - id: 6
    gate: DD
    applies_when: { op: "in", var: "project.sub_track", values: ["existing_business_rbd", "intra_venture"] }
    agent_key: greenfield-agent
    skill_key: org-readiness-assessment
    output_type: dd_finding
    description: >
      Core-team and capability readiness (design step 2b) — R&BD team
      composition, key-person dependency and capability gaps, recorded as
      dd_finding with value_impact from the org-readiness-assessment
      artifact (no new checklist item; ADR-0160 Q4). Applies to
      existing_business_rbd and intra_venture.
  - id: 7
    gate: DD
    applies_when: { op: "in", var: "project.sub_track", values: ["existing_business_rbd", "intra_venture"] }
    agent_key: technical-dd-agent
    skill_key: technical-due-diligence
    output_type: dd_finding
    description: >
      Technology and market plan verification (design step 3b) against
      `checklists/rbd-technology-checklist.yaml` (TRL/MRL evidence rows
      rbd-08..rbd-14 at the FS/DD row, FTO rbd-03, originator relationship
      rbd-05, obsolescence rbd-07) and `checklists/market-dd-checklist.yaml`.
      Applies to existing_business_rbd and intra_venture; optional for the
      null sub-track when the plan is technology-led.
  - id: 8
    gate: DD
    applies_when: { op: "cmp", var: "project.sub_track", cmp: "eq", value: "intra_venture" }
    agent_key: greenfield-agent
    skill_key: org-readiness-assessment
    output_type: dd_finding
    description: >
      Entity readiness for the venture vehicle (design step 3c) —
      `checklists/entity-formation-checklist.yaml` ef-01, ef-03 and ef-07
      (pre-formation IP) read as plan-verification evidence only; formation
      execution stays in S11 (entity-establishment-execution). Applies to
      intra_venture only.
  # ── v1.2.0 (ADR-0187 phase P2; findings M2, M15; W2-b, W2-d; owner decision
  # D9) — one step per S9 activity that lists greenfield-dd, so every
  # flow.spec activity agent holds a step here.
  # v1.3.0 (ADR-0187 phase P3; owner decision 2026-10-28, ADR-0187 decision log):
  # the D9 trim keys on the greenfield SUB-TRACK, not on origin. ADR-0166 defaults
  # every greenfield project to origin=internal, so an origin predicate would also
  # trim a new-site plant, which must keep the full DD. The internal-expansion
  # sub-tracks (existing_business_rbd, intra_venture) are trimmed to capability
  # (steps 6/7/8), financial (step 11), legal-regulatory (step 10) and EHS
  # (step 1, technical-dd checklist); steps 9 and 12-16 (commercial, HR, market,
  # financing, IP, region labor) do not apply to them. A plain greenfield route (no
  # sub-track), an unknown value and an unassessed route APPLY every step
  # (fail-closed, db/lib/applies-when.ts).
  # Grandfathering (ADR-0151/ADR-0020 versioned pins): these sub-track predicates are
  # greenfield-dd 1.3.0. A project whose earliest pin or creation predates 2026-10-28
  # stays on the pre-1.3.0 rule (origin=internal trims steps 9, 12-16; D9_RULE_DATE in
  # greenfield-subtrack.ts), so nothing it completed is un-completed.
  # greenfield-subtrack.ts stays authoritative for the runtime workspace
  # (D9_TRIMMED_STEPS); tests/unit/greenfield-subtrack.test.ts keeps both equal.
  - id: 9
    gate: DD
    applies_when: { op: "none_of", of: [{ op: "in", var: "project.sub_track", values: ["existing_business_rbd", "intra_venture"] }] }
    agent_key: commercial-dd-agent
    skill_key: commercial-due-diligence
    output_type: dd_finding
    description: >
      Commercial DD of the establishment plan per
      `checklists/commercial-dd-checklist.yaml` — demand evidence, channel and
      pricing-power checks with triangulation; material findings land as
      dd_finding with value_impact. Trimmed for the internal-expansion sub-tracks (D9).
  - id: 10
    gate: DD
    agent_key: legal-counsel
    skill_key: legal-due-diligence
    output_type: dd_finding
    description: >
      Legal and regulatory DD per `checklists/legal-dd-checklist.yaml` —
      corporate and permit standing of the establishing entity, material
      contracts, regulatory exposure; statute checks against source text.
      Applies to every sub-track (D9 keeps legal-regulatory).
  - id: 11
    gate: DD
    agent_key: financial-analyst
    skill_key: historical-financial-analysis
    output_type: dd_finding
    description: >
      Financial DD per `checklists/financial-dd-checklist.yaml` as it applies
      to an establishment plan — cost basis, working-capital and capex
      assumptions, tax position and related-party transactions with the
      sponsoring affiliate, projections tested against history and peer
      benchmarks. Applies to every sub-track (D9 keeps financial).
  - id: 12
    gate: DD
    applies_when: { op: "none_of", of: [{ op: "in", var: "project.sub_track", values: ["existing_business_rbd", "intra_venture"] }] }
    agent_key: hr-integration-agent
    skill_key: org-readiness-assessment
    output_type: dd_finding
    description: >
      HR DD per `checklists/hr-dd-checklist.yaml` — key-person map, retention
      and transfer terms, labor relations of the establishing workforce.
      Trimmed for the internal-expansion sub-tracks (D9; core-team readiness stays in steps 6/8).
  - id: 13
    gate: DD
    applies_when: { op: "none_of", of: [{ op: "in", var: "project.sub_track", values: ["existing_business_rbd", "intra_venture"] }] }
    agent_key: market-intelligence-agent
    skill_key: competitive-intelligence
    output_type: dd_finding
    description: >
      Market DD per `checklists/market-dd-checklist.yaml` — re-verify the S2
      entry market and competitive structure the plan rests on. Trimmed for
      internal-expansion sub-tracks (D9).
  - id: 14
    gate: DD
    applies_when: { op: "none_of", of: [{ op: "in", var: "project.sub_track", values: ["existing_business_rbd", "intra_venture"] }] }
    agent_key: financing-agent
    skill_key: financing-plan-review
    output_type: financing_readiness_check
    description: >
      Financing DD per `checklists/financing-plan-checklist.yaml` — funding
      sources and their certainty, covenant headroom under the downside
      scenario (starting threshold: downside DSCR headroom of at least 1.2x,
      ADR-0187 D2). A covenant breach under the downside scenario is the
      kill criterion covenant_breach_under_downside_financing_plan below.
      Trimmed for the internal-expansion sub-tracks (D9).
  - id: 15
    gate: DD
    applies_when: { op: "none_of", of: [{ op: "in", var: "project.sub_track", values: ["existing_business_rbd", "intra_venture"] }] }
    agent_key: ip-agent
    skill_key: ip-fto-review
    output_type: dd_finding
    description: >
      IP and freedom-to-operate review (ADR-0187 W2-d) — patent landscape and
      FTO position of the technology the plan commercializes, licensing
      dependencies, pre-formation IP. Every track except the greenfield
      internal-expansion sub-tracks (D9); the R&BD technology rows (rbd-03) stay in step 7.
  - id: 16
    gate: DD
    applies_when: { op: "none_of", of: [{ op: "in", var: "project.sub_track", values: ["existing_business_rbd", "intra_venture"] }] }
    agent_key: region-lead
    skill_key: regulatory-screening
    output_type: dd_finding
    description: >
      Region labor-law review per the labor axis of `region-profiles/<ISO>.yaml`
      for the establishment jurisdiction (ADR-0187 W2-b; ADR-0185 §1.2(e):
      skipped only for the greenfield internal-expansion sub-tracks, D9 2026-10-28) — works council,
      collective agreements, transfer and consultation obligations.
  - id: 17
    gate: DD
    agent_key: compliance-officer
    skill_key: waiver-management
    output_type: dd_waiver_review
    description: >
      Waiver adjudication for unmet mandatory DD items (ADR-0036/0037): each
      waiver carries an expiry and a clause anchor; an unmet mandatory item
      with no active waiver keeps the DD gate blocked. Applies to every sub-track.
  - id: 4
    gate: DD
    agent_key: risk-officer
    skill_key: dd-to-valuation-bridge
    output_type: dd_valuation_bridge
    description: >
      Every dd_finding with value_impact must land in the valuation bridge —
      design's most-common-failure-mode rule (DD and the model must not run
      separately).
  - id: 5
    gate: DD
    agent_key: process-governance-manager
    skill_key: stage-gate-governance
    output_type: gate_pass_record
    description: Confirm DD deliverables complete; open Entity IC.

# Kill-criteria scope (ADR-0160): the valuation-bridge criterion applies to
# every greenfield sub-track. The wastewater criterion is scoped to plans
# with site_required = true; it is NOT deleted. Its registry predicate counts
# sites with an insufficient, unmitigated wastewater assessment, so a plan
# with no site in scope cannot trip it — the scope is a selection rule, not a
# second predicate (the kill-criterion record itself is unchanged by 0136). No
# FTO-blocked kill criterion is added here (ADR-0160 Q6: follow-up for
# legal-counsel).
kill_criteria:
  - condition: wastewater_capacity_insufficient_and_no_mitigation
    action: halt
  - condition: dd_finding_with_value_impact_not_in_valuation_bridge
    action: halt
  # v1.2.0 (ADR-0187 phase P2, finding M4; neb-policy section 4 criterion 4):
  # the Green Field twin of brownfield-dd covenant_breach_with_coc_acceleration_
  # under_downside, judged on the step 14 financing DD. Declared-but-inert
  # (predicate null): the brownfield predicate counts breaches in the ma-11
  # +200bp rate-shock run, an M&A-specific downside; the greenfield downside
  # (financing-plan-review, D2 headroom threshold) has no evidence variable
  # yet. Until a predicate is decided the DD gate reviewers judge it.
  - condition: covenant_breach_under_downside_financing_plan
    action: halt

legal_basis:
  - "Group New Business Review Policy §2.3"
  - "Design v1.0 §5.3, §12 (DD-to-valuation-bridge verification gate)"
  - "docs/governance/process-map.md — DD row"
  - "checklists/technical-dd-checklist.yaml, checklists/site-selection-checklist.yaml"
  - "checklists/rbd-technology-checklist.yaml, checklists/market-dd-checklist.yaml, checklists/entity-formation-checklist.yaml (ef-01, ef-03, ef-07)"
  - "ADR-0160 (Proposed) — sub-track-aware greenfield S9 steps; addendum 2026-10-12 (migration 0136 routing vars)"
  - "ADR-0187 (process SSOT and decision evidence) phase P3 — D9 trim re-keyed from origin to the internal-expansion sub-tracks (owner decision 2026-10-28; greenfield-dd 1.3.0)"
  - "ADR-0187 (process SSOT and decision evidence) phase P2 — S9 activity steps 9-17 (M2), ip-fto and region-labor on greenfield (W2-b, W2-d), sub-track trim (D9, M15), covenant-breach kill criterion (M4)"
  - "checklists/commercial-dd-checklist.yaml, checklists/legal-dd-checklist.yaml, checklists/financial-dd-checklist.yaml, checklists/hr-dd-checklist.yaml, checklists/financing-plan-checklist.yaml"

owner_agent: process-governance-manager
last_reviewed: "2026-10-28"
