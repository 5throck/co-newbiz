schema_version: "1.0"
procedure_id: shared-group-investment-review
title: "Group Investment Committee Review"
scope: shared
level: group
version: "1.4.0"
status: active
applicability: mandatory
workflow_type: core
gate: "Group IC"

# v1.4.0 (ADR-0196 Phase E, decision 9; design 2026-11-08-committee-minutes-as-meeting-design §7.2):
# one new step 4.4 "Group IC committee deliberation" before the decision deck
# (step 4.5). The step convenes group-ic-committee (procedures/_committees.yaml)
# and closes it with committee_session_ref + confirmed-or-draft minutes in the
# Group IC package. The session is decision support placed in front of the
# human verdict step — it decides nothing and replaces no step. Seats carried
# by the procedure as a contract: group-review-agent (portfolio fit,
# intra-group transactions, capital allocation), risk-officer, financing-agent,
# and ir-agent where disclosure applies. The final human step
# (group-ic-reviewer, ADR-0053 / ADR-0186 D6) is unchanged.

steps:
  - id: 1
    gate: "Group IC"
    agent_key: process-governance-manager
    skill_key: two-tier-approval-chain
    output_type: entity_ic_precondition_check
    description: >
      System-enforced check: reject entry if Entity IC approval is not recorded
      in approval_chain. No soft warning — hard rejection (design §6.4).
  - id: 2
    gate: "Group IC"
    agent_key: group-review-agent
    skill_key: portfolio-fit-assessment
    output_type: portfolio_overlap_finding
    description: Assess overlap/cannibalization against other group companies.
  - id: 3
    gate: "Group IC"
    agent_key: group-review-agent
    skill_key: intra-group-transaction-compliance
    output_type: related_party_transaction_finding
    description: Fair Trade Act Art. 47 screen, only if the deal involves affiliate transactions.
  - id: 4
    gate: "Group IC"
    agent_key: group-review-agent
    skill_key: portfolio-fit-assessment
    output_type: group_agenda_ranking
    description: >
      Rank this proposal against other concurrent group_agenda entries in the
      same review cycle using the formula from meeting M2 D-M2-2: IRR-over-hurdle
      spread + RAG grade + capital requested, normalized to the cycle's capital
      budget, ties broken by risk-officer flags.
  - id: 4.4
    gate: "Group IC"
    agent_key: process-governance-manager
    skill_key: meeting-facilitation
    output_type: group_ic_committee_deliberation
    description: >
      Convene and close the group-ic-committee session
      (procedures/_committees.yaml; ADR-0196 decision 9, ADR-0097 seat model,
      ADR-0053 recorder pattern — the chair facilitates agenda and minutes
      passes and votes nothing) over the ranked group agenda. Seats carried
      by this procedure as a contract: group-review-agent (portfolio fit,
      intra-group transaction compliance, capital allocation), risk-officer,
      financing-agent, and ir-agent where disclosure applies. Output is a
      committee session reference (committee_session_ref) plus
      confirmed-or-draft meeting-form minutes referenced from the Group IC
      package — decision support placed in front of the human verdict step;
      the session proposes, it never decides (design boundary 2). Recorded
      dissent is carried verbatim; minutes confirmation (ADR-0104) must be by
      a person, and that person may not also countersign the step 5 GO
      (maker-checker extended to the minutes confirmation).
  - id: 4.5
    gate: "Group IC"
    agent_key: docs-writer
    skill_key: executive-presentation
    output_type: group_ic_decision_deck
    description: >
      Build the Group IC decision deck from the portfolio-fit ranking and
      intra-group transaction compliance outputs (graph-pilot wiring,
      backfill-report §4.1).
  - id: 5
    gate: "Group IC"
    agent_key: group-ic-reviewer   # human role — procedures/_human-roles.yaml registry (ADR-0053, ADR-0186 D6); replaces the former recorder pattern (process-governance-manager)
    decision_authority: human
    skill_key: stage-gate-governance
    output_type: group_ic_decision
    description: >
      Record the Group IC decision as approved / rejected / conditional /
      withdrawn_pending_resubmission (meeting M2 D-M2-3 — conditional is
      first-class, not a note on approved; the fourth state was added per
      docs/pilots/pilot-003-doosan-bobcat-robotics.md finding F-2, matching
      entity-ic-review's decision model — a real case can withdraw and
      re-propose with revised terms rather than landing on any of the
      original three states). The decision is recorded together with the
      server-computed gate snapshot and acknowledgements, and takes effect only
      after a second eligible person's countersign (neb-policy 2.9, ADR-0186);
      agents prepare the package and never record or countersign.

kill_criteria: []  # Group IC does not introduce new Kill Criteria beyond those already
                    # triggered upstream; it is a ranking/portfolio gate, not a new red-team pass.

legal_basis:
  - "Group New Business Review Policy §3, §4"
  - "Design v1.0 §6.4"
  - "Meeting M2 (m2-entity-group-boundary.md)"
  - "ADR-0196 (v1.4.0 — Group IC committee deliberation step, Phase E decision 9)"

owner_agent: group-review-agent
last_reviewed: "2026-08-23"
