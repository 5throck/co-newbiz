schema_version: "1.0"
procedure_id: shared-entity-ic-review
title: "Entity Investment Committee Review"
scope: shared
level: entity
version: "1.5.0"
effective_from: "2026-08-20"
status: active
applicability: mandatory
workflow_type: core
gate: "Entity IC"

# v1.5.0 (ADR-0196 Phase E, decision 9; design 2026-11-08-committee-minutes-as-meeting-design §7.2):
# one new step 4.5.5 "IC committee deliberation" between the integrated insight
# review (step 4.5, IC-package assembly) and the decision deck (step 4.6). The
# step convenes entity-ic-committee (procedures/_committees.yaml) and closes it
# with committee_session_ref + confirmed-or-draft minutes in the IC package.
# The session is decision support placed in front of the human verdict step —
# it decides nothing and replaces no step. Seats are carried by the procedure
# as a contract (the schema supports a single agent_key per step, so the
# deliberation step is convened and closed by process-governance-manager in
# the recorder pattern — the chair facilitates and votes nothing): risk-officer
# (RAG proposal and kill criteria), valuation-agent, financing-agent (existing
# step 3.1 co-review), the track lead (brownfield-agent or greenfield-agent),
# legal-counsel, and the ADR-0097 standing functional seats as relevant. The
# final human step (entity-ic-reviewer, ADR-0053) is unchanged.
# v1.4.0 (ADR-0186, Accepted 2026-10-27): wording only — step 2 points to the
# server-computed gate snapshot (kill outcomes, RAG, validators, WACC state,
# waivers, conditions) that the recorder acknowledges at step 5; the step 5
# decision is a maker record that becomes effective only after a different
# eligible person (entity-ic-reviewer) countersigns. Step assignments and
# kill_criteria are unchanged.
# v1.3.0 (ADR-0161, Proposed; user decision Q6 2026-10-12): the flow.spec S11
# activity investment-structuring keeps one id and owner brownfield-agent
# (activity-level fields cannot vary by track). Its greenfield owner is
# encoded HERE, at the procedure layer: step 3 (IC memo) is scoped to
# case_type = brownfield and is otherwise unchanged; step 3.1 is the
# greenfield IC memo owned by greenfield-agent with financing-agent
# co-review. With case_type unassessed both predicates apply (fail-closed:
# nothing is silently skipped). No other step changes.

steps:
  - id: 1
    gate: "Entity IC"
    agent_key: risk-officer
    skill_key: rag-scoring-framework
    output_type: rag_assessment_proposed
    description: >
      AI-proposed RAG grade per docs/governance/rag-framework.md — six dimensions,
      priority-ordered (not averaged), data confidence capping the ceiling.
      This is a PROPOSAL, never a decision.
  - id: 2
    gate: "Entity IC"
    agent_key: process-governance-manager
    skill_key: rag-scoring-framework
    output_type: kill_criteria_check
    description: Explicit pass/fail against every Kill Criteria condition applicable at this gate — see policies/group/neb-policy.md §4. The result is the kill block of the gate snapshot (triggered, unassessed, inert) that the step 5 recorder acknowledges (neb-policy 2.9, ADR-0186).
  - id: 3
    gate: "Entity IC"
    applies_when: { op: "cmp", var: "project.case_type", cmp: "eq", value: "brownfield" }
    agent_key: brownfield-agent
    skill_key: dd-to-valuation-bridge
    output_type: ic_memo
    description: >
      IC memo assembled per templates/deliverables/ic-memo-template.md —
      RAG table, DD findings, M&A special-topics section (BF only), Kill
      Criteria check, three-stage reviewer sign-off table.
  - id: 3.1
    gate: "Entity IC"
    applies_when: { op: "cmp", var: "project.case_type", cmp: "eq", value: "greenfield" }
    agent_key: greenfield-agent
    skill_key: dd-to-valuation-bridge
    output_type: ic_memo
    description: >
      Greenfield IC memo per templates/deliverables/ic-memo-template.md,
      owned by greenfield-agent with financing-agent co-review of the
      funding structure (ADR-0161 Q6): RAG table, DD findings, the S10
      establishment structure and phased capex tranches (capex_tranche),
      Kill Criteria check, three-stage reviewer sign-off table. No M&A
      special-topics section.
  - id: 4
    gate: "Entity IC"
    agent_key: valuation-agent
    skill_key: financing-plan-review
    output_type: financing_readiness_check
    description: >
      Financing PRECONDITION before the decision step — the IC package must
      contain the chk-financing evidence: executed commitment papers (equity
      commitment letter; debt commitment letter + fee letter + term sheet)
      or a documented internal-funds approval path, sources-and-uses,
      covenant headroom/leverage analysis, funds-flow memorandum draft, FX
      plan where currencies differ. No committed financing evidence =
      precondition FAIL, not a judgment call — a financing contingency
      weakens the bid and belongs to no reviewer's discretion.
  - id: 4.5
    gate: "Entity IC"
    agent_key: process-governance-manager
    skill_key: insight-synthesis
    output_type: integrated_insight_review
    description: >
      Integrate market, financial, legal/regulatory and M&A special-topic
      outputs into a single strategic view with a mandatory cross-check,
      giving the human reviewer one coherent pre-IC package (graph-pilot
      wiring, backfill-report §4.1).
  - id: 4.6
    gate: "Entity IC"
    agent_key: docs-writer
    skill_key: executive-presentation
    output_type: entity_ic_decision_deck
    description: >
      Build the Entity IC decision deck (Pyramid-Principle structure,
      one-page summary) from the integrated insight and valuation inputs
      (graph-pilot wiring).
  - id: 4.5.5
    gate: "Entity IC"
    agent_key: process-governance-manager
    skill_key: meeting-facilitation
    output_type: ic_committee_deliberation
    description: >
      Convene and close the entity-ic-committee session
      (procedures/_committees.yaml; ADR-0196 decision 9, ADR-0097 seat model,
      ADR-0053 recorder pattern — the chair facilitates agenda and minutes
      passes and votes nothing) over the assembled IC package. Seats carried
      by this procedure as a contract: risk-officer (RAG proposal and Kill
      Criteria), valuation-agent, financing-agent (step 3.1 co-review), the
      track lead (brownfield-agent or greenfield-agent per case_type),
      legal-counsel, and the ADR-0097 standing functional seats as relevant.
      Output is a committee session reference (committee_session_ref) plus
      confirmed-or-draft meeting-form minutes referenced from the IC package
      — decision support placed in front of the human verdict step; the
      session proposes, it never decides (design boundary 2). Recorded
      dissent is carried verbatim; minutes confirmation (ADR-0104) must be by
      a person, and that person may not also countersign the step 5 GO
      (maker-checker extended to the minutes confirmation).
  - id: 5
    gate: "Entity IC"
    agent_key: entity-ic-reviewer   # human role — procedures/_human-roles.yaml registry (ADR-0053)
    decision_authority: human
    skill_key: stage-gate-governance
    output_type: entity_ic_decision
    description: >
      Human reviewer confirms or corrects the AI-proposed RAG grade (with a
      reason if corrected — docs/manuals/business-manual.md §3) and records
      a decision: approved | rejected | conditional | withdrawn_pending_resubmission.
      The fourth state is not in the original design and was added per
      docs/pilots/pilot-003-doosan-bobcat-robotics.md finding F-2 — a real
      case (Doosan Bobcat/Robotics) withdrew and re-proposed with revised
      terms, a pattern the original three-state model could not represent.
      The recorded decision is the maker record: it takes effect only after a
      different person holding entity-ic-reviewer countersigns (neb-policy
      2.9); HOLD and KILL are effective immediately. The recorder
      acknowledges each snapshot item that needs judgement, with a reason.
      analysis_task.reviewed_by must be non-NULL on every required
      deliverable before this step can complete (design §8.9-1).

kill_criteria:
  - condition: analysis_task_reviewed_by_null_on_required_deliverable
    action: halt
  - condition: kill_criteria_condition_triggered
    action: halt

legal_basis:
  - "Group New Business Review Policy §2.3, §4"
  - "Design v1.0 §8.9-1, §10.1-2 (three-stage review model)"
  - "docs/governance/process-map.md — Entity IC row"
  - "ADR-0161 (v1.3.0 — track-scoped IC memo owner, Q6; Proposed)"
  - "ADR-0196 (v1.5.0 — IC committee deliberation step, Phase E decision 9)"
  - "docs/manuals/business-manual.md §1, §3"
  - "docs/pilots/pilot-003-doosan-bobcat-robotics.md finding F-2 (withdrawn_pending_resubmission state)"
  - "checklists/financing-plan-checklist.yaml (chk-financing — precondition evidence list)"
  - "ADR-0051 (workflow gap closure — certainty of funds evidenced before final IC)"

owner_agent: process-governance-manager
last_reviewed: "2026-08-23"
