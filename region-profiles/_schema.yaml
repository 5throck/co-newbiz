schema_version: "1.4"
description: >
  Region profile contract (design v1.0 section 2-6 / 4-9-1 amendment). Each
  top-level section is a provenance-bearing unit: source, verified_on, and
  maintainer are mandatory on every section, not just on the file as a whole
  — _validate.ts rejects a section missing any of the three (CLAUDE.md
  Co Newbiz Lifecycle Rules, region-profiles/** row).

required_top_level:
  - code            # ISO 3166-1 alpha-2
  - name_ko
  - merger_control
  - foreign_investment_screening
  - labor
  - tax
  - fx_and_repatriation
  - anti_corruption
  - sanctions_screening
  - data_transfer
  - environmental_liability_succession
  - incentives
  - typical_closing_weeks

optional_top_level:
  # Validated exactly like a required section WHEN PRESENT (source, verified_on,
  # maintainer, non-empty data); a profile without it is valid. Optional because
  # an unsourced placeholder is worse than a missing section. Filled by the project
  # team while running cdd-08 on a deal (preferred, not required); maintainer is the
  # agent_key that filled it.
  - payment_practice   # benchmark for commercial DD cdd-08 collection-period axis
  - erp_references     # published equity-risk-premium references offered as WACC suggestions (ADR-0207)
  - corporate_tax_rates # statutory marginal corporate tax brackets offered as the WACC tax-rate suggestion (ADR-0207 addendum)
  - credit_rating_references # rating scale, rating-to-spread parameters and defaults for the WACC credit-spread suggestion (ADR-0208)

section_shape:
  # every section listed above except code/name_ko/typical_closing_weeks
  # must have this shape
  source: string            # citation — statute name, agency publication, or named advisory source
  verified_on: date         # ISO-8601 — when a human last confirmed this section against source
  maintainer: string        # agent_key responsible for keeping this section current
  data: object              # the actual field content, shape is section-specific (see examples below)

section_field_reference:
  merger_control: [regime, authority, waiting_period_days, gun_jumping_prohibited]
  foreign_investment_screening: [regime, authority, mandatory_filing_triggers]
  labor: [works_council_consultation, collective_notice_days, cba_succession_default]
  tax: [withholding, transfer_pricing_regime, exit_tax, treaty_network_note]
  fx_and_repatriation: [capital_controls, repatriation_approval_required]
  anti_corruption: [regimes]
  sanctions_screening: [regimes]
  data_transfer: [regime, cross_border_transfer_mechanism]
  environmental_liability_succession: [successor_liability_default, remediation_fund_available]
  incentives: [categories, clawback_norm]
  # payment_practice: collection-period norms for receivables owed by customers in
  # this region. Distinct from fx_and_repatriation (cash movement across borders).
  # erp_references: data = { default_source_id, entries[] } (ADR-0207). Each entry is one
  # published edition of a free, publicly accessible source (no paid data), carrying its own
  # provenance: id, source, url (https://), value_pct (percent points, 0 < v < 25),
  # basis (implied | historical | survey | recommended), as_of, verified_on, maintainer;
  # optional published_on, note, superseded_by. Entries are superseded, never deleted.
  erp_references: [default_source_id, entries]
  # corporate_tax_rates: data = { effective_from, default_schedule_id, local_rate_ratio, schedules[] }
  # (ADR-0207 addendum). Each schedule is one statutory rate table: id, statute_ref, local_statute_ref,
  # url (https://), brackets[] with lower_krw / upper_krw (null = open top bracket) / national_rate_pct /
  # local_rate_pct / combined_rate_pct (percent points). Brackets are contiguous from 0 (upper bound
  # inclusive: a taxable income equal to upper_krw belongs to that bracket) with non-decreasing rates;
  # local = national x local_rate_ratio and combined = national + local (rounding tolerance 0.0005).
  # Optional: description, local_adjustment_note. Schedules are replaced on amendment (effective_from).
  corporate_tax_rates: [effective_from, default_schedule_id, local_rate_ratio, schedules]
  # credit_rating_references: data = { rating_scale[], default{rating, reason}, disclosed{instrument, stale_months,
  # aggregate}, spread_map{upper_anchor, lower_anchor, between, above_upper, below_lower}, kd_crosscheck{warn_gap_pp} }
  # (ADR-0208). rating_scale lists ratings best to worst (notch = index + 1). The spread values themselves are never
  # stored: they are derived from ECOS 721Y001 at the anchors. Optional (validated when present, added by later
  # slices): agencies[] { id, aliases[], home_url (https://), kind (bond|bureau, default bond), attested (boolean) } and synthetic { default_table_id, tables[] } where each
  # table carries id, source, url (https://), basis, as_of, verified_on, maintainer and rows[] { lower_x, upper_x, rating }.
  credit_rating_references: [rating_scale, default, disclosed, spread_map, kd_crosscheck]
  payment_practice: [typical_payment_terms_days, statutory_late_payment_rule, collection_enforcement_note, credit_insurance_note]

validation_rules:
  - "Every required_top_level key must be present."
  - "Every section (except code/name_ko/typical_closing_weeks) must carry source, verified_on, maintainer, and data."
  - "A section with an empty data object is rejected — an unsourced placeholder is worse than a missing file, since it looks authoritative."
  - "verified_on must parse as ISO-8601 and must not be in the future."
  - "erp_references (optional, ADR-0207): the section follows the rules above; in addition data.entries is a non-empty list, entry ids are unique, each entry has source, url (https://), value_pct (number, 0 < v < 25 — a transcription guard, not a judgment), basis (enum), as_of, verified_on and maintainer, as_of/verified_on/published_on are valid ISO dates not in the future, superseded_by resolves to an entry id, and data.default_source_id matches exactly one non-superseded entry. The validator never fetches URLs."
  - "corporate_tax_rates (optional, ADR-0207 addendum): the section follows the rules above; in addition data.effective_from is a valid ISO date not in the future (the registry carries in-force figures only), data.local_rate_ratio is a number in (0, 1], data.schedules is a non-empty list with unique ids, each schedule has statute_ref, local_statute_ref and an https:// url, and brackets that start at lower_krw 0, are contiguous (each lower_krw equals the previous upper_krw), end with exactly one open bracket (upper_krw null), carry non-decreasing combined rates in (0, 50), and satisfy local = national x local_rate_ratio and combined = national + local. data.default_schedule_id matches exactly one schedule. The validator never fetches URLs and does not re-verify the statute - verified_on/maintainer are the human attestation."
  - "credit_rating_references (optional, ADR-0208): the section follows the rules above; in addition data.rating_scale is a non-empty list of unique ratings (best first); data.default.rating, data.spread_map.upper_anchor / lower_anchor and every table row rating resolve in the scale, upper_anchor is a better rating than lower_anchor, spread_map.between is geometric, above_upper clamp, below_lower clamp_flagged; data.default.reason is non-empty; data.disclosed has instrument, a positive stale_months and aggregate lowest; data.kd_crosscheck.warn_gap_pp is a positive number. Optional agencies: unique ids, non-empty aliases that no other agency also owns (compared after NFKC, whitespace removal and lower-casing), https:// home_url, kind bond or bureau (bureau = credit-information bureau whose issuer ratings feed the lower-confidence bureau rung), boolean attested. Optional synthetic: unique table ids, https:// url, valid as_of / verified_on not in the future, rows whose first lower_x is <= 0, are contiguous, end with exactly one open row (upper_x null) and whose ratings never worsen as coverage rises; default_table_id resolves; optional row published_label (the publisher's own label, never parsed); optional synthetic.financial_sector { detection: company_name, name_keywords[], name_suffixes[] } (at least one entry; a company whose name matches skips the synthetic rung). The validator never fetches URLs and cannot re-verify a transcribed table - verified_on/maintainer are the human attestation."
