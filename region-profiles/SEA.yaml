merger_control:
  source: "ASEAN member-state competition laws are not harmonized — this profile is a regional overview, not a substitute for country-level review"
  verified_on: "2026-08-19"
  maintainer: legal-counsel
  data:
    regime: "No unified ASEAN merger-control regime; each member state has its own (e.g. Vietnam's Competition Law, Indonesia's KPPU regime, Singapore's Competition Act)"
    authority: "Country-specific — e.g. Vietnam Competition Commission, Indonesia KPPU, Singapore CCCS"
    waiting_period_days: 90
    gun_jumping_prohibited: true

