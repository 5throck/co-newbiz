code: "63999"
name_ko: 정보보안 서비스업 (KSIC 63999 그 외 기타 정보 서비스업 — 보안관제·컨설팅·모의해킹·취약점 분석; 관제 클라우드는 63112 병행 가능)

value_chain_structure:
  source: >
    정보보호산업 진흥에 관한 법률(KISA 보안관제 전문기업 지정), 국내 정보보호
    산업 실태조사(과기정통부·KISA 연차 보고), SPRi 소프트웨어정책연구소
    분류 연구. Links in the research doc.
  verified_on: "2026-09-09"
  maintainer: industry-lead
  data:
    upstream_tiers:
      - "보안 솔루션: 방화벽·IPS(시큐아이·윈스), NAC·EDR(샌즈랩·이글루), 암호화·인증"
      - "위협 인텔리전스: 글로벌 위협 피드(MITRE ATT&CK 프레임워크), 취약점 DB(CVE)"
      - "모의해킹 인력: 국가 자격(CISA·CISSP·정보보안기사) + 화이트해커(버그바운티)"
    midstream_tiers:
      - "관제(MSS): SOC(보안 운영 센터) — 24/7 실시간 위협 탐지·대응(위협 개체 수천억 건 처리)"
      - "컨설팅: 취약점 분석·모의해킹·ISMS-P 인증 컨설팅·랜섬웨어 대응"
      - "공격 표면 관리(ASM), 클라우드 보안(CSPM·CWPP), 제로 네트워크 접근(ZTNA)"
    downstream_tiers:
      - "주요 정보통신기반시설(금융·발전·통신 — 법정 관제 의무), 공공기관(클라우드 보안 인증 필수), 일반 기업(랜섬웨어 방어)"
      - "수요 촉발: 해킹 사건(랜섬웨어·공급망 공격), 규제(ISMS-P 인증 획득 의무, NIS2 유럽 확대)"
    typical_proxy_chain_depth: 1
    unit_of_output: "관제 계약 건수 / 월, 모의해킹 건수, 보안 매출액"

cycle_position_indicators:
  source: >
    KISA 정보보호 산업 실태조사(연차 — 매출 성장 지속), 국내 정보보호
    기업 공시(안랩·이글루코퍼레이션·샌즈랩 매출 성장), 랜섬웨어 피해
    통계. Links in the research doc.
  verified_on: "2026-09-09"
  maintainer: market-intelligence-agent
  data:
    cycle_driver: >
      사이버 공격 빈도·정교도(구조적 성장)와 규제 강화(법정 관제 의무
      확대)가 동시 작용 — 경기 역행적 성격(공격이 줄지 않으면 매출 유지).
      AI 보안(생성 AI 기반 공격·방어)이 새로운 성장 동력.
    typical_cycle_length_years: 0
    current_phase_note: >
      성장 국면 지속 — 랜섬웨어·공급망 공격 증가 + 제로트러스트 전환
      (재택·클라우드) + AI 생성 공격(딥페이크·피싱) 대응 수요. 관제
      인력 부족이 성장의 병목(전문 인력 공급 한계).
    peak_earnings_caveat: >
      보안은 '사고가 나지 않으면' 가치가 보이지 않는 특성 — ROI 증명이
      어려워 예산 삭감 대상이 되기 쉽다. 그러나 사고 발생 시 복구 비용이
      예방 비용의 수십 배(IBM 랜섬웨어 평균 비용)이므로 법정 의무·보험
      요건이 수요를 바닥부터 지지한다.

regulatory_landscape:
  source: >
    정보통신기반 보호법(주요정보통신기반시설 관리), 정보통신망법(개인정보
    보호·침해사고 신고), 개인정보보호법(2023 개정 — 침해사고 72시간 신고
    의무), ISMS-P 인증(공공기관 의무), EU NIS2·DORA(국내 기업 해외 자회사
    대상). Links in the research doc.
  verified_on: "2026-09-09"
  maintainer: legal-counsel
  data:
    primary_regimes:
      - "정보통신기반 보호법 — 주요 정보통신기반시설(금융·발전·통신 등)의 취약점 점검·관제 의무(KISA 지정 관제기업)"
      - "정보통신망법 + 개인정보보호법 — 침해사고 72시간 이내 신고 의무(2023 개정), 개인정보 유출 시 과징금 강화"
      - "ISMS-P 인증 — 공공기관·금융 의무 획득, 민간 선택(수주 자격)"
      - "EU NIS2·DORA — 유럽 진출 기업 대상 사이버 보안 관리 체계 의무화"
    licensing_or_certification_bodies:
      - "KISA(보안관제 전문기업 지정, 모의훈련), 한국인터넷진흥원 — ISMS-P 인증 심사"
      - "국제: CISSP·CISA·CEH 자격, ISO 27001 인증"
    cross_border_notes: >
      글로벌 규제(NIS2·DORA·SEC 사이버 규칙)의 공통 추세 — 사고 신고
      단축(72→24시간 추세), 경영진 책임 명시. 국내 기업의 해외 자회사는
      복수 규제 체계 동시 준수 필요.

technology_transitions:
  source: >
    생성 AI 기반 공격(피싱·딥페이크) 증가 보도, 제로트러스트 아키텍처
    (NIST SP 800-207) 전환 가이드, 클라우드 보안(CSPM) 시장 성장. Links
    in the research doc.
  verified_on: "2026-09-09"
  maintainer: industry-lead
  data:
    known_transitions:
      - "경계 방어(방화벽) → 제로트러스트(신뢰 없는 접근 — ZTNA·SDP)"
      - "관제: 시그니처 기반 → AI·행위 기반 탐지(EDR·XDR·MDR)"
      - "공격: 수동 피싱 → AI 생성 피싱·딥페이크(음성·영상 위조) — 방어도 AI 기반 필수"
    transition_driver: >
      공격자의 AI 활용이 방어 기준을 끌어올림 — 클라우드·재택 확산으로
      기존 경계가 소멸, 모든 접근을 검증하는 제로트러스트가 표준.
    expected_timeline: "2026~2028 제로트러스트 전환 본격화(정부 선행), 2027+ AI 보안(SOC 자동화·AI 대응) 상용화"
    demand_structure_impact: >
      보안 솔루션 구매 → 보안 서비스 구독(MDR·MDR — 관리형 보안 서비스)
      전환. 인력 부족으로 기업이 자체 SOC 운영 대신 아웃소싱 — 관제
      사업자의 인력 생산성(AI SOC)이 수익성 결정.
