code: "35119"
name_ko: 수소 연료전지 발전업 (KSIC 35119 기타 발전업 — 연료전지 발전 포함; PAFC/SOFC/PEM 스택 기반 분산 전원, 수소경제 인프라 연계)

value_chain_structure:
  source: >
    수소경제 육성 및 수소 안전관리에 관한 법률(수소법, 2020-02 시행)과 수소경제
    활성화 로드맵(2019, 국무조정실), 청정수소 인증 제도(2024 시행, 산업통상자원부),
    도산일렉트릭 연료전지 사업 공시(두산퓨얼셀 PAFC 440kW, SOFC 공장). Links in
    the research doc.
  verified_on: "2026-09-09"
  maintainer: industry-lead
  data:
    upstream_tiers:
      - "수소 생산: 부생수소(석유화학 공정 부산물 — 현재 공급 주력), 그린수소(수전해 — 비용 과제), 블루수소(AMR/CCUS 결합)"
      - "수소 저장·운반: 고압 트레일러(공급 주력), 액화수소·암모니아 운반(장기), 파이프라인(장기 계획)"
      - "스택 소재: 막전극접합체(MEA), 촉매(백금 — 수입 의존), 세라믹(SOFC)"
    midstream_tiers:
      - "연료전지 시스템 제조: 도산일렉트릭(PAFC 440kW 모듈 국내 독점, SOFC 공장 전환 투자), Bloom Energy(미국), Plug Power(PEM)"
      - "EPC·운영: 발전소 설계·시공(중대형 MW급 스택 배열) + 수소 공급 계약(오프테이커 구조)"
    downstream_tiers:
      - "분산 전원: 물류창고·쇼핑몰 옥상(자가발전+냉난방 열회수), 빌딩, 데이터센터 비상·기본 전원"
      - "발전 사업: RPS REC 가중치 적용(연료전지), 계통 연계 판매"
      - "수소 충전소·이동수단과의 수소 공급망 공유(물류창고 수소 스택이 충전소 겸업 사례)"
    typical_proxy_chain_depth: 2
    unit_of_output: "kW/MW 설비용량, MWh 발전량, 가동률(용량 계수)"

cycle_position_indicators:
  source: >
    RPS REC 가중치 연차 감소 규정(연료전지 가중치 축소 경과), 부생수소 공급
    한계와 가격 상승 보도, 청정수소 인증 제도(2024-05 시행 — 발전 연료 그린/블루
    구분), 도산일렉트릭 공시(연료전지 매출 변동). Links in the research doc.
  verified_on: "2026-09-09"
  maintainer: market-intelligence-agent
  data:
    cycle_driver: >
      수소 가격(부생수소 공급량과 그린수소 비용 격차) + REC 가중치 제도 + 
      데이터센터 무탄소 전원 수요 — 세 요소의 교차가 사업성 결정. REC
      가중치가 연차별 축소되어 신규 사업성은 그린수소 전환 속도에 종속.
    typical_cycle_length_years: 5
    current_phase_note: >
      성장 초기·재편 국면 — PAFC(부생수소 기반)는 REC 가중치 축소로 신규
      사업성이 하락한 반면, 데이터센터 기본 전원(무탄소 베이스로드)과
      그린수소 연계 SOFC가 새로운 수요 축. 청정수소 인증(2024) 이후 발전
      연료의 '청정 등급'이 REC·지원 자격을 결정.
    peak_earnings_caveat: >
      연료전지 발전 마진은 수소 가격 대비 전력 판매가 스프레드로 결정 —
      부생수소 가격 상승(공급 한계)이 직접 압박. 스택 수명(패키지 교체
      주기 40,000시간 내외)과 교체 비용이 LCOE를 좌우하므로, 가동률만으로
      사업성을 정상화하면 안 된다.

regulatory_landscape:
  source: >
    수소경제 육성 및 수소 안전관리에 관한 법률(수소법 2020 — 수소 충전소·
    제조소 허가 체계), 청정수소 인증 제도(2024-05 시행 — 발전용 청정수소
    인증·공급의무화), 신재생에너지법(연료전지 신재생에너지 포함), 고압가스
    안전관리법(수소 저장). Links in the research doc.
  verified_on: "2026-09-09"
  maintainer: legal-counsel
  data:
    primary_regimes:
      - "수소경제 육성 및 수소 안전관리에 관한 법률(수소법) — 수소 제조·저장·충전 시설 허가, 수소 전문 기업 육성"
      - "청정수소 인증 제도(2024-05 시행) — 발전용 수소의 청정 등급(그린/블루) 인증 + 공급의무화(CPS) 도입"
      - "신재생에너지법 — 연료전지는 신재생에너지(열병합 포함), RPS 인정(REC 가중치 연차 감소)"
      - "고압가스 안전관리법 — 수소 저장·공급 시설 안전 기준(한국가스안전공사 검사)"
    licensing_or_certification_bodies:
      - "산업통상자원부(발전사업 허가·청정수소 인증), 한국에너지공단(신재생 인증·REC)"
      - "한국가스안전공사(KGS 코드 — 수소 시설 검사), 소방청(위험물·소방 시설)"
    cross_border_notes: >
      그린수소 수입(해외 생산→국내 수송)은 수소법과 국제 수소 인증 상호 인정
      (CertifHy 등)이 아직 정비 중 — 수입 수소의 청정 인증 등급이 사업성을
      좌우. 수출 시 수소 설비는 압력용기 국제 규격(ASME) 적용.

technology_transitions:
  source: >
    SOFC(고체산화물) 고효율 전환 투자(도산일렉트릭 — 20MW급 SOFC 공장),
    MW급 대용량 연료전지 발전소(물류창고 옥상 다중 스택), 수전해(그린수소)
    확대 보도. Links in the research doc.
  verified_on: "2026-09-09"
  maintainer: industry-lead
  data:
    known_transitions:
      - "연료전지 타입: PAFC(인산형 200°C — 상용 주력) → SOFC(고체산화물 600~1000°C — 고효율·연료 유연성)·PEM(빠른 응답 — 이동수단 중심)"
      - "연료: 부생수소 → 그린수소(수전해) — 청정수소 인증 등급이 REC·지원 자격 결정"
      - "응용: 분산 발전(물류창고·빌딩) → 데이터센터 기본 전원(무탄소 베이스로드)·MW급 발전소"
    transition_driver: >
      데이터센터 무탄소 24/7 전원 수요(재생에너지 간헐성 보완)와 수소
      국가 인프라 구축이 동시 진행 — 연료전지는 '수소 소비처'이자
      '무탄소 전원'의 교차점.
    expected_timeline: "2026~2028 SOFC 대용량 확산, 2028~2030 그린수소 발전 실증·상용, 2030+ 수소 파이프라인 기반 대형 연료전지 발전소"
    demand_structure_impact: >
      발전사 중심 RPS 사업에서 데이터센터·물류 기업의 자가 전원(PPA)로
      수요 주체가 이동 — 열 병합(난방) 효율이 높은 도심 분산 배치가 새로운
      표준 사업 구조. 그린수소 공급이 시작되면 '청정 등급 프리미엄'이
      수익 격차를 만든다.
