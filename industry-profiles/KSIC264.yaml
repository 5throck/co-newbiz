code: "264"
name_ko: 반도체소자 제조업 (KSIC 264 — 메모리·파운드리·팹리스 설계·패키징 포함)

value_chain_structure:
  source: >
    WSTS (World Semiconductor Trade Statistics) product taxonomy; SEMI end-use
    and equipment reports; company disclosures (TSMC technology page, Samsung/
    SK hynix HBM4 production announcements) — see
    docs/research/semiconductor-industry-profile-2026-09.md for the full citation list.
  verified_on: "2026-09-09"
  maintainer: industry-lead
  data:
    upstream_tiers:
      - "웨이퍼·소부장(소재·부품·장비): 실리콘 웨이퍼, 포토레지스트, EUV/DUV 노광장비(ASML), 증착·에칭 장비(AMAT, TEL, Lam)"
      - "설계 IP·EDA: Synopsys, Cadence — 선진공정 설계 진입의 필수 통로"
      - "HBM/선진패키지 소재: 범프·TSV 공정 소재, 실리콘 인터포저"
    midstream_tiers:
      - "웨이퍼 제조(팹): 메모리(삼성전자, SK하이닉스, 마이크론), 파운드리(TSMC, 삼성), IDM(Intel 등)"
      - "OSAT(패키징·테스트): ASE, Amkor, 국내 서부생테크·하나머티리얼즈 등 — 선진 패키징(CoWoS 계열)은 팹사 수주 병목"
    downstream_tiers:
      - "시스템 반도체 소비처: AI 데이터센터(가속기·HBM 수요 앵커), 모바일·PC, 자동차, 산업·IoT"
      - "최종 수요는 AI 인프라 투자 사이클에 강하게 편중됨(2024~2026 성장의 주요 동력)"
    typical_proxy_chain_depth: 2
    unit_of_output: "wafer starts / 대당 출하량, 그리고 WSTS USD 매출"

cycle_position_indicators:
  source: >
    WSTS news releases (2025-2026 forecast revisions — the Autumn forecast
    projected ~USD 975B for 2026 with later releases revising upward; the
    exact landing figure is in flux, see the research doc); SIA monthly global
    billings releases. Verified against wsts.org and semiconductors.org.
  verified_on: "2026-09-09"
  maintainer: market-intelligence-agent
  data:
    cycle_driver: >
      AI 데이터센터 인프라 투자(가속기·HBM)가 2024~2026 성장의 지배적 동력.
      전통 스마트폰·PC 수요는 성숙 국면. 메모리는 공급집중도(HBM 전환)가
      가격 결정력을 좌우한다.
    typical_cycle_length_years: 4
    current_phase_note: >
      2024~2026년은 강한 상승 국면(WSTS 2026년 전망치가 연내 두 차례 상향
      수정) — 그러나 이는 AI 수요 편중이며, 전통 수요 카테고리는 정체.
      신규 진입 검토 시 상승 국면 피크의 실적을 정상화(normalize)하지
      말 것 — peak_earnings_caveat 참조.
    peak_earnings_caveat: >
      상승 국면 말기의 마진·점유율을 정상 상태로 오독하는 것이 반도체 신규
      진입 실패의 전형적 원인. capacity utilization·book-to-bill 같은 선행
      지표와 신규 팹 가동(공급 증가) 시점을 함께 확인할 것.

regulatory_landscape:
  source: >
    US BIS advanced-computing/SME export control rules (Oct 2022, Oct 2023,
    Dec 2024 packages); Federal Register "Framework for Artificial
    Intelligence Diffusion" interim final rule (2025-01-15) and BIS's
    2025-05-13 rescission announcement; CRS report R48642. See the research
    doc for links.
  verified_on: "2026-09-09"
  maintainer: legal-counsel
  data:
    primary_regimes:
      - "미국 BIS 수출통제: 고성능 컴퓨팅 반도체·반도체 제조장비 대중국 수출 단계적 통제(2022-10 → 2023-10 → 2024-12 패키지) — 이유론(entity list) 확대"
      - "AI Diffusion 규칙(2025-01-15 IFR)은 2025-05-13 철회 — VEU 확대(범용/국가 VEU 분리)는 미시행으로 종료, 기존 전통 VEU 프로그램만 유지"
      - "한국 산업기술보호법(국가핵심기술) — 반도체 관련 국가핵심기술 취급기업의 M&A는 사전승인 대상"
      - "한국 조세특례제한법 — 반도체 시설투자 세액공제(국가첨단전략기술)"
    licensing_or_certification_bodies:
      - "미 상무부 BIS(수출허가·VEU 지정)"
      - "산업통상자원부(국가첨단전략기술 지정·세액공제), 한국무역보험공사"
      - "KSMCA/반도체 산업협회(자율 규범) — 인허가보다는 수출통제 컴플라이언스가 중심"
    cross_border_notes: >
      미국 원산지 장비·소프트웨어를 사용한 중국 내 생산·서비스는 미 수출통제
      적용을 받는다(FDPR 확장). 한국 기업이라도 중국 법인 신설·인수 시
      미국 계열 기술 흐름을 먼저 검토해야 하며, AI Diffusion 철회 이후
      규제 공백기의 후속 규칙이 2026년에도 유동적이다 — 거래 시점 기준
      BIS 최신 guidance 확인 필수.

technology_transitions:
  source: >
    TSMC official 2nm technology page (N2 GAA volume production from Q4 2025,
    capacity expansion reported toward ~100k wafers/month in 2026); Samsung
    2nm GAA and industry-first HBM4 mass-production announcements; Rapidus
    2nm trial production (2025-07) targeting 2027 volume production.
    See the research doc for links.
  verified_on: "2026-09-09"
  maintainer: industry-lead
  data:
    known_transitions:
      - "트랜지스터 구조: FinFET → GAA 나노시트(TSMC N2, Samsung SF2 — 2025~2026 양산 개시)"
      - "메모리: HBM3E → HBM4(2026년경 양산 경쟁) — AI 가속기 대역폭 요구가 견인"
      - "선진 패키징: CoWoS/SoIC 계열 2.5D·3D 적층과 칩렛(chiplet) 설계 전환 — 패키징이 성능 병목 해소의 주역으로 승격"
      - "2nm 경쟁 구도: TSMC(양산 선행)·삼성(GAA 선행 발표)·Rapidus(2027 양산 목표)"
    transition_driver: >
      AI 워크로드의 전력·대역폭 한계 — 공정 미세화(GAA)와 패키징 혁신(HBM,
      칩렛)이 동시에 요구되며, 이 둘을 모두 갖춘 생태계(장비·소재·OSAT)만이
      수요를 흡수한다.
    expected_timeline: "2026~2028년 GAA/HBM4/칩렛 양산 본격화, 2028년경 A16(백면전송) 등 후속 노드 전환 개시"
    demand_structure_impact: >
      선진 노드·HBM 수요에 특화된 장비·소재·패키징 파트너에 대한 수요가
      구조적으로 증가하는 반면, 성숙 노드는 중국 증설로 공급과잉 압력 —
      신규 진입은 어느 노드·세그먼트에 서는지가 수요 구조를 결정한다.
