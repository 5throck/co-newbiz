  </defs>
  <rect width="1920" height="1080" fill="url(#sky)"/>
  <rect width="1920" height="1080" fill="url(#glow)"/>
  <!-- distant value-chain skyline: linked nodes rising left to right -->
  <g stroke="#3d66f5" stroke-opacity="0.5" stroke-width="2" fill="none">
    <path d="M 120 780 L 420 700 L 720 720 L 1020 560 L 1320 590 L 1620 400 L 1830 430"/>
  </g>
