  <rect y="900" width="1920" height="180" fill="url(#sea)"/>
  <!-- grid dots -->
  <g fill="#ffffff" fill-opacity="0.05">
    <circle cx="60" cy="120" r="2"/><circle cx="180" cy="220" r="2"/><circle cx="320" cy="90" r="2"/>
    <circle cx="520" cy="180" r="2"/><circle cx="700" cy="120" r="2"/><circle cx="940" cy="220" r="2"/>
    <circle cx="1180" cy="90" r="2"/><circle cx="1420" cy="180" r="2"/><circle cx="1660" cy="120" r="2"/>
    <circle cx="1860" cy="220" r="2"/>
