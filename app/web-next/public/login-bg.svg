    <circle cx="720" cy="720" r="7" fill-opacity="0.7"/>
    <circle cx="1020" cy="560" r="11" fill-opacity="0.9"/>
    <circle cx="1320" cy="590" r="8" fill-opacity="0.75"/>
    <circle cx="1620" cy="400" r="12" fill-opacity="0.95"/>
    <circle cx="1830" cy="430" r="7" fill-opacity="0.7"/>
  </g>
  <!-- port cranes silhouette -->
  <g fill="#060a16" fill-opacity="0.85">
    <rect x="0" y="880" width="1920" height="200"/>
    <rect x="240" y="700" width="14" height="190"/>
    <path d="M 240 700 L 400 660 L 400 690 L 254 726 Z"/>
    <rect x="1500" y="660" width="14" height="230"/>
