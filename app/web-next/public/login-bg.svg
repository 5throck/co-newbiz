<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1530"/>
      <stop offset="0.55" stop-color="#10254d"/>
      <stop offset="1" stop-color="#1b3a6b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.72" cy="0.28" r="0.5">
      <stop offset="0" stop-color="#7c9dff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7c9dff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1b3a"/>
      <stop offset="1" stop-color="#070d1c"/>
