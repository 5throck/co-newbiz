# Process Flow Specification — SSOT (ADR-0074; meta.version below is authoritative)
#
# This file is the single source of truth for the deal process:
#   - docs/process-flow.md is GENERATED from this file (scripts/co-newbiz/generate-process-flow.ts)
#   - the web UI (sidebar stage groups, stepper, stage cards, artifact checklists)
#     and the agent orchestrator render/execute from this spec at runtime
#   - tests/unit/process-flow.test.ts enforces schema + reference integrity
#
# Invariants (ADR-0074):
#   Stage ≠ Gate · Opportunity ≠ Project · Artifact ≠ Decision · Agent does not
#   own the Process · Definition/Execution are separated (process_run.spec_version)
#
# stateTransitions: onComplete → next stage id (or "terminal"); onHold stays on
# the same stage pending artifact supplementation; onKill ends the process.
#
# v2.0.0 — Route Decision (S4) 이후 Greenfield/Brownfield 트랙 분리:
#   Greenfield: S5 역량 평가·진출전략 → S8 사업성 분석 → ...
#   Brownfield: S6 대상 후보 발굴(Long List) → S7 대상 선정(Short List) → S8 사업성 분석 → ...
#   트랙에 해당 없는 Stage는 applicableTracks로 스킵한다 (단일 선형 체인 유지).

meta:
  id: co-newbiz-main-flow
  name: 신규사업 검토 메인 플로우
  version: "2.10.1"
  # v2.10.1 — T-20261022-035(review H2, 2026-10-22)의 SSOT 반영: T-001 결정
  #   (design 2026-10-22-review-ticket-remediation §1 row 1, 커밋 ebbac854)에서
  #   엔진이 이미 그린필드에만 스코어카드를 요구하도록 고쳐졌으므로, S12 벤처
  #   스코어카드 산출물과 "리뷰 주기별로 스코어카드 검토" 완료 기준에도 동일
  #   한정자를 명시한다 — brownfield은 integration/partnership 모니터링
  #   (ADR-0161)으로 대체되며 권장·비차단이다. 문언 정정만 — stage/gate/track
  #   구조 변경 없음. 차단기 문자열("벤처 스코어카드가 필요합니다")은 불변.
  # v2.10.0 — S9에 capability-dd 활동을 추가한다 (design
  #   2026-10-19-brownfield-capability-dd, 2026-10-20 반영). brownfield가
  #   S3 필요 역량 등록부를 선택 대상에 대해 검증하는 활동으로, 사람이
  #   역량별 해소/부분 해소/미해소 판정을 근거와 함께 기록한다 (경계 #2 —
  #   human-only MCP 배제). agent brownfield-agent, skill
  #   brownfield-feasibility(활동 에이전트의 고유 스킬), procedure는
  #   brownfield-dd 단일 — greenfield는 S5 capability-assessment에서 답한다.
  #   S9 inputs에 S3 필요 역량 등록부를, outputs에 필요 역량 검증 판정
  #   (S8 기술 렌즈 T1의 근거)과 기술 렌즈 T2~T5 롤업 근거를 추가한다.
  #   활동 1건·입력 1건·출력 2건 추가 — stage/gate/track 구조 변경 없음.
  # v2.9.1 — 진입시장 = S3~S12의 기준 시장 원칙 선언 (ADR-0181, 2026-10-17
  #   사용자 지시 "S2에서 진입 시장(target segment) 구하는 작업을 한 뒤 S3
  #   이후부터 모든 분석과 평가는 해당 진입 시장을 기준으로 진행"). S2
  #   entry-market-sizing 액티비티가 통합 플로우(사람이 S1 매트릭스에서 지역·
  #   세그먼트를 선택하고 진입 시장 정보를 입력하면 AI가 비율·성장률을 초안,
  #   사람이 확정 — 경계 #2)와 다통화 기준 환율(entry_market_fx)을 다룬다는
  #   것을 명시; S4·S8 inputs에 진입시장 성장률을 선언한다(선언적 — 엔진
  #   무효). S1 구조는 동결(읽기 전용, 역반영 없음).
  # v2.9.0 — S2 진입시장 산정이 기회·위험 요인·비즈니스 모델 검토와 동일한 수준의
  #   정규 액티비티로 승격된다 (ADR-0180, 2026-10-17 사용자 지시 "S2 기회발굴에서
  #   기회/위험 요인, 비즈니스 모델 검토와 동일한 수준으로 진입시장 산정을 다룰 것").
  #   S2 gains the entry-market-sizing activity + the 진입시장 산정 output/
  #   required artifact + a stage-scoped completion criterion; S3 inputs declare
  #   the derived market (the S2-decided entry market is the subject market the
  #   downstream stages operate on). Additive only — no stage/gate/track
  #   structure change. The derivation stays decision support: an unset chain
  #   displays honestly (미연결/unknown) and never blocks a gate (ADR-0179,
  #   불변 경계 #2/#4).
  # (v2.8.0 문구 정정, 2026-10-13: S10 투자 수단 음차어 표기를 "투자 주체"로 교체 — 텍스트만 변경, 버전 유지)
  # v2.8.0 — S11/S12 실행·사후관리를 트랙·세부 트랙별로 범위화한다 (ADR-0161,
  #   Proposed; Q1~Q7은 2026-10-12 채팅에서 사용자가 결정). S11에
  #   greenfield-execution-baseline(greenfield-agent; capex_tranche 행과 S10
  #   조건을 읽기만 하는 6단계 기준선, 마지막 단계는 사람 확인) 활동을, S12에
  #   integration-monitoring(pmi-agent; pmi-integration-execution step 6 사후
  #   통합 모니터링, m_and_a·strategic_investment)과 partnership-monitoring
  #   (partnership-agent; jv-lifecycle-governance step 2 파트너십 변형) 활동을
  #   추가한다. investment-structuring은 하나의 id·owner brownfield-agent를
  #   유지하고, greenfield 소유(greenfield-agent, financing-agent 공동검토)는
  #   entity-ic-review step 3.1로 procedure 계층에서 표현한다 (Q6).
  #   활동 수준 applicableTracks는 지원하지 않는다 — 범위는 각 procedure의
  #   applies_when과 UI/API 가드(설계 row 2)가 강제한다. 소급 적용(Q2): 재핀
  #   없이 predicate로 적용하고 진행 중 프로젝트마다 사람이 policy_migration
  #   감사 항목 1건을 기록한다. 이미 완료한 stage의 새 단계는 권고(비차단)다.
  #   설계 §5.4 정합 후속(2026-10-12 사용자 승인, 버전은 v2.8.0 유지): S11
  #   objective를 트랙 중립 문언(인수 종결·법인 설립·greenfield 실행 기준선
  #   확정)으로 바꾸고 S12 requiredArtifacts에 "실행 기준선 대비 차이(greenfield)"를
  #   더한다. app/web-next/lib/process-flow.ts STAGES 문자열도 같은 변경으로
  #   맞췄다(정합 테스트).
  #   stage/gate 구조 변경 없음.
  # v2.7.0 — S9 활동에 financial-dd(financial-analyst)·hr-dd(hr-integration-agent)·
  #   market-dd(market-intelligence-agent)·financing-dd(financing-agent)를 추가해
  #   ADR-0148 7개 DD 도메인 전부가 spec 활동으로 디스패치된다 (ADR-0160 addendum
  #   2026-10-12 c, Proposed; flow.spec 변경은 2026-10-12 채팅에서 승인).
  #   commercial/technical/legal-dd와 같은 모양: 스테이지 수준 활동, procedure는
  #   [greenfield-dd, brownfield-dd], 트랙은 S9 applicableTracks(양 트랙)를 따른다.
  #   활동 수준 applicableTracks는 도입하지 않는다 (이전에 계획된 2.7.0은
  #   수행되지 않았고 이것이 유일한 2.7.0 변경이다). stage/gate 구조 변경 없음.
  # v2.6.0 — Brownfield S9 선택적 대상별 DD (ADR-0157, design
  #   2026-10-09-optional-per-target-dd). 선정 대상 DD가 게이트의 판정 대상인
  #   것은 그대로이며, 사람이 명시적으로 열면 다른 Short List 대상에도 비교
  #   근거용 DD를 수행할 수 있다. 문언만 변경: S9 objective에 선택적 비교 DD를
  #   덧붙이고 outputs에 "대상별 DD 비교(선택)"을 추가한다. completionCriteria는
  #   "적용 체크리스트…" 그대로 선정 대상에 묶인다. procedures/**·policies/**
  #   변경 없음 — brownfield-dd 프로시저는 열린 대상마다 디스패치 계층에서
  #   반복된다 (ADR-0143 §6 패턴).
  # v2.5.0 — Brownfield S8 다중 대상 사업성 분석 (ADR-0143, design
  #   2026-09-22-s8-multi-target-feasibility). Short List에 오른 각 대상이
  #   S8의 분석 주체(subject)가 된다: stage schema에 subjectScope 키를 새로
  #   도입해 반복을 기계판독 가능하게 선언하고(S8: greenfield=single,
  #   brownfield=shortlist), S8 activities에 target-comparison(대상 간 비교·
  #   권고)과 target-selection(사람의 대상 선정 — 경계 #2, ADR-0053)을
  #   추가한다. requiredArtifacts·completionCriteria에 대상 축을 명시하고
  #   fs gate에 선정 기록 판정기준을 추가한다. S9는 "Short List 대상 DD"에서
  #   "선정 대상 DD"로 좁힌다 — S8의 정량 비교가 선정 수단이며 DD 비용은
  #   선정된 1개 대상에 집중된다. 프로젝트 캐리어는 1:1 승격 그대로 유지
  #   (ADR-0095), 반복은 디스패치 계층의 대상별 프로시저 호출로 처리한다
  #   (프로시저 스키마에 루프 구문 신설 없음).
  # v2.4.1 — 문언-구현 정합 정리 (2026-09-18 스펙-엔진 정합 감사). S3 완료
  #   기준을 구현된 표면(판단 근거 텍스트 + 결정론 Go/Hold/Kill 권고 + 사람의
  #   Screening 게이트 기록)으로 명시 — 2026-09-15에 전용 적합성 판정 UI가
  #   중복 계층으로 제거된 결정을 문언이 따르게 한다. 구조 변경 없음. 엔진
  #   측 정합(S1 경쟁 구조 하드 게이트, S4 검토한 대안 완료 검사)은 이 버전의
  #   문언이 이미 요구하던 바의 구현이므로 별도 버전 없이 정렬한다.
  # v2.4.0 — S4 결정이 시장·경쟁·역량 근거 위에서 이루어지도록 입력 사슬을
  #   선언·강제한다 (2026-09-14 사용자 리포트: 트랙 결정이 시장·경쟁 현황을
  #   근거로 해야 한다). S1 gains 경쟁 구조 as a required artifact (the S1
  #   competitive-intelligence activity already produces it, but the gate
  #   never required it); S3 gains 필요 역량 목록·역량 갭 분석 outputs
  #   (the "S1/S3 도출 필요 역량 목록" referenced by S5/S6 inputs and
  #   chk-target-screening t-05 existed nowhere as data); S4 inputs now
  #   declare the S1 outputs + S3 역량 갭 분석 it implicitly consumed.
  #   No stage/gate structure change.
  # v2.3.0 — fs gate gains a decision criterion for the pre-defined business
  #   target standards (md_business_target master data, ADR-0114): the human
  #   fs record checks whether the group/affiliate standards are met in the
  #   base scenario. Evidence display is non-blocking; gate verdicts stay
  #   human-only (ADR-0053/0094). No stage/track structure change.
  # v2.2.2 — S2 기회 발굴 gets its own procedure (shared-opportunity-discovery,
  #   closing the 2026-08-31 run gap "no shared YAML for S2"); the S2
  #   activities now reference it ahead of the screening procedures.
  # v2.2.1 — S11 entryCriteria corrected from "S9 완료" to "S10 완료": the
  #   v2.2.0 renumbering inserted S10 투자구조 설계 between S9 and S11 but
  #   left S11's entry criteria stale (S11 inputs already referenced S10
  #   outputs). No stage/gate structure change.
  #   Also: S1 value-chain-analysis agent corrected industry-lead →
  #   market-intelligence-agent to match the screening procedures' step
  #   assignments and the roster (industry-lead owns neither of the
  #   activity's skills; it remains a Screening committee seat and the
  #   industry-profiles owner).
  # v2.2.0 — new S10 투자구조 설계 (Deal Structuring): the ADR-0045 four-axis
  #   investment-structure review (tax / liability isolation / financing
  #   leverage / exit) plus the financing plan (sources & uses) become their own
  #   stage between S9 실사 and 투자심의; former S10→S11, S11→S12.
  # v2.1.0 — spec-vs-implementation audit bindings: route-advisory (S4),
  # dd-waiver-review (S9), charter-baseline + ic-preparation scorecard/minutes/
  # briefing-pack notes + pmi-kickoff + jv-lifecycle-governance (S10).
  # ADR-0094/0095: opportunity is the S1-S7 lifecycle carrier (promoted to a
  # project at S8); the original v2 split (opp S1-S4 / project S5-S11) was
  # superseded when project promotion was deferred to S8+.
  entity_lifecycles:
    opportunity: [S1, S2, S3, S4, S5, S6, S7]
    project: [S8, S9, S10, S11, S12]

gates:
  - id: screening
    name: Screening
    decisionCriteria:
      - 시장 매력도가 수용 기준 이상이다
      - 전략적 적합성 knock-out 항목을 모두 통과했다
      - 시너지 점수가 합의 기준을 충족한다
    killCriteria:
      - 시장이 구조적으로 매력이 없다(축소+상품화)
      - 데이터 신뢰도가 판단 불가 수준이다
      - 전략적 적합성 knock-out 실패
    fundingDecision: Screening 통과 시 Pre-FS 예산 트랜치 개시
  - id: pre_fs
    name: Pre-FS
    decisionCriteria:
      - 트랙(그린필드/브라운필드) 결정 근거가 기록되었다
      - "트랙별 후속 검토 입력이 존재한다 (greenfield: 역량 평가, brownfield: Target Universe 정의)"
    killCriteria:
      - 진출방식이 결정되지 않았다
    fundingDecision: FS 본격 검토 자원 배정
  - id: target_screening
    name: Target Screening
    decisionCriteria:
      - Target Company Short List가 존재한다
      - 모든 Long List 후보에 랭킹 또는 제외 사유가 기록되었다
      - Short List 후보가 knock-out 스크리닝을 통과했다
    killCriteria:
      - knock-out 통과 후보가 0건이다 (스크리닝 결과 진입 가능한 대상 없음)
    fundingDecision: Short List 대상 사업성 분석 자원 배정
  - id: fs
    name: FS
    decisionCriteria:
      - 정량화된 Business Case(NPV/IRR/BEP 또는 밸류에이션 범위)가 존재한다
      - 사전 정의된 사업목표 기준(그룹/계열사 마스터데이터, ADR-0114) 충족 여부가 기본 시나리오 기준으로 확인되었다
      - "brownfield: 대상별 비교 분석과 사람의 대상 선정 기록(target_selection)이 존재한다"
    killCriteria:
      - 기준 수익률 미달이 기본 시나리오에서 확인된다
    fundingDecision: DD 착수 자원 배정
  - id: dd
    name: DD
    decisionCriteria:
      - 필수 체크리스트 항목이 모두 충족/해당없음/예외 처리되었다
      - 미해소 필수 미충족이 0건이다
    killCriteria:
      - waiver 불가능한 필수 항목 미충족 지속
    fundingDecision: 투자심의 자료 작성 자원 배정
  - id: entity_ic
    name: 법인 투자심의위원회
    decisionCriteria:
      - 투자심의 자료가 완비되었다
      - 사람 최종 승인 필수 산출물의 reviewed_by가 기록되었다
    killCriteria:
      - 필수 산출물 미승인
    fundingDecision: Entity 차원 투자 권고
  - id: group_ic
    name: 그룹 투자심의위원회
    decisionCriteria:
      - 법인 투자심의위원회 승인이 선행되었다
      - 그룹 관점 포트폴리오 적합성이 검토되었다
    killCriteria:
      - 그룹 수준 반려
    fundingDecision: 최종 투자 집행

stages:
  - id: S1
    name: 시장분석
    objective: 어디에 기회가 있는가? — 시장 규모·성장·경쟁구조와 가치사슬을 파악한다
    inputs:
      - 외부 시장 데이터 (fact_market_observation)
      - 산업 드라이버 레지스트리
    outputs:
      - 시장 규모·성장 추정 (systematic-market-sizing 매트릭스 — 버전 관리)
      - 경쟁 구조 (시장 집중도·주요 플레이어 — competitive-intelligence 액티비티 산출)
      - 외부 미래 전망 대비 격차 분석 (입수 시 — 신규·강화 드라이버 요인 포함, S2 인사이트로 연동)
        # v1.2.0 보정 루프 — 격차(상대 CAGR 기준 20% 이상) 시 드라이버 귀인 제안을
        # 생성하고, 사람이 수용한 보정 드라이버·기록된 외부 참조를 다음 재분석의
        # 제약으로 주입해 버전 간 격차를 수렴시킨다 (2026-09-18-s1-growth-gap-calibration).
      - 가치사슬 구조
    entryCriteria: []
    activities:
      - id: market-research
        agent: market-intelligence-agent
        skills: [market-data-pipeline, proxy-industry-chain, systematic-market-sizing]
        procedure: [greenfield-screening, brownfield-screening]
      - id: competitive-intelligence
        agent: market-intelligence-agent
        skills: [competitive-intelligence]
        procedure: [greenfield-screening, brownfield-screening]
      - id: value-chain-analysis
        agent: market-intelligence-agent
        skills: [value-chain-linkage-analysis, value-chain-stage-financials]
        procedure: [greenfield-screening, brownfield-screening]
    requiredArtifacts:
      - 시장 규모·성장 추정
      - 경쟁 구조
      - 가치사슬 구조
    completionCriteria:
      - 최소 1개의 정량화된 수요 추정(직접 또는 프록시 체인)이 존재한다
      - 최신 완료 버전의 매트릭스에 경쟁 구조(집중도 요약·주요 플레이어)가 기록되었다
      - 데이터 신뢰도 등급이 기록되었다
    applicableTracks: [greenfield, brownfield]
    stateTransitions: { onComplete: S2, onHold: S1, onKill: terminal }
    gates: [screening]

  - id: S2
    name: 기회 발굴
    objective: 무엇을 할 것인가? — 가치사슬상 사업 기회를 등록·평가한다
    inputs:
      - 시장 규모·성장 추정 (S1)
      - 가치사슬 구조 (S1)
    outputs:
      - 기회 퍼널(매력도 포함)
      - 진입시장 산정 (기회별 — S1 링크·대상 범위·배율 도출 사슬, ADR-0180)
    entryCriteria:
      - S1 산출물 존재
    activities:
      - id: opportunity-discovery
        agent: market-intelligence-agent
        skills: [insight-synthesis]
        procedure: [opportunity-discovery, greenfield-screening, brownfield-screening]
      - id: business-model-sketch
        agent: greenfield-agent
        skills: [scenario-planning]
        procedure: [opportunity-discovery, greenfield-screening, brownfield-screening]
      - id: entry-market-sizing
        agent: market-intelligence-agent
        skills: [systematic-market-sizing]
        procedure: [opportunity-discovery, greenfield-screening, brownfield-screening]
        # ADR-0180 (v2.9.0) / ADR-0181 (v2.9.1) — 기회별 진입시장 산정: S1
        # 시장규모 버전을 연결하고(opportunity.sizing_analysis_id/
        # sizing_version_id), 사람이 S1 매트릭스의 지역·세그먼트를 선택해 진입
        # 시장 정보(market_brief)를 입력하면 AI가 배율 인자와 진입시장 성장률을
        # 초안 제안하고 사람이 확정한다(경계 #2 — 저장은 사람의 행위).
        # 도출 = S1 앵커 × Πf (배율 전용·단계별 출처 필수 — ADR-0179 수정안
        # §B; 단계별 범위 태그는 record-level 판정으로 대체 — ADR-0181).
        # 다통화 기준 환율·변동폭(entry_market_fx)이 여기서 설정되고 S3부터는
        # 원화 기준으로 진행한다. 도출값은 결정 지원이며 게이트를 막지 않는다
        # (경계 #2/#4); S8의 시장 앵커·성장률을 대체하고 S3~S12 전체가 이
        # 진입시장을 기준으로 진행한다. 수치 입력은 ERD 원칙에 따라 FK 기반
        # 테이블(0151)에 저장된다.
    requiredArtifacts:
      - 기회 등록(가치사슬 노드·매력도)
      - 진입시장 산정 (S1 링크·대상 범위·도출 사슬)
    completionCriteria:
      - 최소 1개 기회가 등록되고 매력도가 평가되었다
      - 최소 1개 기회에 S1 시장규모 버전이 연결되고 대상 범위가 기록되었다 (ADR-0180 — 미연결 상태는 미연결로 정직 표시되며 게이트를 막지 않는다)
    applicableTracks: [greenfield, brownfield]
    stateTransitions: { onComplete: S3, onHold: S2, onKill: terminal }
    gates: [screening]

  - id: S3
    name: 시너지·전략적 적합성
    objective: 우리가 해야 하는가? — 자사 역량과의 시너지를 평가한다
    inputs:
      - 후보 기회 (S2 기회 퍼널)
      - 진입시장 산정 (S2 — 지역·세그먼트 도출 시장, ADR-0180; S3~S12가 대상으로 삼는 시장)
      - 자사 역량·포트폴리오 정보 (그룹/계열사 분석 산출 — 그룹/계열사 프로파일)
    outputs:
      - 시너지 점수
      - 전략적 적합성 평가
      - 필요 역량 목록 (시장 요구사항 — S2 스케치 requiredCapabilities·S1 요인에서 도출)
      - 역량 갭 분석 (그룹/계열사 보유 역량 대비; 내부(자사 단독) 역량 평가는 후속 보강)
    entryCriteria:
      - S2 완료 (selected 기회 존재)
    activities:
      - id: strategic-fit-screening
        agent: process-governance-manager
        skills: [strategic-fit-screening, portfolio-fit-assessment]
        procedure: [greenfield-screening, brownfield-screening]
      - id: synergy-analysis
        agent: risk-officer
        skills: [assumption-audit]
        procedure: [greenfield-screening, brownfield-screening]
        # 시너지 정합성 화면 — 대상은 그룹/계열사 레지스트리(계열사 또는 그룹 전체)이며,
        # S2 기회를 연결해 분석하고 완료 시 opportunity.synergy_score 권고를 기록한다 (ADR-0090).
      - id: our-company-profile
        agent: financial-analyst
        skills: [historical-financial-analysis, company-intelligence]
        procedure: [company-profile-analysis]
        # 그룹/계열사 프로파일 — 자사 강점/약점·산업 노출을 버전 누적으로 관리 (S3 입력, ADR-0080·0089).
    requiredArtifacts:
      - 시너지 평가
      - 전략적 적합성 판단
    completionCriteria:
      - 기회에 synergy_score와 근거가 기록되었다
      - 적합성 판단 근거(rationale)가 기록되고 결정론 권고(매력도·시너지 조합)가 제시되었다
      - 최소 1개 기회가 selected 상태이다 (시너지·적합성 평가 후 선정)
      # v2.4.1 — "적합성 판단(Go/Hold/Kill 권고)이 존재한다"에서 변경: 전용 적합성
      # 판정 UI(knock-out 체크리스트, POST kind:'fit')는 2026-09-15에 중복 계층으로
      # 제거되었다. 판단의 표면은 ① opportunity.rationale 근거 텍스트 ② 매력도·시너지
      # 결정론 권고 칩(lib/opportunity-screening.ts) ③ 사람이 기록하는 Screening
      # 게이트 결정의 조합이며, 최종 판정은 게이트 기록(사람)이다 (경계 #2).
      # 게이트 권고 조합 로직(fit=Go & synergy≥60→Go, fit=Kill or synergy<40→Kill, 그 외→Hold)은
      # 시너지 점수가 40 미만이면 사람의 Hold 판정보다 우선해 Kill을 권고할 수 있다 —
      # 이 경우 권고 근거를 기록하고 사람이 최종 판단한다 (경계 #2: 자동 판정 아님)
    applicableTracks: [greenfield, brownfield]
    stateTransitions: { onComplete: S4, onHold: S3, onKill: terminal }
    gates: [screening]

  - id: S4
    name: 진출방식 결정
    objective: "어떻게 들어갈 것인가? — Greenfield(자체 역량 진출) vs Brownfield(기존 기업·자산 결합)를 결정한다. Brownfield ≠ M&A — M&A·JV·전략적 투자·소수점 지분·파트너십·R&BD·사내벤처(CVC) 중 Route를 고른다"
    inputs:
      - 시너지·적합성 평가
      - 역량 갭 분석 (S3 — 시장 요구사항 대비 그룹/계열사 보유 역량)
      - 진입시장 성장률 (S2 확정 — ADR-0181; 라우트 어드바이저 성장 신호의 기준)
      - 시장 규모·성장 추정 (S1)
      - 경쟁 구조 (S1)
      - 가치사슬 구조 (S1)
    outputs:
      - 라우트 결정 기록
    entryCriteria:
      - S3 완료
    activities:
      - id: route-strategy
        agent: pm
        skills: [deal-execution-playbook, jv-structuring, partner-sourcing-strategy]
        procedure: [greenfield-pre-fs, brownfield-pre-fs, deal-shape-chain]
      - id: deal-shape-evaluation
        agent: brownfield-agent
        skills: [deal-execution-playbook]
        procedure: [greenfield-pre-fs, brownfield-pre-fs, deal-shape-chain]
      - id: route-advisory
        agent: pm
        skills: []
        procedure: [greenfield-pre-fs, brownfield-pre-fs, deal-shape-chain]
        # 결정론적 트랙 권고 엔진 — 시장 매력도·시너지 점수·시장 CAGR/불확실성·
        # 쇼트리스트 존재·역량 신호를 정규화해 권고 트랙(및 서브트랙)과 근거를
        # 산출한다. 산출물은 권고일 뿐이며 결정은 사람의 route_decision (경계 #2).
        # 구현: app/web-next/lib/track-advisory.ts · GET /api/opportunities/[id]/route-advisory
      # 채점 프레임워크: Stage 1 의도 분기(통합 vs 역량접근) → Stage 2 5criteria×20%
      # 가중채점(통제 필요도·역량 결정성·시장 불확실성·통합 역량·역량확보 속도) +
      # 사전배제(통제필요도=高 AND 파트너 지식=암묵적 → 라이선스/공동개발 배제) —
      # docs/decisions/2026-08-24-class-c-decisions.md (d), ADR-0052
    requiredArtifacts:
      - 트랙 결정(GF/BF)·근거
      - Brownfield 선택 시 Route 유형(M&A/JV/전략적 투자/소수점 지분/파트너십/R&BD/CVC)
      - 5criteria 채점 결과(통제 필요도·역량 결정성·시장 불확실성·통합 역량·역량확보 속도 각 20%)
      - 검토한 대안
    completionCriteria:
      - route_decision 레코드가 존재한다 (track 필수; brownfield는 Route 유형(sub_track) 필수, greenfield의 sub_track은 선택)
      - Brownfield인 경우 5criteria 채점 결과와 사전배제 점검이 기록되었다
      - Greenfield인 경우에도 5criteria 채점 결과를 기록한다 (ADR-0104 — 트랙 간 비교 가능성)
    applicableTracks: [greenfield, brownfield]
    stateTransitions: { onComplete: S5, onHold: S4, onKill: terminal }
    gates: [screening, pre_fs]

  - id: S5
    name: 자체 진출
    objective: 스스로 진입할 수 있는가? — 자체 역량을 평가하고 격차를 구축 방안(Build/Partner/Hire/Invest)으로 해소해 진출전략을 세운다 (Greenfield 전용 — Target Company 객체가 존재하지 않는다)
    inputs:
      - 트랙 결정 (greenfield)
      - 자사 역량·조직·인프라 정보
      - 필요 역량 목록 (S3 적합성 평가에서 도출)
    outputs:
      - 역량 격차 평가
      - 진출전략(Build/Partner/Hire/Invest)
      - Business Case 라인(비용·수익 구조)
    entryCriteria:
      - S4 완료 (track = greenfield)
    activities:
      - id: capability-assessment
        agent: greenfield-agent
        skills: [greenfield-feasibility, org-readiness-assessment]
        procedure: [greenfield-capability-assessment]
      - id: entry-strategy
        agent: greenfield-agent
        skills: [scenario-planning, talent-pipeline-planning]
        procedure: [greenfield-capability-assessment]
      - id: business-case-lines
        agent: financial-analyst
        skills: [investment-feasibility-modeling]
        procedure: [greenfield-capability-assessment]
    requiredArtifacts:
      - 역량 격차 평가
      - 진출전략(Build/Partner/Hire/Invest 결정·근거)
    completionCriteria:
      - 필요 역량 대비 보유 역량 격차와 해소 방안이 기록되었다
      - 진출전략이 결정되고 검토한 대안이 기록되었다

    # greenfield 실행 시 S6·S7은 applicableTracks 미충족으로 스킵되어 S8로 진행한다
    applicableTracks: [greenfield]
    stateTransitions: { onComplete: S6, onHold: S5, onKill: terminal }
    gates: [pre_fs]

  - id: S6
    name: 대상 후보 발굴
    objective: 누구와 결합할 것인가? — Opportunity에 진입 가능한 기존 기업·자산의 Target Universe를 정의하고 Target Company Long List를 작성한다 (Brownfield 전용)
    inputs:
      - 트랙 결정·Route 유형 (brownfield)
      - 시장 정의·가치사슬 구조 (S1)
      - 필요 역량·진입 조건 (S3)
    outputs:
      - Target Universe 정의(선정 기준·커버리지)
      - Target Company Long List(필수 속성·출처 포함)
    entryCriteria:
      - S4 완료 (track = brownfield)
    activities:
      - id: target-universe-definition
        agent: brownfield-agent
        skills: [brownfield-feasibility, competitive-intelligence]
        procedure: [brownfield-target-identification]
      - id: target-longlist
        agent: market-intelligence-agent
        skills: [company-intelligence, brownfield-feasibility]
        procedure: [brownfield-target-identification]
    requiredArtifacts:
      - Target Universe 정의
      - Target Company Long List
    completionCriteria:
      - 후보 Universe의 정의·선정 기준이 기록되었다
      - 최소 커버리지 기준을 충족하는 Long List가 존재한다
      - Long List 후보에 필수 속성과 출처/근거가 기록되었다
    applicableTracks: [brownfield]
    stateTransitions: { onComplete: S7, onHold: S6, onKill: terminal }
    gates: [pre_fs]

  - id: S7
    name: 대상 선정
    objective: 어떤 대상이 유망한가? — Long List를 전략·역량·재무·소유권·규제 기준으로 스크리닝해 Target Company Short List로 좁힌다 (Brownfield 전용 — CDD/TDD는 Short List 확정 후 S9에서 수행한다)
    inputs:
      - Target Company Long List (S6)
      - 스크리닝 기준(전략적 적합성·역량 적합성·재무·지역·소유권/가용성·규제 제약)
    outputs:
      - Target Company Short List
      - Target Ranking/Score
      - Screening Evidence
      - Exclusion Reasons
    entryCriteria:
      - S6 완료 (Long List 존재)
    activities:
      - id: target-screening
        agent: brownfield-agent
        skills: [brownfield-feasibility, strategic-fit-screening, peer-benchmarking]
        procedure: [brownfield-target-screening]
      - id: ownership-regulatory-screening
        agent: antitrust-agent
        skills: [antitrust-screening, regulatory-screening]
        procedure: [brownfield-target-screening]
      - id: target-ranking
        agent: brownfield-agent
        skills: [strategic-fit-screening, brownfield-feasibility]
        procedure: [brownfield-target-screening]
    requiredArtifacts:
      - Target Company Short List
      - Target Ranking/Score
      - Exclusion Reasons
    completionCriteria:
      - 모든 Long List 후보에 랭킹 점수 또는 제외 사유가 기록되었다
      - Short List 후보가 knock-out 스크리닝을 통과했다
      - 스크리닝 근거(evidence)가 후보별로 기록되었다
    applicableTracks: [brownfield]
    stateTransitions: { onComplete: S8, onHold: S7, onKill: terminal }
    gates: [target_screening]

  - id: S8
    name: 사업성 분석
    objective: 돈이 되는가? — Greenfield는 진출전략 기반 Business Case, Brownfield는 Short List 대상별 밸류에이션을 정량화해 비교·선정한다
    # subjectScope (v2.5.0, ADR-0143) — 이 단계의 분석 주체 반복 단위를
    # 선언한다. single = 프로젝트당 1회, shortlist = Short List 대상별 1회씩
    # (activities·프로시저는 대상별로 반복 호출 — 루프 구문 없이 디스패치
    # 계층의 반복). 구현: business_case_model.target_id 축, S8 완료 술어의
    # 트랙 분기 (lib/process-flow.ts).
    subjectScope: { greenfield: single, brownfield: shortlist }
    inputs:
      - 트랙 결정
      - 진출전략·Business Case 라인 (greenfield — S5)
      - Short List 대상 재무 정보 (brownfield — S7, 대상별)
      - 진입시장 산정 (S2 확정 — ADR-0181; 시장 앵커·성장률·환율 개산과 몬테카를로 환 리스크의 기준)
    outputs:
      - Business Case / 밸류에이션 (brownfield — 대상별)
      - 시뮬레이션 NPV 분포
      - BEP 시점·물량 (밸류에이션)
      - 시뮬레이션 입력 스냅샷 (job-spec 기록)
      - Target 비교 분석·권고 (brownfield)
      - 대상 선정 기록 (brownfield — 사람 결정)
    entryCriteria:
      - "greenfield: S5 완료 / brownfield: S7 완료 (Short List 존재)"
    activities:
      - id: business-case-modeling
        agent: financial-analyst
        skills: [growth-projection-modeling, investment-feasibility-modeling]
        procedure: [greenfield-fs, brownfield-fs]
        # brownfield는 Short List 대상별로 본 활동 체계를 반복 호출한다
        # (subjectScope: shortlist — 각 호출의 산출물은 target_id로 귀속).
      - id: valuation
        agent: valuation-agent
        skills: [dd-to-valuation-bridge, monte-carlo-simulation]
        procedure: [greenfield-fs, brownfield-fs]
      - id: quant-methods
        agent: quant-methodologist
        skills: [wacc-input-session, monte-carlo-simulation]
        procedure: [greenfield-fs, brownfield-fs]
      - id: target-comparison
        agent: financial-analyst
        skills: [investment-feasibility-modeling]
        procedure: [brownfield-fs-comparative]
        # brownfield 전용 — 대상별 gate-primary(market_forward) p05 NPV 기준
        # 비교표와 RECOMMENDED 대상 권고를 산출한다. 권고일 뿐이며 선정은
        # 다음 활동의 사람 기록이다 (경계 #2).
      - id: target-selection
        agent: pm
        skills: []
        procedure: [brownfield-fs-comparative]
        # 사람의 대상 선정 기록(target_selection, ADR-0053 경계 #2) — PM이
        # 게이트 제안서에 비교·권고를 첨부하고, 사람의 기록이 확정한다
        # (구현: lib/business-case.ts selectTarget → process_run
        # s8_target_select, md_project.company_id 확정).
    requiredArtifacts:
      - Business Case(비용·수익 라인 또는 밸류에이션 — brownfield는 대상별)
      - 시뮬레이션 NPV 분위수
      - BEP 시점과 시뮬레이션 입력 스냅샷
      - Target 비교 분석 (brownfield)
      - 대상 선정 기록 (brownfield)
    completionCriteria:
      - 민감도가 포함된 정량 평가가 존재한다 (시뮬레이션 또는 밸류에이션 범위)
      - BEP 시점과 시뮬레이션 입력 스냅샷이 산출되어 있다
      - "brownfield: Short List의 모든 대상이 각각 분석되어 있다 (대상별 Business Case + 시뮬레이션)"
      - "brownfield: 대상 비교 분석과 사람의 대상 선정 기록이 존재한다"
    applicableTracks: [greenfield, brownfield]
    stateTransitions: { onComplete: S9, onHold: S8, onKill: terminal }
    gates: [fs]

  - id: S9
    name: 실사·검증
    objective: 사실인가? 위험은 무엇인가? — 트랙별 실사 체크리스트를 수행한다 (brownfield는 S8에서 선정된 대상 DD, 선택적으로 다른 Short List 대상 DD를 비교 근거로 열 수 있다. greenfield는 실현가능성 검증)
    inputs:
      - 게이트 체크리스트 (commercial/technical/legal)
      - 조사 근거
      - S8 대상 선정 기록 (brownfield)
      - S3 필요 역량 등록부 (brownfield — capability-dd 입력; design 2026-10-19-brownfield-capability-dd)
    outputs:
      - DD 체크리스트 판정
      - 조사내역(dd_finding)
      - 대상별 DD 비교(선택)
      - 필요 역량 검증 판정 (brownfield, 역량별 해소/부분 해소/미해소 — S8 기술 렌즈 T1의 근거)
      - 기술 렌즈 T2~T5 롤업 근거 (기술·인사·법무 체크리스트 판정 — design 2026-10-20-technical-items-s9)
    entryCriteria:
      - S8 완료
    activities:
      - id: commercial-dd
        agent: commercial-dd-agent
        skills: [commercial-due-diligence]
        procedure: [greenfield-dd, brownfield-dd]
      - id: technical-dd
        agent: technical-dd-agent
        skills: [technical-due-diligence, site-infrastructure-assessment]
        procedure: [greenfield-dd, brownfield-dd]
      - id: legal-dd
        agent: legal-counsel
        skills: [legal-due-diligence, regulatory-screening]
        procedure: [greenfield-dd, brownfield-dd]
      - id: financial-dd
        agent: financial-analyst
        skills: [quality-of-earnings, historical-financial-analysis]
        procedure: [greenfield-dd, brownfield-dd]
      - id: hr-dd
        agent: hr-integration-agent
        skills: [org-readiness-assessment, talent-pipeline-planning]
        procedure: [greenfield-dd, brownfield-dd]
      - id: market-dd
        agent: market-intelligence-agent
        skills: [competitive-intelligence]
        procedure: [greenfield-dd, brownfield-dd]
      - id: financing-dd
        agent: financing-agent
        skills: []
        procedure: [greenfield-dd, brownfield-dd]
      - id: dd-waiver-review
        agent: compliance-officer
        skills: [waiver-management]
        procedure: [greenfield-dd, brownfield-dd]
      # 2026-10-20 (design 2026-10-19-brownfield-capability-dd §3.1): brownfield verifies the S3
      # required-capability register against the selected target here — a person records per-row
      # 해소/부분 해소/미해소; S8 T1 reflects the coverage. Skill is the activity agent's own.
      # Brownfield-only (greenfield answers this at S5), so the procedure list is brownfield-dd alone.
      - id: capability-dd
        agent: brownfield-agent
        skills: [brownfield-feasibility]
        procedure: [brownfield-dd]
        # 필수 항목 미충족은 활성 waiver 없이는 게이트를 통과할 수 없다
        # (kill criteria: "waiver 불가능한 필수 항목"). waiver 요청·승인·만료를
        # 이 활동이 소유한다 — skills/waiver-management.
    requiredArtifacts:
      - DD 체크리스트 판정(필수 항목 해소)
    completionCriteria:
      - 적용 체크리스트의 모든 항목이 판정되고 필수 미충족이 0건이다
    applicableTracks: [greenfield, brownfield]
    stateTransitions: { onComplete: S10, onHold: S9, onKill: terminal }
    gates: [dd]

  - id: S10
    name: 투자구조 설계
    objective: "어떤 그릇으로, 어떤 자금으로 들어갈 것인가? — 투자 주체(direct/SPC/holdco/내부 스핀오프/JV)과 ADR-0045 4대 축(절세 구조·책임 격리·재무 레버리지·엑싯 구조)을 검토하고 자금조달 계획(sources & uses)을 균형시킨다 (투자심의의 입력 설계)"
    inputs:
      - S8 채택 Business Case
      - S9 DD 발견사항(dd_finding value_impact 포함)
      - WACC·hurdle 입력값
    outputs:
      - 투자구조 가설(4축 검토 완료 — deal_structure_review 아티팩트 참조; 그린필드는 설립 구조 결정(신규 법인 설립 또는 신규 사업부 추진) 포함)
      - 자금조달 계획(sources & uses 균형·자금 확정성 증빙)
      # 브라운필드 지급 조건(획득형 보수 등 단계별 지급) 전용 화면은 없다 —
      # capex 트랜치 탭은 greenfield 전용이다. 공식 기록 운반체는
      # venture_transition_decision.tranche_condition (ADR-0151, S12 술어가
      # next_tranche_released/held_evidence_incomplete 결정에 컬럼을 강제)다
      # (ADR-0151 addendum 2026-10-22 a). S10에서는 4축 가설 노트·자금조달
      # 계획이 초안 위치다.
    entryCriteria:
      - S9 완료
    activities:
      - id: deal-structure-hypothesis
        agent: brownfield-agent
        skills: [investment-vehicle-structuring]
        procedure: [deal-structuring, brownfield-fs, deal-shape-chain]
        # 투자 주체(direct/SPC/holdco/internal_venture_spinoff/jv)·자산/주식·지분·
        # 수표/instrument 믹스 가설을 세우고 4대 축 노트(절세·책임격리·
        # 레버리지·엑싯)를 기록한다. 완료 플래그는 근거 아티팩트 참조가
        # 필수인 별도의 심사 행위다 (deal-structure-hypothesis.repository).
      - id: financing-plan
        agent: valuation-agent
        skills: [financing-plan-review]
        procedure: [deal-structuring]
        # sources & uses를 수집해 균형(조달=사용)을 맞추고, 커버넌트 여력·
        # 자금 확정성 증빙을 투자심의 자료에 첨부 가능한 형태로 남긴다.
    requiredArtifacts:
      - 투자구조 가설(4축 검토 완료)
      - 자금조달 계획(sources & uses 균형)
    completionCriteria:
      - 최신 투자구조 가설의 4축 검토(절세 구조·책임 격리·재무 레버리지·엑싯 구조)가 근거 아티팩트 참조와 함께 완료되었다
      - 자금조달 sources와 uses 합계가 균형을 이루고 0보다 크다
    applicableTracks: [greenfield, brownfield]
    stateTransitions: { onComplete: S11, onHold: S10, onKill: terminal }
    gates: []

  - id: S11
    name: 투자심사·실행
    objective: "투자할 것인가? — S10에서 설계한 투자 구조와 자금 조달 계획을 투자심의 자료로 묶어 법인·그룹 투자심의위원회 심사를 통과하고, 승인되면 트랙에 맞는 실행에 들어간다(인수 종결, 설립 또는 사업부 신설 실행, greenfield 실행 기준선 확정)"
    inputs:
      - 투자심의 자료(사업계획·DD·RAG·검토)
      - 투자 구조안(S10 투자구조 설계의 산출물 — 투자 주체·4축 검토·자금조달 계획)
      - 사람 최종 승인 산출물
    outputs:
      - IC 결정
      - 투자 구조 확정(투자 주체·자금 조달 mix·지급 일정)
      - 설립 완료 법인(신설 법인 — 사내벤처·자회사, origin∈{internal,joint})
      - 실행 진입(PMI / 벤처 모니터링 / R&BD 실행)
      - 실행 기준선(greenfield — capex_tranche 연결·인허가/인증 마일스톤·채용·램프업 KPI·인센티브 의무, 사람 확인)
    entryCriteria:
      - S10 완료
    activities:
      - id: ic-preparation
        agent: pm
        skills: [executive-presentation, sample-driven-report-writing]
        procedure: [entity-ic-review, group-investment-review]
        # 위원회 정량 스코어카드(좌석별 5기준 1~3 채점 집계)와 회의록 생성·확정은
        # 이 활동의 구현 일부다 — app/web-next/lib/committee-scorecard.ts.
        # 게이트 일시정지 시 위원회 브리핑 팩(회의록 초안·프로세스 스냅샷)을
        # 자동 첨부한다 — app/web-next/lib/briefing-pack.ts (E1 자동화).
      - id: charter-baseline
        agent: pm
        skills: []
        procedure: [entity-ic-review]
        # 추진계획(차터) 기준선: 목적·트랙 근거·진출 범위·KPI 선커밋을 S1~S7
        # 산출물로부터 조립해 투자심의 입력으로 제출한다. KPI 선커밋은 S11
        # 스코어카드 목표값으로 자동 병합된다. 변경은 append-only 이력으로 기록.
        # 구현: app/web-next/lib/project-charter.ts · GET/POST /api/projects/[id]/charter
      - id: investment-structuring
        agent: brownfield-agent
        skills: []
        procedure: [entity-ic-review, jv-lifecycle-governance]
        # S11은 투자 구조를 설계하지 않는다 — S10 투자구조 설계 산출물(투자 주체·
        # 4축 검토·자금조달 계획)을 투자심의 자료에 참조로 묶을 뿐이다.
        # jv-lifecycle-governance는 Route가 JV인 경우에 적용한다 (설립·거버넌스·
        # 출구 전 라이프사이클 약속의 기준선).
        # v2.8.0 (ADR-0161 Q6): owner는 brownfield-agent 그대로(활동 필드는 트랙별로
        # 바꿀 수 없다). greenfield는 greenfield-agent가 소유하고 financing-agent가
        # 공동검토한다 — entity-ic-review step 3.1(case_type=greenfield)의 정의에
        # 기록된다. 절차 스키마는 단계별 단일 agent_key만 지원하므로 공동검토는
        # 기계 강제가 아니라 절차 정의가 운반하는 계약이다.
      - id: risk-review
        agent: risk-officer
        skills: [legal-risk-register]
        procedure: [entity-ic-review, group-investment-review]
      - id: group-review
        agent: group-review-agent
        skills: [group-level-review]
        procedure: [entity-ic-review, group-investment-review]
      - id: entity-establishment-execution
        agent: process-governance-manager
        skills: [legal-due-diligence, k-law, certification-transferability, org-readiness-assessment, stage-gate-governance]
        procedure: [entity-establishment-execution]
        # origin∈{internal,joint}에서만 적용 (ADR-0047) — 절차 applies_when이 강제한다.
        # 사업부 신설(origin=internal, establishment_mode=business_unit)은 자매
        # 절차 business-unit-establishment-execution(ADR-0167)이 담당한다 —
        # 아래 requiredArtifacts의 "신규 사업부 추진" 증적(chk-business-unit-formation)의
        # 절차 원이며, 본 활동 목록에는 단일 절차 키 제약상 나열되지 않는다
        # (T-20261022-043, review M8).
        # 법인 투자심의위원회 승인 후 실행: 설립준비(관할·주식구조·이사회 결의) → 법인등기·정관·
        # 사업자등록 → 신설법인 인허가 이전/재발급 분류 → 인력이전(신 근로계약+PIIA) →
        # 완료확인(IP양도체인·거버넌스 베이스라인, JV는 이사회·데드락 조항 추가검증).
      - id: pmi-kickoff
        agent: pmi-agent
        skills: [pmi-planning]
        procedure: [pmi-integration-execution]
        # 실행 진입(PMI) — brownfield(M&A/JV/전략적 투자)에서 법인·그룹 투자심의위원회 승인
        # 이후 통합 계획 기준선을 수립한다. 시너지 실현 추적과 통합 리스크 평가의
        # 초기 스냅샷을 S11 사후관리로 이관한다.
      - id: greenfield-execution-baseline
        agent: greenfield-agent
        skills: []
        procedure: [greenfield-execution-baseline]
        # greenfield 전용 (ADR-0161 Q1/Q5) — procedure applies_when(case_type=greenfield)이
        # 강제한다. origin이 아니라 트랙으로 판별한다. 단계: capex_tranche 행·S10 조건
        # 대조(읽기 전용, 상태를 쓰지 않음) → 인허가/인증 마일스톤(분리) → 채용 계획 →
        # 램프업 KPI 목표(S8 채택 케이스·ADR-0159 목표는 참고) → 인센티브 의무 → 사람 확인
        # (1인·근거 필수). 신설 법인이면 entity-establishment-execution이 함께 실행된다.
    requiredArtifacts:
      - 투자심의 자료
      - 추진계획(차터) 기준선 — 목적·트랙 근거·진출 범위·KPI 선커밋
      - 사람 최종 승인(reviewer 기록)
      - 설립 실행 기록(신규 법인 설립 — 설립준비·등기·인허가 분류·인력이전·완료확인 — chk-entity-formation 증적, origin∈{internal,joint} / 신규 사업부 추진 — 신설 결의·사업자등록 정리·인허가 명의 확인·인력 배치·완료 확인 — chk-business-unit-formation 증적, origin=internal)
    completionCriteria:
      - 법인 투자심의위원회와 그룹 투자심의위원회 승인이 모두 기록되었다
      - 추진계획(차터) 기준선이 확정되고 append-only 변경 이력이 시작되었다
      - origin∈{internal,joint}인 프로젝트는 entity-establishment-execution 5단계 완료 기록이 존재한다
    applicableTracks: [greenfield, brownfield]
    stateTransitions: { onComplete: S12, onHold: S11, onKill: terminal }
    gates: [entity_ic, group_ic]

  - id: S12
    name: 사후 관리
    objective: 투자 후 사업이 궤도에 올랐는가? — 포트폴리오 성과를 모니터링한다
    inputs:
      - IC 승인 결정
      - 실행 계획
    outputs:
      - 포트폴리오 스코어카드
      - 사업 성과 리포트
      - 실행 기준선 대비 차이(greenfield)
      - "포트폴리오 전환 결정(어휘 5종: next_tranche_released / held_evidence_incomplete / graduate_to_core / reduce_or_divest / kill_with_learning_captured)"
    entryCriteria:
      - S11 완료 (IC 승인, internal/joint는 설립 또는 사업부 신설 실행 완료 포함)
    activities:
      - id: portfolio-monitoring
        agent: group-review-agent
        skills: [portfolio-fit-assessment]
        procedure: [portfolio-venture-monitoring]
        # v2.8.0 (ADR-0161): portfolio-venture-monitoring v1.2.0은 greenfield를
        # case_type으로도 포함한다 (origin이 비어 있어도 적용). 기본 venture_class:
        # 신규 부지 driving / existing_business_rbd enabling / intra_venture emergent.
      - id: integration-monitoring
        agent: pmi-agent
        skills: [pmi-planning]
        procedure: [pmi-integration-execution]
        # brownfield m_and_a·strategic_investment의 사후 통합 모니터링 (ADR-0161 Q3) —
        # pmi-integration-execution step 6(시너지 run-rate·핵심인재 유지·고객 이탈).
        # step 1~5와 pmi-kickoff는 바뀌지 않는다. 범위는 step applies_when이 강제한다.
      - id: partnership-monitoring
        agent: partnership-agent
        skills: []
        procedure: [jv-lifecycle-governance]
        # brownfield partnership의 사후 관리 (ADR-0161 Q3) — jv-lifecycle-governance
        # step 2 건강 스코어카드의 파트너십 변형. 다른 단계는 origin=joint에서만 적용.
    requiredArtifacts:
      - "벤처 스코어카드 (greenfield — brownfield은 integration/partnership 모니터링, 권장·비차단)"
      - "사람 전환 결정 기록(어휘 5종, decided_by=venture-portfolio-ic, rationale 필수 — venture_transition_decision 원장)"
      - "전환별 결정 부속 기록: 차기 트랜치 조건(next_tranche_released/held_evidence_incomplete), 핵심사업 인계 기록(graduate_to_core), 매각/청산 계획(reduce_or_divest), 학습 포착 기록(kill_with_learning_captured — group-review-agent 기록, risk-officer가 S1/S2 기본률에 환류)"
      - 실행 기준선 대비 차이(greenfield)
    completionCriteria:
      # ADR-0150 (accepted 2026-10-02) — 즉시 전면 적용(진행 중 핀 프로젝트 포함, 컷오프 없음)
      - "리뷰 주기별로 스코어카드 검토가 존재한다 (greenfield — brownfield은 integration/partnership 모니터링으로 대체, 권장·비차단)"
      - "각 검토마다 사람 전환 결정이 근거(rationale)와 함께 기록되어 있다"
      - "지속 결정(next_tranche_released/held_evidence_incomplete)은 차기 트랜치 조건을 기록한다"
      - "확장 결정(graduate_to_core)은 핵심사업 인계를 기록한다"
      - "축소/철수 결정(reduce_or_divest)은 매각 또는 청산 계획을 기록한다"
      - "중단 결정(kill_with_learning_captured)은 포착된 학습을 기록하고 S1/S2 기본률에 환류한다"
      # ADR-0161 (Proposed) — greenfield 참고 기준, 게이트 차단 아님
      - "greenfield는 각 스코어카드 주기에 S11 실행 기준선·S8 채택 케이스·S8 사업 목표(참고) 대비 차이를 보고한다"
      # 이 단계의 kill/graduate는 S1~S11의 Kill Criteria와 범주가 다른 포트폴리오 거버넌스 결정이다
      # (procedures/_shared/portfolio-venture-monitoring — venture-portfolio-ic 결정 어휘 5종)
    applicableTracks: [greenfield, brownfield]
    stateTransitions: { onComplete: terminal, onHold: S12, onKill: terminal }
    gates: []
