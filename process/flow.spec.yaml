# Process Flow Specification — SSOT (v2.2.1, ADR-0074)
#
# This file is the single source of truth for the deal process:
#   - docs/process-flow.md is GENERATED from this file (scripts/co-newbiz/generate-process-flow.ts)
#   - the web UI (sidebar stage groups, stepper, stage cards, artifact checklists)
#     and the agent orchestrator render/execute from this spec at runtime
#   - tests/unit/process-flow.test.ts enforces schema + reference integrity
#
# Invariants (ADR-0074):
#   Stage ≠ Gate · Opportunity ≠ Project · Artifact ≠ Decision · Agent does not
#   own the Process · Definition/Execution are separated (process_run.spec_version)
#
# stateTransitions: onComplete → next stage id (or "terminal"); onHold stays on
# the same stage pending artifact supplementation; onKill ends the process.
#
# v2.0.0 — Route Decision (S4) 이후 Greenfield/Brownfield 트랙 분리:
#   Greenfield: S5 역량 평가·진출전략 → S8 사업성 분석 → ...
#   Brownfield: S6 대상 후보 발굴(Long List) → S7 대상 스크리닝(Short List) → S8 사업성 분석 → ...
#   트랙에 해당 없는 Stage는 applicableTracks로 스킵한다 (단일 선형 체인 유지).

meta:
  id: co-newbiz-main-flow
  name: 신규사업 검토 메인 플로우
  version: "2.3.0"
  # v2.3.0 — fs gate gains a decision criterion for the pre-defined business
  #   target standards (md_business_target master data, ADR-0114): the human
  #   fs record checks whether the group/affiliate standards are met in the
  #   base scenario. Evidence display is non-blocking; gate verdicts stay
  #   human-only (ADR-0053/0094). No stage/track structure change.
  # v2.2.2 — S2 기회 발굴 gets its own procedure (shared-opportunity-discovery,
  #   closing the 2026-08-31 run gap "no shared YAML for S2"); the S2
  #   activities now reference it ahead of the screening procedures.
  # v2.2.1 — S11 entryCriteria corrected from "S9 완료" to "S10 완료": the
  #   v2.2.0 renumbering inserted S10 투자구조 설계 between S9 and S11 but
  #   left S11's entry criteria stale (S11 inputs already referenced S10
  #   outputs). No stage/gate structure change.
  #   Also: S1 value-chain-analysis agent corrected industry-lead →
  #   market-intelligence-agent to match the screening procedures' step
  #   assignments and the roster (industry-lead owns neither of the
  #   activity's skills; it remains a Screening committee seat and the
  #   industry-profiles owner).
  # v2.2.0 — new S10 투자구조 설계 (Deal Structuring): the ADR-0045 four-axis
  #   investment-structure review (tax / liability isolation / financing
  #   leverage / exit) plus the financing plan (sources & uses) become their own
  #   stage between S9 실사 and IC 심의; former S10→S11, S11→S12.
  # v2.1.0 — spec-vs-implementation audit bindings: route-advisory (S4),
  # dd-waiver-review (S9), charter-baseline + ic-preparation scorecard/minutes/
  # briefing-pack notes + pmi-kickoff + jv-lifecycle-governance (S10).
  # ADR-0094/0095: opportunity is the S1-S7 lifecycle carrier (promoted to a
  # project at S8); the original v2 split (opp S1-S4 / project S5-S11) was
  # superseded when project promotion was deferred to S8+.
  entity_lifecycles:
    opportunity: [S1, S2, S3, S4, S5, S6, S7]
    project: [S8, S9, S10, S11, S12]

gates:
  - id: screening
    name: Screening
    decisionCriteria:
      - 시장 매력도가 수용 기준 이상이다
      - 전략적 적합성 knock-out 항목을 모두 통과했다
      - 시너지 점수가 합의 기준을 충족한다
    killCriteria:
      - 시장이 구조적으로 매력이 없다(축소+상품화)
      - 데이터 신뢰도가 판단 불가 수준이다
      - 전략적 적합성 knock-out 실패
    fundingDecision: Screening 통과 시 Pre-FS 예산 트랜치 개시
  - id: pre_fs
    name: Pre-FS
    decisionCriteria:
      - 트랙(그린필드/브라운필드) 결정 근거가 기록되었다
      - "트랙별 후속 검토 입력이 존재한다 (greenfield: 역량 평가, brownfield: Target Universe 정의)"
    killCriteria:
      - 진출방식이 결정되지 않았다
    fundingDecision: FS 본격 검토 자원 배정
  - id: target_screening
    name: Target Screening
    decisionCriteria:
      - Target Company Short List가 존재한다
      - 모든 Long List 후보에 랭킹 또는 제외 사유가 기록되었다
      - Short List 후보가 knock-out 스크리닝을 통과했다
    killCriteria:
      - knock-out 통과 후보가 0건이다 (스크리닝 결과 진입 가능한 대상 없음)
    fundingDecision: Short List 대상 사업성 분석 자원 배정
  - id: fs
    name: FS
    decisionCriteria:
      - 정량화된 Business Case(NPV/IRR/BEP 또는 밸류에이션 범위)가 존재한다
      - 사전 정의된 사업목표 기준(그룹/계열사 마스터데이터, ADR-0114) 충족 여부가 기본 시나리오 기준으로 확인되었다
    killCriteria:
      - 기준 수익률 미달이 기본 시나리오에서 확인된다
    fundingDecision: DD 착시 자원 배정
  - id: dd
    name: DD
    decisionCriteria:
      - 필수 체크리스트 항목이 모두 충족/해당없음/예외 처리되었다
      - 미해소 필수 미충족이 0건이다
    killCriteria:
      - waiver 불가능한 필수 항목 미충족 지속
    fundingDecision: IC 패키지 작성 자원 배정
  - id: entity_ic
    name: Entity IC
    decisionCriteria:
      - IC 패키지가 완비되었다
      - 사람 최종 승인 필수 산출물의 reviewed_by가 기록되었다
    killCriteria:
      - 필수 산출물 미승인
    fundingDecision: Entity 차원 투자 권고
  - id: group_ic
    name: Group IC
    decisionCriteria:
      - Entity IC 승인이 선행되었다
      - 그룹 관점 포트폴리오 적합성이 검토되었다
    killCriteria:
      - 그룹 수준 반려
    fundingDecision: 최종 투자 집행

stages:
  - id: S1
    name: 시장분석
    objective: 어디에 기회가 있는가? — 시장 규모·성장·경쟁구조와 가치사슬을 파악한다
    inputs:
      - 외부 시장 데이터 (fact_market_observation)
      - 산업 드라이버 레지스트리
    outputs:
      - 시장 규모·성장 추정 (systematic-market-sizing 매트릭스 — 버전 관리)
      - 외부 미래 전망 대비 격차 분석 (입수 시 — 신규·강화 드라이버 요인 포함, S2 인사이트로 연동)
      - 가치사슬 구조
    entryCriteria: []
    activities:
      - id: market-research
        agent: market-intelligence-agent
        skills: [market-data-pipeline, proxy-industry-chain, systematic-market-sizing]
        procedure: [greenfield-screening, brownfield-screening]
      - id: competitive-intelligence
        agent: market-intelligence-agent
        skills: [competitive-intelligence]
        procedure: [greenfield-screening, brownfield-screening]
      - id: value-chain-analysis
        agent: market-intelligence-agent
        skills: [value-chain-linkage-analysis, value-chain-stage-financials]
        procedure: [greenfield-screening, brownfield-screening]
    requiredArtifacts:
      - 시장 규모·성장 추정
      - 가치사슬 구조
    completionCriteria:
      - 최소 1개의 정량화된 수요 추정(직접 또는 프록시 체인)이 존재한다
      - 데이터 신뢰도 등급이 기록되었다
    applicableTracks: [greenfield, brownfield]
    stateTransitions: { onComplete: S2, onHold: S1, onKill: terminal }
    gates: [screening]

  - id: S2
    name: 기회 발굴
    objective: 무엇을 할 것인가? — 가치사슬상 사업 기회를 등록·평가한다
    inputs:
      - 시장 규모·성장 추정 (S1)
      - 가치사슬 구조 (S1)
    outputs:
      - 기회 퍼널(매력도 포함)
    entryCriteria:
      - S1 산출물 존재
    activities:
      - id: opportunity-discovery
        agent: market-intelligence-agent
        skills: [insight-synthesis]
        procedure: [opportunity-discovery, greenfield-screening, brownfield-screening]
      - id: business-model-sketch
        agent: greenfield-agent
        skills: [scenario-planning]
        procedure: [opportunity-discovery, greenfield-screening, brownfield-screening]
    requiredArtifacts:
      - 기회 등록(가치사슬 노드·매력도)
    completionCriteria:
      - 최소 1개 기회가 등록되고 매력도가 평가되었다
    applicableTracks: [greenfield, brownfield]
    stateTransitions: { onComplete: S3, onHold: S2, onKill: terminal }
    gates: [screening]

  - id: S3
    name: 시너지·전략적 적합성
    objective: 우리가 해야 하는가? — 자사 역량과의 시너지를 평가한다
    inputs:
      - 후보 기회 (S2 기회 퍼널)
      - 자사 역량·포트폴리오 정보 (그룹/계열사 분석 산출 — 그룹/계열사 프로파일)
    outputs:
      - 시너지 점수
      - 전략적 적합성 평가
    entryCriteria:
      - S2 완료 (selected 기회 존재)
    activities:
      - id: strategic-fit-screening
        agent: process-governance-manager
        skills: [strategic-fit-screening, portfolio-fit-assessment]
        procedure: [greenfield-screening, brownfield-screening]
      - id: synergy-analysis
        agent: risk-officer
        skills: [assumption-audit]
        procedure: [greenfield-screening, brownfield-screening]
        # 시너지 정합성 화면 — 대상은 그룹/계열사 레지스트리(계열사 또는 그룹 전체)이며,
        # S2 기회를 연결해 분석하고 완료 시 opportunity.synergy_score 권고를 기록한다 (ADR-0090).
      - id: our-company-profile
        agent: financial-analyst
        skills: [historical-financial-analysis, company-intelligence]
        procedure: [company-profile-analysis]
        # 그룹/계열사 프로파일 — 자사 강점/약점·산업 노출을 버전 누적으로 관리 (S3 입력, ADR-0080·0089).
    requiredArtifacts:
      - 시너지 평가
      - 전략적 적합성 판단
    completionCriteria:
      - 기회에 synergy_score와 근거가 기록되었다
      - 적합성 판단(Go/Hold/Kill 권고)이 존재한다
      - 최소 1개 기회가 selected 상태이다 (시너지·적합성 평가 후 선정)
      # 게이트 권고 조합 로직(fit=Go & synergy≥60→Go, fit=Kill or synergy<40→Kill, 그 외→Hold)은
      # 시너지 점수가 40 미만이면 사람의 Hold 판정보다 우선해 Kill을 권고할 수 있다 —
      # 이 경우 권고 근거를 기록하고 사람이 최종 판단한다 (경계 #2: 자동 판정 아님)
    applicableTracks: [greenfield, brownfield]
    stateTransitions: { onComplete: S4, onHold: S3, onKill: terminal }
    gates: [screening]

  - id: S4
    name: 진출방식 결정
    objective: "어떻게 들어갈 것인가? — Greenfield(자체 역량 진출) vs Brownfield(기존 기업·자산 결합)를 결정한다. Brownfield ≠ M&A — M&A·JV·전략적 투자·소수점 지분·파트너십·R&BD·사내벤처(CVC) 중 Route를 고른다"
    inputs:
      - 시너지·적합성 평가
    outputs:
      - 라우트 결정 기록
    entryCriteria:
      - S3 완료
    activities:
      - id: route-strategy
        agent: pm
        skills: [deal-execution-playbook, jv-structuring, partner-sourcing-strategy]
        procedure: [greenfield-pre-fs, brownfield-pre-fs, deal-shape-chain]
      - id: deal-shape-evaluation
        agent: brownfield-agent
        skills: [deal-execution-playbook]
        procedure: [greenfield-pre-fs, brownfield-pre-fs, deal-shape-chain]
      - id: route-advisory
        agent: pm
        skills: []
        procedure: [greenfield-pre-fs, brownfield-pre-fs, deal-shape-chain]
        # 결정론적 트랙 권고 엔진 — 시장 매력도·시너지 점수·시장 CAGR/불확실성·
        # 쇼트리스트 존재·역량 신호를 정규화해 권고 트랙(및 서브트랙)과 근거를
        # 산출한다. 산출물은 권고일 뿐이며 결정은 사람의 route_decision (경계 #2).
        # 구현: app/web-next/lib/track-advisory.ts · GET /api/opportunities/[id]/route-advisory
      # 채점 프레임워크: Stage 1 의도 분기(통합 vs 역량접근) → Stage 2 5criteria×20%
      # 가중채점(통제 필요도·역량 결정성·시장 불확실성·통합 역량·역량확보 속도) +
      # 사전배제(통제필요도=高 AND 파트너 지식=암묵적 → 라이선스/공동개발 배제) —
      # docs/decisions/2026-08-24-class-c-decisions.md (d), ADR-0052
    requiredArtifacts:
      - 트랙 결정(GF/BF)·근거
      - Brownfield 선택 시 Route 유형(M&A/JV/전략적 투자/소수점 지분/파트너십/R&BD/CVC)
      - 5criteria 채점 결과(통제 필요도·역량 결정성·시장 불확실성·통합 역량·역량확보 속도 각 20%)
      - 검토한 대안
    completionCriteria:
      - route_decision 레코드가 존재한다 (track 필수, greenfield는 sub_track, brownfield는 Route 유형)
      - Brownfield인 경우 5criteria 채점 결과와 사전배제 점검이 기록되었다
      - Greenfield인 경우에도 5criteria 채점 결과를 기록한다 (ADR-0104 — 트랙 간 비교 가능성)
    applicableTracks: [greenfield, brownfield]
    stateTransitions: { onComplete: S5, onHold: S4, onKill: terminal }
    gates: [screening, pre_fs]

  - id: S5
    name: 역량 평가·진출전략
    objective: 스스로 진입할 수 있는가? — 자체 역량을 평가하고 격차를 구축 방안(Build/Partner/Hire/Invest)으로 해소해 진출전략을 세운다 (Greenfield 전용 — Target Company 객체가 존재하지 않는다)
    inputs:
      - 트랙 결정 (greenfield)
      - 자사 역량·조직·인프라 정보
      - 필요 역량 목록 (S3 적합성 평가에서 도출)
    outputs:
      - 역량 격차 평가
      - 진출전략(Build/Partner/Hire/Invest)
      - Business Case 라인(비용·수익 구조)
    entryCriteria:
      - S4 완료 (track = greenfield)
    activities:
      - id: capability-assessment
        agent: greenfield-agent
        skills: [greenfield-feasibility, org-readiness-assessment]
        procedure: [greenfield-capability-assessment]
      - id: entry-strategy
        agent: greenfield-agent
        skills: [scenario-planning, talent-pipeline-planning]
        procedure: [greenfield-capability-assessment]
      - id: business-case-lines
        agent: financial-analyst
        skills: [investment-feasibility-modeling]
        procedure: [greenfield-capability-assessment]
    requiredArtifacts:
      - 역량 격차 평가
      - 진출전략(Build/Partner/Hire/Invest 결정·근거)
    completionCriteria:
      - 필요 역량 대비 보유 역량 격차와 해소 방안이 기록되었다
      - 진출전략이 결정되고 검토한 대안이 기록되었다

    # greenfield 실행 시 S6·S7은 applicableTracks 미충족으로 스킵되어 S8로 진행한다
    applicableTracks: [greenfield]
    stateTransitions: { onComplete: S6, onHold: S5, onKill: terminal }
    gates: [pre_fs]

  - id: S6
    name: 대상 후보 발굴
    objective: 누구와 결합할 것인가? — Opportunity에 진입 가능한 기존 기업·자산의 Target Universe를 정의하고 Target Company Long List를 작성한다 (Brownfield 전용)
    inputs:
      - 트랙 결정·Route 유형 (brownfield)
      - 시장 정의·가치사슬 구조 (S1)
      - 필요 역량·진입 조건 (S3)
    outputs:
      - Target Universe 정의(선정 기준·커버리지)
      - Target Company Long List(필수 속성·출처 포함)
    entryCriteria:
      - S4 완료 (track = brownfield)
    activities:
      - id: target-universe-definition
        agent: brownfield-agent
        skills: [brownfield-feasibility, competitive-intelligence]
        procedure: [brownfield-target-identification]
      - id: target-longlist
        agent: market-intelligence-agent
        skills: [company-intelligence, brownfield-feasibility]
        procedure: [brownfield-target-identification]
    requiredArtifacts:
      - Target Universe 정의
      - Target Company Long List
    completionCriteria:
      - 후보 Universe의 정의·선정 기준이 기록되었다
      - 최소 커버리지 기준을 충족하는 Long List가 존재한다
      - Long List 후보에 필수 속성과 출처/근거가 기록되었다
    applicableTracks: [brownfield]
    stateTransitions: { onComplete: S7, onHold: S6, onKill: terminal }
    gates: [pre_fs]

  - id: S7
    name: 대상 스크리닝
    objective: 어떤 대상이 유망한가? — Long List를 전략·역량·재무·소유권·규제 기준으로 스크리닝해 Target Company Short List로 좁힌다 (Brownfield 전용 — CDD/TDD는 Short List 확정 후 S9에서 수행한다)
    inputs:
      - Target Company Long List (S6)
      - 스크리닝 기준(전략적 적합성·역량 적합성·재무·지역·소유권/가용성·규제 제약)
    outputs:
      - Target Company Short List
      - Target Ranking/Score
      - Screening Evidence
      - Exclusion Reasons
    entryCriteria:
      - S6 완료 (Long List 존재)
    activities:
      - id: target-screening
        agent: brownfield-agent
        skills: [brownfield-feasibility, strategic-fit-screening, peer-benchmarking]
        procedure: [brownfield-target-screening]
      - id: ownership-regulatory-screening
        agent: antitrust-agent
        skills: [antitrust-screening, regulatory-screening]
        procedure: [brownfield-target-screening]
      - id: target-ranking
        agent: brownfield-agent
        skills: [strategic-fit-screening, brownfield-feasibility]
        procedure: [brownfield-target-screening]
    requiredArtifacts:
      - Target Company Short List
      - Target Ranking/Score
      - Exclusion Reasons
    completionCriteria:
      - 모든 Long List 후보에 랭킹 점수 또는 제외 사유가 기록되었다
      - Short List 후보가 knock-out 스크리닝을 통과했다
      - 스크리닝 근거(evidence)가 후보별로 기록되었다
    applicableTracks: [brownfield]
    stateTransitions: { onComplete: S8, onHold: S7, onKill: terminal }
    gates: [target_screening]

  - id: S8
    name: 사업성 분석
    objective: 돈이 되는가? — Greenfield는 진출전략 기반 Business Case, Brownfield는 Short List 대상 밸류에이션을 정량화한다
    inputs:
      - 트랙 결정
      - 진출전략·Business Case 라인 (greenfield — S5)
      - Short List 대상 재무 정보 (brownfield — S7)
    outputs:
      - Business Case / 밸류에이션
      - 시뮬레이션 NPV 분포
    entryCriteria:
      - "greenfield: S5 완료 / brownfield: S7 완료 (Short List 존재)"
    activities:
      - id: business-case-modeling
        agent: financial-analyst
        skills: [growth-projection-modeling, investment-feasibility-modeling]
        procedure: [greenfield-fs, brownfield-fs]
      - id: valuation
        agent: valuation-agent
        skills: [dd-to-valuation-bridge, monte-carlo-simulation]
        procedure: [greenfield-fs, brownfield-fs]
      - id: quant-methods
        agent: quant-methodologist
        skills: [wacc-input-session, monte-carlo-simulation]
        procedure: [greenfield-fs, brownfield-fs]
    requiredArtifacts:
      - Business Case(비용·수익 라인 또는 밸류에이션)
      - 시뮬레이션 NPV 분위수
    completionCriteria:
      - 민감도가 포함된 정량 평가가 존재한다 (시뮬레이션 또는 밸류에이션 범위)
    applicableTracks: [greenfield, brownfield]
    stateTransitions: { onComplete: S9, onHold: S8, onKill: terminal }
    gates: [fs]

  - id: S9
    name: 실사·검증
    objective: 사실인가? 위험은 무엇인가? — 트랙별 실사 체크리스트를 수행한다 (brownfield는 Short List 대상 DD, greenfield는 실현가능성 검증)
    inputs:
      - 게이트 체크리스트 (commercial/technical/legal)
      - 조사 근거
    outputs:
      - DD 체크리스트 판정
      - 조사내역(dd_finding)
    entryCriteria:
      - S8 완료
    activities:
      - id: commercial-dd
        agent: commercial-dd-agent
        skills: [commercial-due-diligence]
        procedure: [greenfield-dd, brownfield-dd]
      - id: technical-dd
        agent: technical-dd-agent
        skills: [technical-due-diligence, site-infrastructure-assessment]
        procedure: [greenfield-dd, brownfield-dd]
      - id: legal-dd
        agent: legal-counsel
        skills: [legal-due-diligence, regulatory-screening]
        procedure: [greenfield-dd, brownfield-dd]
      - id: dd-waiver-review
        agent: compliance-officer
        skills: [waiver-management]
        procedure: [greenfield-dd, brownfield-dd]
        # 필수 항목 미충족은 활성 waiver 없이는 게이트를 통과할 수 없다
        # (kill criteria: "waiver 불가능한 필수 항목"). waiver 요청·승인·만료를
        # 이 활동이 소유한다 — skills/waiver-management.
    requiredArtifacts:
      - DD 체크리스트 판정(필수 항목 해소)
    completionCriteria:
      - 적용 체크리스트의 모든 항목이 판정되고 필수 미충족이 0건이다
    applicableTracks: [greenfield, brownfield]
    stateTransitions: { onComplete: S10, onHold: S9, onKill: terminal }
    gates: [dd]

  - id: S10
    name: 투자구조 설계
    objective: "어떤 그릇으로, 어떤 자금으로 들어갈 것인가? — 비히클(direct/SPC/holdco/내부 스핀오프/JV)과 ADR-0045 4대 축(절세 구조·책임 격리·재무 레버리지·엑싯 구조)을 검토하고 자금조달 계획(sources & uses)을 균형시킨다 (IC 심의의 입력 설계)"
    inputs:
      - S8 채택 Business Case
      - S9 DD 발견사항(dd_finding value_impact 포함)
      - WACC·hurdle 입력값
    outputs:
      - 투자구조 가설(4축 검토 완료 — deal_structure_review 아티팩트 참조)
      - 자금조달 계획(sources & uses 균형·자금 확정성 증빙)
    entryCriteria:
      - S9 완료
    activities:
      - id: deal-structure-hypothesis
        agent: brownfield-agent
        skills: [investment-vehicle-structuring]
        procedure: [deal-structuring, brownfield-fs, deal-shape-chain]
        # 비히클(direct/SPC/holdco/internal_venture_spinoff/jv)·자산/주식·지분·
        # 수표/instrument 믹스 가설을 세우고 4대 축 노트(절세·책임격리·
        # 레버리지·엑싯)를 기록한다. 완료 플래그는 근거 아티팩트 참조가
        # 필수인 별도의 심사 행위다 (deal-structure-hypothesis.repository).
      - id: financing-plan
        agent: valuation-agent
        skills: [financing-plan-review]
        procedure: [deal-structuring]
        # sources & uses를 수집해 균형(조달=사용)을 맞추고, 커버넌트 여력·
        # 자금 확정성 증빙을 IC 패키지에 첨부 가능한 형태로 남긴다.
    requiredArtifacts:
      - 투자구조 가설(4축 검토 완료)
      - 자금조달 계획(sources & uses 균형)
    completionCriteria:
      - 최신 투자구조 가설의 4축 검토(절세 구조·책임 격리·재무 레버리지·엑싯 구조)가 근거 아티팩트 참조와 함께 완료되었다
      - 자금조달 sources와 uses 합계가 균형을 이루고 0보다 크다
    applicableTracks: [greenfield, brownfield]
    stateTransitions: { onComplete: S11, onHold: S10, onKill: terminal }
    gates: []

  - id: S11
    name: 투자심사·실행
    objective: "투자할 것인가? — 투자 구조(Deal/Investment Structure: 비히클·자금 조달·지급 구조)를 설계하고 IC 패키지로 Entity/Group IC 심사를 받는다"
    inputs:
      - IC 패키지(사업계획·DD·RAG·검토)
      - 투자 구조안(S10 투자구조 설계의 산출물 — 비히클·4축 검토·자금조달 계획)
      - 사람 최종 승인 산출물
    outputs:
      - IC 결정
      - 투자 구조 확정(비히클·자금 조달 mix·지급 일정)
      - 설립 완료 법인(신설 법인 — 사내벤처·자회사, origin∈{internal,joint})
      - 실행 진입(PMI / 벤처 모니터링 / R&BD 실행)
    entryCriteria:
      - S10 완료
    activities:
      - id: ic-preparation
        agent: pm
        skills: [executive-presentation, sample-driven-report-writing]
        procedure: [entity-ic-review, group-investment-review]
        # 위원회 정량 스코어카드(좌석별 5기준 1~3 채점 집계)와 회의록 생성·확정은
        # 이 활동의 구현 일부다 — app/web-next/lib/committee-scorecard.ts.
        # 게이트 일시정지 시 위원회 브리핑 팩(회의록 초안·프로세스 스냅샷)을
        # 자동 첨부한다 — app/web-next/lib/briefing-pack.ts (E1 자동화).
      - id: charter-baseline
        agent: pm
        skills: []
        procedure: [entity-ic-review]
        # 추진계획(차터) 기준선: 목적·트랙 근거·진출 범위·KPI 선커밋을 S1~S7
        # 산출물로부터 조립해 IC 심의 입력으로 제출한다. KPI 선커밋은 S11
        # 스코어카드 목표값으로 자동 병합된다. 변경은 append-only 이력으로 기록.
        # 구현: app/web-next/lib/project-charter.ts · GET/POST /api/projects/[id]/charter
      - id: investment-structuring
        agent: brownfield-agent
        skills: [investment-vehicle-structuring, financing-plan-review]
        procedure: [entity-ic-review, jv-lifecycle-governance]
        # jv-lifecycle-governance는 Route가 JV인 경우에 적용한다 (설립·거버넌스·
        # 출구 전 라이프사이클 약속의 기준선).
      - id: risk-review
        agent: risk-officer
        skills: [legal-risk-register]
        procedure: [entity-ic-review, group-investment-review]
      - id: group-review
        agent: group-review-agent
        skills: [group-level-review]
        procedure: [entity-ic-review, group-investment-review]
      - id: entity-establishment-execution
        agent: process-governance-manager
        skills: [legal-due-diligence, k-law, certification-transferability, org-readiness-assessment, stage-gate-governance]
        procedure: [entity-establishment-execution]
        # origin∈{internal,joint}에서만 적용 (ADR-0047) — 절차 applies_when이 강제한다.
        # Entity IC 승인 후 실행: 설립준비(관할·주식구조·이사회 결의) → 법인등기·정관·
        # 사업자등록 → 신설법인 인허가 이전/재발급 분류 → 인력이전(신 근로계약+PIIA) →
        # 완료확인(IP양도체인·거버넌스 베이스라인, JV는 이사회·데드락 조항 추가검증).
      - id: pmi-kickoff
        agent: pmi-agent
        skills: [pmi-planning]
        procedure: [pmi-integration-execution]
        # 실행 진입(PMI) — brownfield(M&A/JV/전략적 투자)에서 Entity/Group IC 승인
        # 이후 통합 계획 기준선을 수립한다. 시너지 실현 추적과 통합 리스크 평가의
        # 초기 스냅샷을 S11 사후관리로 이관한다.
    requiredArtifacts:
      - IC 패키지
      - 추진계획(차터) 기준선 — 목적·트랙 근거·진출 범위·KPI 선커밋
      - 사람 최종 승인(reviewer 기록)
      - 설립 실행 기록(설립준비·등기·인허가 분류·인력이전·완료확인 — chk-entity-formation 증적, origin∈{internal,joint})
    completionCriteria:
      - Entity IC와 Group IC 승인이 모두 기록되었다
      - 추진계획(차터) 기준선이 확정되고 append-only 변경 이력이 시작되었다
      - origin∈{internal,joint}인 프로젝트는 entity-establishment-execution 5단계 완료 기록이 존재한다
    applicableTracks: [greenfield, brownfield]
    stateTransitions: { onComplete: S12, onHold: S11, onKill: terminal }
    gates: [entity_ic, group_ic]

  - id: S12
    name: 사후 관리
    objective: 투자 후 사업이 궤도에 올랐는가? — 포트폴리오 성과를 모니터링한다
    inputs:
      - IC 승인 결정
      - 실행 계획
    outputs:
      - 포트폴리오 스코어카드
      - 사업 성과 리포트
      - 포트폴리오 전환 결정(어휘 5종: next_tranche_released / held_evidence_incomplete / graduate_to_core / reduce_or_divest / kill_with_learning_captured)
    entryCriteria:
      - S11 완료 (IC 승인, internal/joint는 설립 실행 완료 포함)
    activities:
      - id: portfolio-monitoring
        agent: group-review-agent
        skills: [portfolio-fit-assessment]
        procedure: [portfolio-venture-monitoring]
    requiredArtifacts:
      - 벤처 스코어카드
    completionCriteria:
      - 분기별 스코어카드 갱신
      # 이 단계의 kill/graduate는 S1~S11의 Kill Criteria와 범주가 다른 포트폴리오 거버넌스 결정이다
      # (procedures/_shared/portfolio-venture-monitoring — venture-portfolio-ic 결정 어휘 5종)
    applicableTracks: [greenfield, brownfield]
    stateTransitions: { onComplete: terminal, onHold: S12, onKill: terminal }
    gates: []
