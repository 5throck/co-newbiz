# process/stages.yaml - DEG Stage axis export of the co-newbiz gate ladder.
# v2 gate order (ADR-0187 M3, flow.spec 2.14.0): Screening -> Pre-FS ->
# Target Screening (brownfield only) -> FS -> DD -> Entity IC -> Group IC ->
# Post-Close. Stage ids are stable (process/stage-aliases.yaml maps procedure
# gate names onto them); `order` carries the sequence. From P1 this file is
# checked against a projection of flow.spec (check-stages-derived) and must not
# be hand-edited beyond that projection.
schema_version: "1.0"
variant: co-newbiz
stages:
  - id: G1
    title: Screening
    order: 1
    purpose: >-
      Initial opportunity and company screening. Entry station for all chains,
      including the deal-shape chain, which runs parallel to the market-shaped
      chains rather than inside the sequential gate ladder. Comprehensive
      knock-out screens assess market position, regulatory compliance, and
      strategic fit at the thesis level.
    entry_criteria:
      - "An opportunity or candidate company has been registered with a deal thesis."
      - "Initial market and company data sufficient for preliminary screening is available."
    exit_criteria:
      - "A screening verdict (Go/Kill/Hold/Recycle) is recorded with written feedback."
      - "Market attractiveness, strategic-fit knock-outs and the synergy score are evaluated against the gate criteria."
    owner_agent: brownfield-agent

  - id: G3
    title: Pre-FS
    order: 2
    purpose: >-
      Pre-feasibility route decision (flow.spec S4-S6). Records the track
      decision (Green Field vs Brown Field) and, for Brown Field, the route type
      with its five-criteria scoring; confirms WACC/hurdle inputs in a session
      and screens certification transferability where load-bearing. Green Field
      continues with the capability assessment and entry strategy (S5); Brown
      Field defines the target universe and long list (S6).
    entry_criteria:
      - "A Screening GO is recorded for the opportunity."
      - "Market, competitive structure, value chain and the S3 capability gap are available as route inputs."
    exit_criteria:
      - "A route decision with its rationale and the alternatives considered is recorded (Brown Field: route type and five-criteria scoring)."
      - "Track-specific follow-up input exists (Green Field: capability assessment; Brown Field: target universe definition and long list)."
      - "Certification transferability is confirmed from the certifying body's rules where load-bearing (bf-03)."
    owner_agent: pm

  - id: G2
    title: Target Screening
    order: 3
    purpose: >-
      Brownfield-only target shortlisting (flow.spec S7). Narrows the long list
      from Pre-FS to a short list via knock-out screens and ranked scoring using
      desk research only. Greenfield chains advance from G3 (Pre-FS) directly to
      G4 (FS); G2 is a stage in the ordering lattice, not a mandatory traversal
      for every chain.
    entry_criteria:
      - "A Pre-FS GO is recorded and a target long list exists (S6 target identification)."
      - "Desk research data on candidates is available."
    exit_criteria:
      - "A target shortlist ranked by fit and financial attractiveness is confirmed."
      - "At least one target passes all knock-out criteria."
    owner_agent: brownfield-agent

  - id: G4
    title: FS
    order: 4
    purpose: >-
      Feasibility study (flow.spec S8). Quantifies the business case (Green
      Field) or a valuation per short-listed target (Brown Field) with a
      simulated NPV distribution, BEP and input snapshot; Brown Field compares
      targets and a person records the target selection.
    entry_criteria:
      - "Green Field: Pre-FS GO with capability assessment and entry strategy; Brown Field: Target Screening GO with a short list."
      - "WACC and hurdle IRR are user-confirmed (neb-policy section 2.2)."
    exit_criteria:
      - "A quantified business case or valuation range with sensitivity exists (Brown Field: per target, with comparison and a human target selection)."
      - "Data confidence assessment is recorded."
    owner_agent: financial-analyst

  - id: G5
    title: DD
    order: 5
    purpose: >-
      Commercial, technical, legal, and HR due diligence. Validate all value
      drivers and risks. All DD findings recorded with quantified value impact.
      Complete the deal-structure hypothesis and financing plan review.
    entry_criteria:
      - "FS is complete and data confidence sufficient to proceed with deep dive."
      - "Target has passed all prior gate kills."
    exit_criteria:
      - "All DD findings are recorded with value_impact (integer, unit = KRW millions) per ADR-0061."
      - "Deal-structure hypothesis with four-axis review (tax / liability / leverage / exit) is documented."
      - "Financing plan sources & uses and commitment evidence are assembled."
    owner_agent: commercial-dd-agent

  - id: G6
    title: Entity IC
    order: 6
    purpose: >-
      Entity-level investment committee review and approval decision. AI proposes
      a RAG grade; human reviewers confirm, correct with reasons, or request
      more work. Gate approval belongs to humans per design boundary #2.
    entry_criteria:
      - "All DD evidence and deal structure are complete."
      - "IC memo per template is assembled with RAG table, DD findings, and reviewer sign-off prepared."
    exit_criteria:
      - "Entity IC committee decision is recorded: approved / rejected / conditional."
      - "If approved, group-level investment ranking begins at G7."
    owner_agent: risk-officer

  - id: G7
    title: Group IC
    order: 7
    purpose: >-
      Group-level strategic ranking and approval. Rank this proposal against
      concurrent group_agenda entries. A ranking decision (not yes/no approval)
      that determines capital allocation priority. Per ADR-0029.
    entry_criteria:
      - "Entity IC has approved the proposal."
      - "Concurrent proposals for ranking are available."
    exit_criteria:
      - "Group IC ranking decision is recorded: approved / rejected / conditional."
      - "Execution starts only after the Group IC GO (ADR-0187 D7): entity or business-unit establishment, PMI kickoff, or the greenfield execution baseline."
    owner_agent: group-review-agent

  - id: G8
    title: Post-Close
    order: 8
    purpose: >-
      Post-close integration, JV lifecycle governance, and venture-portfolio
      monitoring. Gate slot added after Entity IC per ADR-0052. Covers PMI
      (private-market integration), JV governance transitions, and portfolio
      venture stage monitoring.
    entry_criteria:
      - "Entity acquisition or venture investment is closed."
      - "PMI plan or JV governance framework is in place."
    exit_criteria:
      - "BAU (business-as-usual) exit has been certified (PMI: synergy run-rate verified)."
      - "Venture funding tranche released or kill decision recorded with learning captured."
    owner_agent: bau-exit-certifier
