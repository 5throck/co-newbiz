# MCP coverage exclusions — Wave M (ADR-0154 §4, design 2026-10-08-wave-m-mcp-parity §5.3).
#
# Everything listed here is HUMAN-ONLY (boundary #2: gate approval, investment
# decision, closure, and PMI kickoff belong to people). scripts/co-newbiz/
# mcp-coverage.ts fails when any tool in the registry covers an excluded
# activity, declares an excluded route, or matches a forbidden tool-name
# pattern, and when the in-process route guard (HUMAN_ONLY_ROUTES in
# app/web-next/lib/mcp/in-process-port.ts) does not refuse a listed route.
#
# kinds:
#   activity     ref = flow.spec activity id; no tool may list it in stageActivities
#   tool_pattern pattern = regex; no tool name may match
#   route        route = "METHOD /api/path/{}"; no tool may declare a matching route
#   body_action  route + field + value; every tool wrapping the route must refuse
#                the value (blockedBodyValues) and the in-process guard must too
#
# `inprocess: false` marks routes the in-process port never loads at all (they
# are absent from its route table), so no HUMAN_ONLY_ROUTES rule is required.
version: 1
exclusions:
  - id: pmi-kickoff-activity
    kind: activity
    ref: pmi-kickoff
    reason: PMI kickoff is a human act after IC approval (ADR-0100); no tool at all.
  - id: closure-tools
    kind: tool_pattern
    pattern: "^(close_|reopen_|kickoff_|start_pmi|execute_|confirm_proposal|approve_proposal|reject_proposal)"
    reason: Closure, PMI kickoff, and proposal confirmation have no tool (ADR-0152, ADR-0154 §5).
  - id: project-close
    kind: route
    route: "POST /api/projects/{}/close"
    reason: Typed closure is human-only (ADR-0152).
  - id: project-close-patch
    kind: route
    route: "PATCH /api/projects/{}/close"
    reason: Closure edits are human-only (ADR-0152).
  - id: opportunity-close
    kind: route
    route: "POST /api/opportunities/{}/close"
    reason: Opportunity closure is human-only (ADR-0152).
  - id: pmi-kickoff-route
    kind: route
    route: "POST /api/projects/{}/pmi/kickoff"
    reason: PMI kickoff is human-only; planning drafts use key-talent and synergy-certification.
  - id: gate-decision-opportunity
    kind: route
    route: "POST /api/opportunities/{}/gate-decisions"
    reason: Gate decisions execute from the confirm page in a human session (propose_gate_decision).
  - id: gate-decision-project
    kind: route
    route: "POST /api/projects/{}/gate-decisions"
    reason: Gate decisions execute from the confirm page in a human session (propose_gate_decision).
  - id: route-decision
    kind: route
    route: "POST /api/opportunities/{}/route-decision"
    reason: The route decision executes from the confirm page (propose_route_decision).
  - id: case-adoption
    kind: route
    route: "POST /api/projects/{}/business-case/adopt"
    reason: Case adoption executes from the confirm page (propose_case_adoption).
  - id: legacy-model-cleanup
    kind: route
    route: "POST /api/projects/{}/business-case/legacy-cleanup"
    reason: Legacy model cleanup (delete or archive pre-ADR-0143 models) is a human-only click (ADR-0158).
  - id: ev-band-confirmation
    kind: route
    route: "POST /api/projects/{}/business-case/ev-band"
    reason: Human-only EV/Revenue band confirmation, boundary #2 (agents may only propose).
  - id: project-business-goals
    kind: route
    route: "POST /api/projects/{}/business-goals"
    reason: Human-only project goal setting, boundary #2 (agents may only propose; ADR-0159).
  - id: greenfield-scope
    kind: route
    route: "POST /api/projects/{}/greenfield-scope"
    reason: Human-only site_required single-person confirmation and sub-track selection opt-in (ADR-0160 addendum, boundary #2).
  - id: greenfield-workspace-opt-in
    kind: route
    route: "POST /api/projects/{}/greenfield-scope/workspace-opt-in"
    reason: Human-only S9 workspace scope opt-in with migration_note (ADR-0160 addendum b, boundary #2).
  - id: brownfield-workspace-opt-in
    kind: route
    route: "POST /api/projects/{}/brownfield-scope/workspace-opt-in"
    reason: Human-only brownfield S9 workspace scope opt-in with migration_note (ADR-0162, boundary #2).
  - id: capex-tranches
    kind: route
    route: "POST /api/projects/{}/capex-tranches"
    reason: Human-only capex tranche records and release/withhold decisions (ADR-0160 addendum, boundary #2).
  - id: execution-baseline
    kind: route
    route: "POST /api/projects/{}/execution-baseline"
    reason: Human-only greenfield S11 execution baseline entries and single-person confirmation with rationale (ADR-0161, boundary #2).
  - id: post-management-scorecard
    kind: route
    route: "POST /api/projects/{}/post-management/scorecard"
    reason: Human-only greenfield S12 scorecard cycle with the venture_class default and audited override (ADR-0161, boundary #2).
  - id: policy-migration
    kind: route
    route: "POST /api/projects/{}/policy-migration"
    reason: Human-only ADR-0161 retroactive policy_migration audit entry, recorded by the process owner (project lead) with a migration_note (boundary #2).
  - id: dd-custom-item-propose
    kind: route
    route: "POST /api/projects/{}/dd-checklist/custom"
    reason: A direct custom DD item proposal is a human act recorded with the proposer for the two-person review; agents propose through tailor_dd_checklist (ADR-0099, boundary #2).
  - id: target-selection
    kind: route
    route: "POST /api/projects/{}/target-selection"
    reason: Target selection executes from the confirm page (propose_target_selection).
  - id: transition-decision
    kind: route
    route: "POST /api/projects/{}/transition-decision"
    reason: The transition decision executes from the confirm page (propose_transition_decision).
  - id: charter-confirm
    kind: route
    route: "POST /api/projects/{}/charter/confirm"
    reason: Charter baseline confirmation stamps a human_final review (propose_approval, subject charter_baseline).
  - id: dd-checklist-judgment
    kind: route
    route: "PUT /api/projects/{}/dd-checklist/state"
    reason: A checklist judgment stamps a human_final review (propose_approval, subject dd_checklist_judgment).
  - id: dd-target-open
    kind: route
    route: "POST /api/projects/{}/dd/targets"
    reason: Opening DD on another shortlisted target is a human, cost-bearing act with a recorded rationale (ADR-0157); an agent may only suggest it through propose_approval.
  - id: four-axis-completion
    kind: body_action
    route: "POST /api/projects/{}/deal-structure"
    field: action
    value: complete_four_axis
    reason: Four-axis completion stamps a human_final review (propose_approval, subject four_axis_completion).
  - id: synergy-confirm
    kind: route
    route: "POST /api/opportunities/{}/synergy-confirm"
    reason: The synergy score is an AI recommendation; its confirmation is the human act (boundary #2).
  - id: synergy-confirm-withdraw
    kind: route
    route: "DELETE /api/opportunities/{}/synergy-confirm"
    reason: Withdrawing a human confirmation is a human act.
  - id: target-rerank
    kind: route
    route: "POST /api/brownfield/{}/targets/{}/rerank"
    reason: Short List rank order is confirmed by a person, separate from the computed scores.
  - id: waiver-decision
    kind: route
    route: "PATCH /api/projects/{}/waivers/{}"
    reason: A waiver is a human-owned instrument; requests are filed, decisions are human.
  - id: dd-tailor-review
    kind: route
    route: "PUT /api/projects/{}/dd-checklist/tailor/{}/review"
    reason: Approving a proposed custom DD item is a human review.
  - id: opportunity-promote
    kind: route
    route: "POST /api/opportunities/{}/promote"
    reason: Promotion to a project is a human act.
  - id: establishment-complete
    kind: body_action
    route: "PUT /api/projects/{}/establishment"
    field: status
    value: done
    reason: Completing an entity-establishment step is a human act with recorded evidence (ADR-0165, boundary #2); agents may record in_progress, halted and escalated only.
  - id: establishment-complete-opportunity
    kind: body_action
    route: "PUT /api/opportunities/{}/establishment"
    field: status
    value: done
    reason: Same human-only completion boundary on the legacy opportunity projection (ADR-0165).
  - id: establishment-assignee
    kind: route
    route: "PUT /api/projects/{}/establishment/assignee"
    reason: Assigning the person responsible for an establishment step is an accountability act (ADR-0165, boundary #1/#2).
  - id: establishment-reopen
    kind: route
    route: "POST /api/projects/{}/establishment/reopen"
    reason: Reopening a completed establishment step is an audited human act with a mandatory reason (ADR-0165, boundary #2).
  - id: establishment-mode
    kind: route
    route: "PUT /api/projects/{}/establishment-mode"
    reason: Choosing or changing the Green Field establishment mode (new entity vs business unit) is part of the S10 structure decision, a human act (ADR-0167, boundary #2); agents propose it through propose_establishment_mode and a person confirms.
  - id: capability-attainability-confirm
    kind: route
    route: "POST /api/projects/{}/capability-attainability/confirm"
    reason: Confirming a required-capability attainability judgement is a human act (ADR-0168, boundary #2); agents may only save drafts through the PUT, never confirm.
  - id: capability-attainability-confirm-s5
    kind: route
    route: "POST /api/opportunities/{}/capability-attainability/confirm"
    reason: The S5 edit surface of the same judgement (ADR-0171); confirming is a human act (ADR-0168, boundary #2), agents only save drafts through the PUT.
  - id: proposal-confirm
    kind: route
    route: "POST /api/proposals/{}/confirm"
    inprocess: false
    reason: Only a human web session confirms a proposal; an agent identity cannot (design §6.3).
  - id: proposal-reject
    kind: route
    route: "POST /api/proposals/{}/reject"
    inprocess: false
    reason: Only a human web session acts on a proposal.
