name: Visual Smoke

# T-20261022-050 — visual/layout smoke over the 12 stage paths (both tracks):
# real login, live-shaped demo data, head/strip/primary geometry invariants and
# opt-in screenshot aHash diffs (tests/e2e-visual).
#
# Review F-13 (2026-11-22) split the former single continue-on-error job into
# two steps with different severities:
#   - GEOMETRY ASSERTIONS are the durable gate and now BLOCK: the step runs
#     with E2E_VISUAL_DIFF unset (the test suite only throws screenshot-diff
#     findings in `check` mode), carries no continue-on-error, and a failure
#     turns the workflow red with ::error annotations. The previous
#     job-level continue-on-error painted a scheduled-run geometry failure
#     (run 43860220505: 0 pass / 1 fail) green — a red gate structurally
#     indistinguishable from green.
#   - SCREENSHOT aHash DIFF stays advisory: the step runs with
#     E2E_VISUAL_DIFF=check under continue-on-error so font-raster/chart
#     jitter cannot fail the workflow while the baselines mature. It runs
#     `if: always()` so a geometry failure still produces the advisory
#     evidence rather than being skipped.
# The screenshot diff activates once baselines are committed under
# tests/e2e-visual/__screenshots__ (generate locally with
# `E2E_VISUAL_DIFF=update bun run test:visual`).

on:
  workflow_dispatch:
  schedule:
    # Weekly, Mondays 03:20 UTC — off the top of the hour on purpose.
    - cron: "20 3 * * 1"

permissions:
  contents: read

jobs:
  visual-smoke:
    name: Stage-path visual smoke (12 paths x 2 tracks)
    # macos-latest matches the committed aHash baseline provenance (generated on
    # macOS; ubuntu font rasterization drifts the 64-bit hashes past tolerance).
    runs-on: macos-latest
    # Two full suite runs (geometry + diff check); the suite's own internal
    # ceiling is 900s per run, so 45 keeps headroom over the doubled wall time.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.x"

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          bun install --frozen-lockfile --cwd app/web-next

      # Prerequisite: the headless browser the spec drives. playwright-core
      # (already a web-next dependency) ships no browser — install Chromium
      # exactly like the quality.yml e2e job does.
      - name: Install Chromium for Playwright
        run: bunx --bun playwright-core install --with-deps chromium
        working-directory: app/web-next

      # Blocking gate (F-13): geometry invariants only — E2E_VISUAL_DIFF unset
      # means the suite never throws screenshot-diff findings, so every failure
      # here is a real layout regression. pipefail keeps the tee'd log honest.
      - name: Run visual smoke (geometry assertions — blocking)
        id: geometry
        shell: bash
        env:
          E2E_VISUAL_DIFF: ""
        run: |
          set -o pipefail
          bun run test:visual 2>&1 | tee /tmp/visual-geometry.log

      - name: Annotate geometry failures
        if: failure()
        shell: bash
        run: |
          grep -E "\((fail|error)\)" /tmp/visual-geometry.log | head -20 | while IFS= read -r line; do
            echo "::error::${line}"
          done
          echo "::error::visual smoke GEOMETRY assertions failed — layout invariants are merge-grade (see the 'geometry assertions — blocking' step; screenshots/geometry.json below carry the evidence)"

      # Advisory (F-13): screenshot aHash diff — continue-on-error is scoped to
      # THIS step only, and it still runs after a geometry failure (if: always)
      # so both signals land in one scheduled run.
      - name: Run visual smoke (screenshot aHash diff — advisory)
        if: always()
        continue-on-error: true
        shell: bash
        env:
          E2E_VISUAL_DIFF: check
        run: bun run test:visual

      - name: Upload screenshots and geometry snapshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-smoke-screenshots
          path: tests/e2e-visual/screenshots
          if-no-files-found: warn
