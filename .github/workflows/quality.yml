name: quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  typecheck-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.x
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: app/web-next
      - run: bun run typecheck:core

  typecheck-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.x
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: app/web-next
      - run: bun run typecheck:baseline

  typecheck-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.x
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: app/web-next
      - run: bun run typecheck:web

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.x
      - run: bun install --frozen-lockfile
      - name: Biome on files changed vs base
        env:
          # Env indirection, not inline ${{ }} in run: — github.base_ref is a
          # PR-author-influencable branch name and refnames may legally contain
          # shell metacharacters ($(), backticks, ;). CWE-78 (RT-01).
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: bunx biome ci --changed --since=origin/"$BASE_REF" --no-errors-on-unmatched
      - name: Full-repo lint report (non-blocking burn-down count)
        run: bunx biome check --reporter=summary > biome-report.txt 2>&1 || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: biome-report
          path: biome-report.txt

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.x
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: app/web-next
      - run: bun run test:coverage
      - run: bun run coverage:check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: lcov
          path: coverage/lcov.info

  # Wave C-1: Playwright golden paths + axe gate (spec 2026-10-08-wave-c-e2e-proof-design).
  # Offline by construction (LLM/DART env blanked by the harness). Hosted runs are
  # blocked by billing for now; the job is verified locally with `bun run test:e2e`.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.x
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: app/web-next
      - name: Install Chromium for Playwright
        run: bunx --bun playwright-core install --with-deps chromium
        working-directory: app/web-next
      - run: bun run test:e2e
