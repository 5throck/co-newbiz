name: quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  typecheck-core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.x
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: app/web-next
      - run: bun run typecheck:core

  typecheck-baseline:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.x
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: app/web-next
      - run: bun run typecheck:baseline

  typecheck-web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.x
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: app/web-next
      - run: bun run typecheck:web

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.x
      - run: bun install --frozen-lockfile
      - name: Biome on files changed vs base
        env:
          # Env indirection, not inline ${{ }} in run: — github.base_ref is a
          # PR-author-influencable branch name and refnames may legally contain
          # shell metacharacters ($(), backticks, ;). CWE-78 (RT-01).
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: bunx biome ci --changed --since=origin/"$BASE_REF" --no-errors-on-unmatched
      - name: Full-repo lint report (non-blocking burn-down count)
        run: bunx biome check --reporter=summary > biome-report.txt 2>&1 || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: biome-report
          path: biome-report.txt

  coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.x
      # The coverage suite spawns the python/ analysis scripts (report renderers,
      # monte_carlo.py) via python3. The hosted runner has no PyPI packages, so
      # every render/simulate test failed with ModuleNotFoundError (docx, reportlab,
      # hwpx, numpy). Install the pinned dependency set before the suite.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install -r python/requirements.txt
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: app/web-next
      - run: bun run test:coverage
      - run: bun run coverage:check
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: lcov
          path: coverage/lcov.info

  # Wave C-1: Playwright golden paths + axe gate (spec 2026-10-08-wave-c-e2e-proof-design).
  # Offline by construction (LLM/DART env blanked by the harness). Hosted runs are
  # blocked by billing for now; the job is verified locally with `bun run test:e2e`.
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.x
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: app/web-next
      - name: Install Chromium for Playwright
        run: bunx --bun playwright-core install --with-deps chromium
        working-directory: app/web-next
      - run: bun run test:e2e
