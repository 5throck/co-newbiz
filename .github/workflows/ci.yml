name: CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  # Manual runs: a one-click full CI pass on any ref. Added 2026-10-31 for fleet
  # parity with co-price's deliberate 2026-10-30 addition (design:
  # Projects/co-price/docs/designs/2026-10-30-ci-migration-drift-gate-design.md §3.1;
  # workspace design: docs/designs/2026-10-31-ci-workflow-dispatch-design.md).
  workflow_dispatch:

permissions:
  contents: read

# Same shape as quality.yml's block (review F-32): one run per ref — pushes to
# an open PR's branch were triggering redundant full CI passes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  audit:
    name: Documentation Audit
    runs-on: ubuntu-24.04 # LOCAL-PATCH(upstream-request: U-20261108-002)
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # LOCAL-PATCH(upstream-request: U-20261108-002)
        with:
          # Full history: the VERSION_MANIFEST gate derives per-file dates from
          # `git log` — a depth-1 clone collapses every date to the checkout
          # commit and makes the gate fail on any manifest generated elsewhere.
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Pinned to 1.4 minor line — `latest` can resolve to a Bun that cannot
          # parse lockfileVersion 2 written by the current toolchain. Bumped deliberately.
          bun-version: "1.4.x"

      # Dependency posture (U-20261028-020): this step installs only a ROOT
      # package.json. Projects with a scripts/-scoped package.json (no root
      # manifest) intentionally skip it — scripts/audit.ts is deliberately
      # dependency-free, so no job in this workflow relies on Bun's implicit
      # auto-install; the subpackage's own flow installs its dependencies.
      - name: Install dependencies
        if: ${{ hashFiles('package.json') != '' }}
        run: bun install --frozen-lockfile

      - name: Run audit
        run: bun scripts/audit.ts

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-24.04 # LOCAL-PATCH(upstream-request: U-20261108-002)
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # LOCAL-PATCH(upstream-request: U-20261108-002)
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Pinned to 1.4 minor line — `latest` can resolve to a Bun that cannot
          # parse lockfileVersion 2 written by the current toolchain. Bumped deliberately.
          bun-version: "1.4.x"

      - name: Install dependencies
        if: ${{ hashFiles('bun.lock') != '' }}
        run: bun install --frozen-lockfile

      - name: Security audit - dependency vulnerabilities
        shell: bash
        # Fleet dependency-vulnerability gate (2026-10-01 fleet assessment FW-1),
        # waiver-aware since T-20261003-011. Threshold: fail on high or critical;
        # low/moderate findings are reported only. The script keeps the old
        # fail-closed behavior (empty/unparseable audit output = loud infra
        # failure) and adds a REVIEWED advisory-waiver channel:
        # .github/dependency-waivers.toml suppresses specific no-fix advisories.
        # The channel itself fails closed: a malformed file, an expired
        # revisit-by date, or a stale waiver (advisory no longer in the audit
        # output, or version drift vs the installed tree) fails the job, so a
        # waiver can never decay into a silent ignore-all.
        run: bun scripts/dependency-audit.ts

      - name: External-dependency manifest gate
        # External-deps standard §5.4 E4 (design
        # docs/designs/2026-11-07-external-deps-standard-design.md,
        # DEC-20261107-02): offline `verify --manifest-only` over the project's
        # external-deps.json — strict schema parse, license policy (deny-class
        # and license-undeclared entries fail), R3 external/<id> convention,
        # .gitignore coverage, adapter presence, excluded components. No
        # network, no clone. Skipped when the project has no manifest or no CLI.
        if: ${{ hashFiles('external-deps.json') != '' && hashFiles('scripts/external-deps.ts') != '' }}
        run: bun scripts/external-deps.ts verify --manifest-only


  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-24.04 # LOCAL-PATCH(upstream-request: U-20261108-002)
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # LOCAL-PATCH(upstream-request: U-20261108-002)
        with:
          fetch-depth: 0
          persist-credentials: false

      # Run the gitleaks binary directly rather than gitleaks/gitleaks-action.
      # The action requires a GITLEAKS_LICENSE for private repositories and needs
      # pull-requests:read to annotate PRs — neither is warranted here, since all
      # this job needs is a pass/fail scan. Config comes from .gitleaks.toml.
      - name: Run gitleaks
        # Digest = ghcr.io/gitleaks/gitleaks:v8.28.0 multi-arch index
        # (fetched 2026-10-01 via the ghcr registry API, anonymous pull token).
        uses: docker://ghcr.io/gitleaks/gitleaks@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854
        with:
          args: detect --source=/github/workspace --config=/github/workspace/.gitleaks.toml --redact --verbose --no-banner

  # The former `unit-tests` job (review F-15, removed 2026-11-22) ran the unit
  # suite only behind the CI_SKIP_DEFAULT_UNIT_TESTS opt-out, which has been
  # the repository's steady state since 2026-10-01 — a dead job with a
  # misleading sibling name. The 7000+-test unit suite's CI leg is the
  # quality.yml `coverage` job (bun run test:coverage, per-file budgets via
  # scripts/test-runner.ts); this workflow runs the scripts suite only.
  #
  # PROJECT-JOBS-BEGIN
  # Real test battery (re-added 2026-09-30 — the 2026-09-22 configuration was
  # lost in the 2026-09-23 fleet resync; watch for recurrence, template reset
  # is the known cause). Tests import next/server (web-next deps) and spawn the
  # venv-first Python analysis path (python/requirements.txt into repo-root
  # .venv).
  test:
    name: Script Tests
    runs-on: ubuntu-24.04 # LOCAL-PATCH(upstream-request: U-20261108-002)
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # LOCAL-PATCH(upstream-request: U-20261108-002)

      # Pinned to match every other job: "latest" silently changes the runtime
      # under the battery and makes a red run unreproducible.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.x"

      - name: Install dependencies
        if: ${{ hashFiles('package.json') != '' }}
        run: bun install --frozen-lockfile

      - name: Install web-next dependencies
        run: bun install --frozen-lockfile --cwd app/web-next

      - name: Create python venv
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r python/requirements.txt

      # Script tests only: the unit suite's CI leg is quality.yml's coverage
      # job (see the comment above the `test` job definition).
      - name: Run script tests
        run: bun run test:scripts

