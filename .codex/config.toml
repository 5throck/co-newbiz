# Codex CLI workspace config — see docs/adr/0074-graft-fleet-integration.md and
# docs/adr/0075-codex-platform-support.md.
# Trail MCP is registered project-side; `trail mcp` resolves the repo root from the
# working directory (nearest ancestor with a context-graph index). Machine-global fallbacks
# (~/.codex/config.toml) follow the ADR-0074 per-host matrix.

[mcp_servers.trail]
command = "trail"
args = ["mcp"]
