governance_doc_id: chk-rbd-technology
layer: checklist
title: "R&BD (Research & Business Development) Technology Checklist"
scope: shared
enforceability: mixed
owner_agent: brownfield-agent
version: "1.0.0"
effective_from: "2026-08-20"
gate: DD

# R&BD is treated as a Brown Field sub-type (case_subtype: rbd), not a
# separate top-level review type — the deal is structured as an equity
# stake, license-in, or spin-off carve-out, all BF mechanics, not a new
# physical site (design v1.0 §10 user decision, 2026-08-20). This checklist
# runs IN ADDITION TO checklists/technical-dd-checklist.yaml and
# checklists/ma-special-topics-checklist.yaml when case_subtype=rbd.

items:
  - id: rbd-01
    text: "Technology Readiness Level (TRL) assessed for the core IP/technology itself, distinct from production-process TRL (technical-dd-checklist tdd-03) — an R&BD target's core risk is whether the underlying technology works at all, before production readiness is even relevant"
    mandatory: true
  - id: rbd-02
    text: "Government co-funding conditions identified if applicable: technology-fee repayment obligation (기술료), IP walk-away/ownership conditions, employment or localization conditions attached to the grant — these can survive a change of control and are easy to miss in a standard DD pass"
    mandatory: true
  - id: rbd-03
    text: "Freedom-to-operate (FTO) / IP ownership diligence completed — who actually owns the IP (the target entity, a parent/spin-off originator, a co-development partner, or a government-funded research institute) and whether license terms transfer cleanly on the contemplated deal structure"
    mandatory: true
  - id: rbd-04
    text: "Commercialization path decision documented with rationale: build as an internal business unit, license the technology out, or spin off as an independent entity — the three paths have materially different valuation, control, and risk profiles and should not default to one without an explicit comparison"
    mandatory: true
  - id: rbd-05
    text: "If the target originated as an internal venture/spin-off of another company (a real pattern — see docs/pilots/pilot-011-posco-amberoad.md), the continuing parent-entity relationship (equity retained, customer/supplier relationship, brand association, non-compete scope) is documented as part of the deal structure, not treated as fully independent"
    mandatory: true
  - id: rbd-06
    text: "Track record evidence (prior internal deployments, pilot results, disclosed performance metrics) verified against source, not accepted from the target's own pitch materials without corroboration"
    mandatory: false
  - id: rbd-07
    text: "Technology-obsolescence/substitution risk assessed on the same horizon as the investment's expected holding period — a technology that is state-of-the-art today may not be in 3-5 years"
    mandatory: false

legal_basis:
  - "design v1.0 §10 user decision (2026-08-20): R&BD treated as a Brown Field sub-type"
  - "docs/pilots/pilot-006-orion-ligachem-bio.md findings F-1/F-2 (certification and QoE steps don't fit R&D-stage/asset-tied-regulatory-pathway targets — the same gap class R&BD targets exercise)"
  - "docs/pilots/pilot-011-posco-amberoad.md"
