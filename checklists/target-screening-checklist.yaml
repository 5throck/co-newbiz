governance_doc_id: chk-target-screening
layer: checklist
title: "Target Screening Checklist (Long List → Short List)"
scope: shared
enforceability: mixed
owner_agent: brownfield-agent
version: "1.0.0"
effective_from: "2026-08-31"
gate: Target Screening

# S7 대상 스크리닝 (flow.spec v2.0.0) — Long List를 Short List로 좁히는 스크리닝.
# 두 부분 구조 (strategic-fit 체크리스트의 Cooper Gate 1 관례를 계승):
#   Part 1 (t1..t5) = 필수 통과 knock-out(충족/미충족 — 하나라도 미충족이면 해당 후보 제외,
#   사유 기록). Part 2 (t6..t9) = 권장 평가 기준(0-10, 가시적 스코어카드).
# 근거: S6 대상 후보 발굴의 Long List·Universe 정의, S1/S3 필요 역량 목록 —
# desk research만 허용, commissioned 분석 금지 (Short List 확정 후 DD에서 수행).
#
# THRESHOLDS ARE ILLUSTRATIVE: t6..t9 가중치·진입 임계치는 관행 예시이며 활성 정책이
# 아니다. 임계치 활성화는 문서화된 결정 기록이 선행되어야 한다 (ADR-0051 open (b)와 동일 규율).

items:
  # Part 1 — 필수 통과 knock-out(하나라도 미충족이면 후보 제외, Exclusion Reasons에 기록)
  # NOTE(UI coupling): t-01/t-02/t-08 판정은 Brownfield Short List 화면의
  # "인수 가능성"(참고용) 섹션에도 그대로 발췌 표시된다(app/web-next/app/
  # brownfield/page.tsx) — 이 세 항목의 문구·번호·mandatory 여부를 바꾸면
  # 해당 UI 섹션도 함께 확인/수정해야 한다.
  - id: t-01
    text: "지분 인수 가능성 — 매도자·파트너가 존재하고, 경로를 막는 미공개 락업이나 우선매수권 등 제약이 없으며, 접촉 채널이 식별되어 있다(후보별로 기록)"
    mandatory: true
    waiver_eligible: false   # 가용성은 완결 사실(completeness fact), 판단이 아님
  - id: t-02
    text: "규제 스크리닝 — 선택한 Brownfield 경로를 저지할 치명적 외국인투자 제한, 인허가 이전 장벽, 기업결합(합병규제) 우려가 알려진 바 없다. 저지 가능성이 있으면 antitrust-agent로 에스컬레이션한다"
    mandatory: true
    waiver_eligible: false
  - id: t-03
    text: "지역 적합성 — 후보의 사업 거점이 유니버스 정의의 지역 기준에 부합하거나, 사유가 기록된 예외가 존재한다"
    mandatory: true
    waiver_eligible: true
  - id: t-04
    text: "구조적 시장 위축·상품화 배제 — 후보가 속한 시장이 가격 경쟁만 남은 구조적 쇠퇴기가 아니다(Screening 단계의 상시 킬 기준)"
    mandatory: true
    waiver_eligible: true
  - id: t-05
    text: "역량 적합성 — 후보가 S1/S3에서 도출된 필요 역량 목록에 실질적으로 기여한다(대응 계획 없이 방치된 역량 갭이 없다)"
    mandatory: true
    waiver_eligible: true
  # Part 2 — 권장 평가 기준(0-10, 가중치 반영, 스코어카드로 기록)
  - id: t-06
    text: "전략적 가치 — 후보가 이 기회의 가치사슬에서 차지하는 위치와, 선언된 전략 의도(핵심/인접/전환)에 대한 전략적 기여도"
    mandatory: true
    waiver_eligible: true
  - id: t-07
    text: "역량 보완성 — 후보가 역량 갭을 얼마나 채워주는지, 기존 내부 역량과의 중복 정도"
    mandatory: true
    waiver_eligible: true
  - id: t-08
    text: "재무적 매력도 — 매출·EBITDA 규모, 성장 프로필, 마진 품질, 재무건전성을 유니버스 정의의 재무 기준과 비교(데스크 리서치 한정)"
    mandatory: true
    waiver_eligible: true
  - id: t-09
    text: "인수·파트너십 복잡도 — 선택한 경로(M&A 통합, JV 거버넌스, 파트너십 운영 결합)의 예상 복잡도와 스폰서의 소화 역량"
    mandatory: true
    waiver_eligible: true

# 출력: Target Company Short List + Target Ranking/Score + Screening Evidence +
# Exclusion Reasons (모든 Long List 후보에 랭킹 또는 제외 사유 기록 — target_screening 게이트 판정기준).
