governance_doc_id: chk-entity-formation
layer: checklist
title: "Entity Formation Checklist (Internal / Joint Origin Execution)"
scope: shared
enforceability: mixed
owner_agent: legal-counsel
version: "1.3.0"
effective_from: "2026-08-22"
gate: "Entity IC"

# Applies at EXECUTION after Entity IC approval, for origin = internal or joint
# (ADR-0047 four-value origin). Items ef-01..ef-12 are the standard formation
# sequence; ef-13..ef-18 are the JV addendum — mandatory ONLY for joint-origin
# entities (mark not-applicable for internal origin, mirroring brownfield-dd step 3's
# conditional-applicability pattern). JV governance design cross-references the
# jv-structuring skill rather than restating it.
#
# Establishment mode tags (v1.3.0, ADR-0167): every item carries `modes`, the
# Green Field establishment modes it applies to. ef-01..ef-19 are new_entity only
# (a business unit forms no legal entity; the business-unit set is
# checklists/business-unit-formation-checklist.yaml). ef-13..ef-18 additionally
# carry `origins: [joint]` (JV addendum). ef-19 applies only when a company split
# is the establishment route. gx-01..gx-03 apply to BOTH modes. A project with an
# unknown/legacy mode is read as new_entity.
#
# gx-01..gx-03 (v1.1.0, ADR-0161 Proposed) are a separate group: the greenfield
# execution baseline (procedures/_shared/greenfield-execution-baseline), which
# applies by case_type = greenfield regardless of origin and of whether a new
# entity is formed. They replace, for greenfield at S11, the closing-specific
# financing items fin-04..fin-08 (financing-plan-checklist S11 track scope).
# Mark them not-applicable for brownfield projects. Retroactively (ADR-0161
# Q2) they are recommended, not blocking, for a project that already
# completed S11.

items:
  - id: ef-01
    text: "설립 관할과 설립 법인 형태를 선정하고, 세무·규제 근거를 문서화해 승인받음"
    mandatory: true
    waiver_eligible: true
    modes: [new_entity]
  - id: ef-02
    text: "등기소에서 상호 사용 가능 여부를 확인하고 상표 사전 조사를 마침"
    mandatory: true
    waiver_eligible: true
    modes: [new_entity]
  - id: ef-03
    text: "주식 구조와 모회사·창업자별 배분을 확정하고, 최초 이사·임원을 정함"
    mandatory: true
    waiver_eligible: true
    modes: [new_entity]
  - id: ef-04
    text: "설립을 주도하는 모회사의 내부 승인을 받음 — 설립, 출자·자금 지원, 지식재산 출연을 승인하는 이사회 또는 주주총회 결의 (한국: 지식재산·사업 출연이 영업의 중요한 일부 양도에 해당하면 상법 제374조제1항제1호에 따른 주주총회 특별결의가 필요함 — 해당 여부는 법률 자문으로 확인; 2026-10-13 법제처 Open API 확인)"
    mandatory: true
    waiver_eligible: true
    modes: [new_entity]
  - id: ef-05
    text: "정관을 작성(필요 시 공증)하고 설립등기를 마치며, 본점 소재지와 (해당 관할에서 요구 시) 등록 대리인(registered agent)을 정하고, 자본금 납입을 마침"
    mandatory: true
    waiver_eligible: true
    modes: [new_entity]
  - id: ef-06
    text: "조직 문서를 체결함 — 내부 규정(bylaws), 발기인 결의(또는 발기인 서면 결정), 이사회 결의서(서면 동의), 이사 보상(indemnification) 계약"
    mandatory: true
    waiver_eligible: true
    modes: [new_entity]
  - id: ef-07
    text: "법인으로의 지식재산 이전 완료 — 설립 전 지식재산 일체(모회사의 기존 지식재산과 설립 주도팀의 성과물)를 서면으로 양도 또는 사용허락(라이선스)하고, 모든 임직원과 외주 인력이 지식재산 양도 약정(PIIA)에 서명함"
    mandatory: true
    waiver_eligible: false   # title integrity is a completeness fact — a gap here is an unwaivable establishment blocker (kill criterion ip_assignment_chain_incomplete_at_establishment)
    modes: [new_entity]
  - id: ef-08
    text: "인력 이전 완료 — 신규 근로계약서와 PIIA에 서명함; 모회사에서 인력이 오는 경우 적용되는 동의 규칙에 따라 전출(겸직·사외 근무) 또는 전적 계약을 체결함 (한국: 영업양도 시 근로관계는 판례상 원칙적으로 양수인에게 승계되며(대법원 2020. 11. 5. 선고 2018두54705), 승계 배제 특약은 해고와 같이 정당한 이유가 필요함(근로기준법 제23조제1항). 영업양도가 아닌 인력 이동은 전적(근로자 개별 동의가 필요하다는 판례는 확인 필요)·전출로 처리하고, 전출이 모회사의 업(業)으로서 사용사업주 지휘·명령 아래 근로하는 형태이면 근로자파견(파견법 제2조제1호)으로 볼 위험이 있으므로 법률 자문으로 확인; 판례·조문은 2026-10-13 법제처 Open API 확인)"
    mandatory: true
    waiver_eligible: true
    modes: [new_entity]
  - id: ef-09
    text: "그룹 내 계약을 체결함 — 그룹 내 용역 계약, 지식재산·브랜드 사용 계약, 공급·유통 계약, 비용 분담·이전가격 정책 문서화"
    mandatory: true
    waiver_eligible: true
    modes: [new_entity]
  - id: ef-10
    text: "법정 등록을 마침 — 세무 등록번호, 사업주(사용자) 등록, 영업 인허가, 업종별 허가; 국경 간 투자인 경우 외국인투자 신고"
    mandatory: true
    waiver_eligible: true
    modes: [new_entity]
  - id: ef-11
    text: "은행 계좌, 보험, 회계·감사 체계를 갖추고 법정 장부와 명부를 구비함"
    mandatory: true
    waiver_eligible: true
    modes: [new_entity]
  - id: ef-12
    text: "지배구조 기본 틀을 갖춤 — 첫 이사회 의사록, 위임전결 기준표, 컴플라이언스 일정표, 위 모든 문서를 담은 자료실(data room)"
    mandatory: true
    waiver_eligible: true
    modes: [new_entity]
  # JV addendum — joint-origin only (mandatory when origin = joint)
  - id: ef-13
    text: "합작 설립(joint) 한정: 50:50 지분에서 동수 의석의 이사 5~9명으로 이사회를 구성하고, 교착 해소 설계(독립 의장, 결정투표권, 의장 윤번제 등)를 설립 시점에 합의함"
    mandatory: true
    waiver_eligible: true
    modes: [new_entity]
    origins: [joint]
  - id: ef-14
    text: "합작 설립 한정: 상호 동의가 필요한 주요 의결 사항 목록 — 범주별·기준액 기준으로 좁게 정함(전략·사업 범위, 연간 계획·예산, 대규모 투자·자금조달, 대표이사·재무책임자 선임, 중요 특수관계인 거래, 정관 변경, 지분 경제성, 해산)"
    mandatory: true
    waiver_eligible: true
    modes: [new_entity]
    origins: [joint]
  - id: ef-15
    text: "합작 설립 한정: 기한이 구속력을 갖는 교착 해소 단계 — 경영진 조정, 이사회 결정 메모, 주주 대표 협의, 냉각기간·현상 유지(standstill), 사실·가치평가 쟁점에 대한 전문가 결정, 조정(mediation), 최종 구제 수단"
    mandatory: true
    waiver_eligible: true
    modes: [new_entity]
    origins: [joint]
  - id: ef-16
    text: "합작 설립 한정: 출구 조항을 합의함 — 사전 합의된 가치평가 산식에 따른 풋/콜 옵션, 우선매수권(ROFR)·우선협상권(ROFO), 동반매각참여권(tag)·동반매도청구권(drag), 종료 사유, 종결 절차"
    mandatory: true
    waiver_eligible: true
    modes: [new_entity]
    origins: [joint]
  - id: ef-17
    text: "합작 설립 한정: 단일 창구 경영을 확인함 — 합작법인에 대한 지시는 이사회 결정과 대표이사를 통해서만 하고, 서면 위임전결 기준표(허용 편차 범위, 긴급 한도)를 둠"
    mandatory: true
    waiver_eligible: true
    modes: [new_entity]
    origins: [joint]
  - id: ef-18
    text: "합작 설립 한정: 모회사들이 인접 시장에서 경쟁하는 경우 정보 차단 벽(firewall)·클린팀 절차를 수립함"
    mandatory: true
    waiver_eligible: true
    modes: [new_entity]
    origins: [joint]
  - id: ef-19
    text: "한국 참고(회사 분할을 설립 경로로 쓰는 경우에 한함): 분할(물적분할/인적분할)에는 분할계획서에 대한 주주총회 특별결의가 필요함(상법 제530조의3). 분할합병인 경우(상법 제530조의11 제2항)와 연대책임을 배제하는 단순분할인 경우(상법 제530조의9 제2항·제4항)에는 채권자 보호 절차가 필요함 — 알고 있는 채권자에 대한 개별 최고와 1개월 이상의 이의제출 기간을 둔 공고(두 경우 모두 상법 제527조의5 준용). 집행 근거로 쓰기 전에 국가법령정보센터의 최신 조문 원문으로 확인할 것(2026-10-13 법제처 Open API로 확인, 상법 MST 273629)."
    mandatory: false
    waiver_eligible: true
    modes: [new_entity]
  # Greenfield execution baseline — case_type = greenfield only (ADR-0161)
  - id: gx-01
    text: "신규 사업(Green Field) 한정: 자본지출(capex) 분할 집행 일정을 프로젝트의 capex_tranche 행과 S10 딜 구조 집행 조건에 연결하고 S8 채택안 capex와 대사함; 차이는 모두 발견 사항으로 기록하고 자동 수정하지 않음"
    mandatory: true
    waiver_eligible: true
    modes: [new_entity, business_unit]
  - id: gx-02
    text: "신규 사업 한정: 램프업 핵심 성과 목표(첫 매출, 가동률, 손익분기 도달 월, S8 채택안 대비 매출·EBITDA)를 정하고, S8 사업 목표는 차단 효력이 없는 근거로 참조함"
    mandatory: true
    waiver_eligible: true
    modes: [new_entity, business_unit]
  - id: gx-03
    text: "신규 사업 한정: 실행 기준선을 한 사람(법인 투자심의위원회 책임자 또는 위임받은 자)이 비어 있지 않은 근거와 함께 확인함; 에이전트의 확인은 인정하지 않음"
    mandatory: true
    waiver_eligible: false   # a human confirmation is not waivable (ADR-0161 Row 1 follow-up, user-approved 2026-10-12)
    modes: [new_entity, business_unit]

legal_basis:
  - "ADR-0051 (workflow gap closure — internal-origin entity-formation chain step)"
  - "procedures/_shared/entity-establishment-execution/schema.yaml (execution procedure consuming this checklist)"
  - "DLA Piper pre/post-incorporation checklists; Robinson+Cole employee IP assignment; Umbrex JV governance architecture; KLRI Commercial Act English text"
  - "skills/jv-structuring (JV governance design — cross-referenced, not restated)"
  - "procedures/_shared/greenfield-execution-baseline/schema.yaml (gx-01..gx-03 — ADR-0161)"
