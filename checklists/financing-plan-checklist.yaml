governance_doc_id: chk-financing
layer: checklist
title: "Financing Plan Checklist"
scope: shared
enforceability: mixed
owner_agent: valuation-agent
version: "1.3.0"
effective_from: "2026-08-22"
gate: FS

# Certainty of funds must be evidenced BEFORE final IC — a financing contingency
# shifts risk to the seller and weakens the bid (Goodwin). The evidence pack below
# is assembled at FS (financing-plan-review at brownfield-dd step 12) and re-tested
# as a precondition at entity-ic-review.
#
# BENCHMARKS ARE DEFAULT POLICY (DEC-20260909-05): the reverse-termination-fee range cited in fin-08
# (4-7% of enterprise value) is a market-practice benchmark from published deal
# practice, not activated policy — whether it becomes policy is ADR-0051 open
# question (c) for the thresholds meeting.
#
# S11 TRACK SCOPE (ADR-0161, Proposed; design 2026-10-11 §5.2, user decisions
# 2026-10-12): at the S11 execution and IC financing-precondition use of this
# checklist, fin-04..fin-08 are closing-specific (funds flow at closing, FX on
# the consideration, certain funds, escrow, reverse-termination fee) and are
# scoped to case_type = brownfield. For a greenfield project at S11 they are
# not applicable; their replacements are entity-formation-checklist
# gx-01..gx-03 (capex_tranche schedule bound to S10 conditions, ramp-up KPI
# targets, human baseline confirmation). fin-01..fin-03 apply to both tracks.
# fin-09 is binding (mandatory, not waivable) and is never scoped out.
# Greenfield reading of fin-09 (user-approved 2026-10-12): for case_type =
# greenfield the funds-flow requirement is read as the capex drawdown plan
# (the capex_tranche schedule plus the S10 deal-structure release
# conditions), and the FX plan applies only when there is foreign-currency
# exposure. This is a reading note, not a scope-out: fin-09 stays binding on
# both tracks and its text is unchanged.
# Item text is unchanged. Any fin-04..fin-08 record already written on a
# greenfield project stays visible as historical evidence, marked "not
# applicable under flow.spec v2.8.0" — nothing is deleted.
# This S11 scope does NOT change the S9 workspace overlays: the per-sub-track
# S9 classification of fin-04..fin-08 in checklists/_overlays/greenfield-
# workspace-scope.yaml and brownfield-workspace-scope.yaml (DEC-20261012-01)
# stays as approved. Runtime enforcement of the S11 scope is design row 2.

items:
  - id: fin-01
    text: "현금·부채·자본 구성을 만기·상환 일정과 함께 결정하고 자금 원천·용도표(sources and uses) 첨부"
    mandatory: true
    waiver_eligible: true
  - id: fin-02
    text: "서명된 확약 문서 확보 — 지분 출자 확약서(equity commitment letter); 대출 확약서(debt commitment letter) + 수수료 서한(fee letter) + 주요 조건서(term sheet) — 또는 대차대조표 자금으로 조달하는 거래라면 문서화된 내부 자금 승인 경로"
    mandatory: true
    waiver_eligible: true
  - id: fin-03
    text: "대주(lender) 조건 기준으로 재무약정 등 확약사항(covenants) 여유분·레버리지 분석 완료"
    mandatory: true
    waiver_eligible: true
  - id: fin-04
    text: "자금 흐름 메모(funds-flow memorandum) 초안 작성 — 거래종결일의 모든 유입·유출, 계좌, 시점, 외환 구간 정리"
    mandatory: true
    waiver_eligible: true
  - id: fin-05
    text: "인수 대가가 둘 이상의 통화에 걸치는 경우 외환 계획(선물환, 옵션, 거래 조건부 외환) 명시"
    mandatory: true
    waiver_eligible: true
  - id: fin-06
    text: "자금 확실성(certain funds) 조건 구조를 legal-counsel이 검토 — 대출 인출 거부(draw-stop) 조건을 인수계약의 지정 진술, 계약에 따른 실질적 거래종결, 종결 확인서로만 한정; 시장 상황 악화(market MAC)를 인출 거부·선행조건 사유로 두지 않음"
    mandatory: true
    waiver_eligible: true
  - id: fin-07
    text: "에스크로·지급 대리인 선임 및 면책(indemnity) 노출 규모 대비 에스크로 금액 산정"
    mandatory: true
    waiver_eligible: true
  - id: fin-08
    text: "인수자가 차입 조달 위험을 부담하는 경우 역해지 수수료(reverse-termination fee) 규모 산정 (예시 벤치마크: 기업가치의 4~7% — 머리말 주석 참조)"
    mandatory: false
    waiver_eligible: true
  - id: fin-09
    text: "최종 투자심의위원회(IC) 전에 IC 패키지에서 자금 확실성(certainty of funds) 입증 — fin-02에 따른 확약서 또는 내부 자금 승인, 자금 원천·용도, 재무약정 등 확약사항(covenants) 여유분, 자금 흐름 초안, 외환 계획이 모두 있어야 함; 자금 조달 증거 누락은 판단 사항이 아니라 entity-ic-review의 전제조건 불충족임"
    mandatory: true
    waiver_eligible: false   # completeness fact: the evidence pack is either present or it is not

legal_basis:
  - "ADR-0051 (workflow gap closure — financing workstream added; chain step 13)"
  - "procedures/_shared/brownfield-dd/schema.yaml step 12 (financing-plan-review), procedures/_shared/entity-ic-review/schema.yaml (precondition step)"
  - "Goodwin (deal and financing certainty); Practical Law commitment-letter and funds-flow resources; SRS Acquiom (escrow sizing)"
