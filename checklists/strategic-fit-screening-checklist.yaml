governance_doc_id: chk-strategic-fit
layer: checklist
title: "Strategic Fit Screening Checklist"
scope: shared
enforceability: mixed
owner_agent: process-governance-manager
version: "1.1.0"
effective_from: "2026-08-22"
gate: Screening

# Two-part structure per Cooper Gate 1 / HM Treasury Green Book SOC practice:
# Part 1 (sf-01..sf-05) = must-meet knock-outs (Pass/Fail — any Fail terminates or
# recycles, no further analysis). Part 2 (sf-06..sf-12) = should-meet rated criteria,
# scored 0-10 weighted on a visible scorecard. Evidence allowed at this gate: desk
# research and the sponsor's own knowledge only — no commissioned analysis.
#
# THRESHOLDS ARE ADOPTED POLICY (DEC-20260909-03, 2026-09-09): the scoring weights
# and advance thresholds cited in item texts (e.g. >=60/100 advance, 45-59
# Hold/Recycle, <45 Kill, from Cooper Gate 1 and Green Book SOC practice) are
# activated policy per ADR-0051 open question (b)'s resolution. Condition: a
# recalibration review is mandatory after the first 5 scorecard-bearing runs with
# confirmed outcomes (see the DEC record).

items:
  # Part 1 — must-meet knock-outs (any Fail = reject at screen)
  - id: sf-01
    text: "전략 부합성을 명칭으로 인용함 — 현행 전사·사업부 전략의 명명된 목표 하나 이상을 식별자로 인용하거나 참조해, 그 목표를 이 기회가 진전시킴을 보임('전략에 부합한다'는 추상적 서술은 불가)"
    mandatory: true
    waiver_eligible: true
  - id: sf-02
    text: "포트폴리오·투자 중점 영역(hunt zone) 적합성 — 사전에 선언된 투자 논제 영역 안에 있거나, 스크리닝이 끝나기 전에 포트폴리오 책임자의 예외 승인이 기록됨"
    mandatory: true
    waiver_eligible: true
  - id: sf-03
    text: "결격 사유 없음 — 알려진 치명적 안전·환경·규제·제재·평판 장벽이 없음"
    mandatory: true
    waiver_eligible: false   # a safety/regulatory showstopper is a completeness fact, not a judgment call
  - id: sf-04
    text: "전략적 의도 범주(핵심 강화 / 인접 확장 / 변혁적 도전)를 선언하고, 해당 범주의 위험 감수 수준을 후원 임원이 인지했음을 확인함"
    mandatory: true
    waiver_eligible: true
  - id: sf-05
    text: "지명된 경영진 후원자 — 임원 1인이 다음 게이트까지 이 기회를 책임지고 초기 예산을 통제함"
    mandatory: true
    waiver_eligible: true
  # Part 2 — should-meet rated criteria (0-10, weighted; scored and recorded)
  - id: sf-06
    text: "예비 시장 매력도를 점수화해 기록하고, 점수 합계가 선언된 의도 범주에 정한 통과 기준을 충족함(이 게이트에서는 문헌·자료 조사만 허용)"
    mandatory: true
    waiver_eligible: true
  - id: sf-07
    text: "승리 근거(right-to-win) 가설을 점수화해 기록함 — 일반 신규 진입자에게 없는, 당사가 가진 구체적 우위(자산, 역량, 채널, 브랜드, 데이터, 라이선스)를 하나 이상 설명할 수 있음"
    mandatory: true
    waiver_eligible: true
  - id: sf-08
    text: "시너지 논거를 점수화해 기록함 — 기존 사업(채널, 공장, 기술, 고객 기반)과의 시너지 중 단독 가치를 넘는 것이 식별됨"
    mandatory: true
    waiver_eligible: true
  - id: sf-09
    text: "역량 적합성 격차 서술을 점수화해 기록함 — 필요 역량과 현재 역량을 평가하고, 중대한 격차마다 확보 방안 후보(자체 구축 / 제휴 / 인수)를 명시함"
    mandatory: true
    waiver_eligible: true
  - id: sf-10
    text: "예비 실현 가능성을 점수화해 기록함 — 넘을 수 없는 기술·운영상 장애물이 알려져 있지 않고, 대략의 시장 출시 소요 기간이 선언된 의도 범주에 비추어 수용 가능함"
    mandatory: true
    waiver_eligible: true
  - id: sf-11
    text: "보상 대비 위험 규모를 점수화해 기록함 — 예비 기회 규모(size of the prize)가 해당 범주의 기준에 비추어 투입 노력과 위험 대비 의미 있는 수준임"
    mandatory: true
    waiver_eligible: true
  - id: sf-12
    text: "선택지 규율 — 제안이 목표 달성을 위한 둘 이상의 경로 중 하나이며, 비교용으로 최소 대응(do-minimum)·현상 유지 기준안이 기록됨"
    mandatory: true
    waiver_eligible: true

legal_basis:
  - "ADR-0051 (workflow gap closure — strategic fit at first screen)"
  - "procedures/_shared/brownfield-screening/schema.yaml step 2, procedures/_shared/greenfield-screening/schema.yaml step 1"
  - "Cooper Stage-Gate Gate 1 (Idea Screen) knock-out + scorecard design — Stage-Gate Institute"
  - "HM Treasury Green Book Five Case Model — Strategic Outline Case (strategic filter precedes full appraisal)"
